<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bee Line</title>
<meta name="description" content="Guide the bees between matching flowers on a honeycomb. Trails can't cross, and every cell must be covered.">
<meta name="theme-color" content="#fff3d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17120a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bee Line">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff3d6;
  --card:#fffaf0;
  --card-edge:#f0d9a6;
  --ink:#3a2a10;
  --muted:#8c7550;
  --accent:#f2a516;
  --accent-ink:#2e1f05;
  --heart:#e5484d;
  --star:#f2a516;
  --gridink:#3a2a10;
  --mini:#ffe08a;
  --shadow:0 10px 28px rgba(120,80,10,.16);
  --scrim:rgba(40,26,4,.5);
  --wax:#fde3a3;
  --wax-edge:#e9bd5c;
  --hive:#f5cd6e;
  --trail-dash:rgba(255,255,255,.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#17120a;
    --card:#241c10;
    --card-edge:#40321a;
    --ink:#fbefd6;
    --muted:#b9a27a;
    --accent:#ffb52e;
    --accent-ink:#241602;
    --heart:#ff6b86;
    --star:#ffb52e;
    --gridink:#0d0904;
    --mini:#5b4512;
    --shadow:0 10px 28px rgba(0,0,0,.5);
    --scrim:rgba(6,4,1,.7);
    --wax:#3a2d15;
    --wax-edge:#5c4520;
    --hive:#2b2110;
    --trail-dash:rgba(255,255,255,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17120a;--card:#241c10;--card-edge:#40321a;--ink:#fbefd6;--muted:#b9a27a;--accent:#ffb52e;--accent-ink:#241602;--heart:#ff6b86;
  --star:#ffb52e;--gridink:#0d0904;--mini:#5b4512;--shadow:0 10px 28px rgba(0,0,0,.5);--scrim:rgba(6,4,1,.7);--wax:#3a2d15;--wax-edge:#5c4520;
  --hive:#2b2110;--trail-dash:rgba(255,255,255,.6);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:default}
.title{text-align:center;line-height:1.05;min-width:0}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status row */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:34px;gap:10px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.pop{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star.off path{fill:none;stroke:var(--muted);opacity:.5}

/* control hints */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how > div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--mini);display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn[hidden]{display:none}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn .tag{font-size:12px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .art{width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%;overflow:visible}
.sheet .badge-row{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .badge-row svg{width:30px;height:30px}
.sheet .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px}
.sheet .logo svg{width:44px;height:44px}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mini);border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:74%;height:74%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;min-height:66px;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:10px}
.lv .mh svg{width:10px;height:10px}
.lv .mh .heart path,.lv .mh .star path{stroke:none}
.lv .mh .lost path,.lv .mh .off path{fill:var(--card-edge);opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.25;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  width:max-content;max-width:min(88vw,420px);text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .top{gap:6px;grid-template-columns:auto 1fr 42px}
  .top-left{gap:4px}
  .top-left .icon-btn{width:40px;height:40px;border-radius:13px}
  .top > .icon-btn{width:42px;height:42px;border-radius:14px}
  .title h1{font-size:23px}
  .foot{gap:8px}
}
@media (max-width:340px){
  .title h1{font-size:19px}
  .title p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

.pairs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-width:0;flex:1}
.pairs svg{width:21px;height:21px;transition:transform .25s,opacity .25s;opacity:.38}
.count{text-align:right;line-height:1.05}
.count .sub{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.pairs svg.on{opacity:1}
.pairs svg.pop{animation:chip .5s ease}
@keyframes chip{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-10deg)}100%{transform:none}}

.hive-wrap{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:200px}
.hive-card{background:var(--hive);border-radius:24px;padding:10px;box-shadow:0 0 0 2px var(--card-edge),var(--shadow);touch-action:none;display:grid;place-items:center;max-width:100%}
#hive{display:block;touch-action:none;overflow:visible}
.cell{fill:var(--wax);stroke:var(--wax-edge);stroke-width:.07;transition:fill .18s}
.trail{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:.46}
.trail-dash{fill:none;stroke:var(--trail-dash);stroke-width:.075;stroke-dasharray:.16 .2;stroke-linecap:round;stroke-linejoin:round}
.trail.done{stroke-width:.5}
.fl.bloom{animation:bloom .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bloom{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(18deg)}100%{transform:none}}
.fl{transform-box:fill-box;transform-origin:center}
.headring{fill:none;stroke:#fff;stroke-width:.09}
.hint-glow{animation:hintglow 1s ease-in-out 3}
@keyframes hintglow{50%{filter:brightness(1.25) drop-shadow(0 0 .3px #fff)}}
.hive-card.win .cell{animation:glow .9s ease both}
@keyframes glow{0%{filter:none}45%{filter:brightness(1.18) saturate(1.3)}100%{filter:none}}
.btn .lbl-s{display:none}
@media (max-width:370px){.btn .lbl-l{display:none}.btn .lbl-s{display:inline}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="btnLevels" aria-label="Choose level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false"><span id="musicIcon"></span></button>
      <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false"><span id="sfxIcon"></span></button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">&nbsp;</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Progress">
    <div class="pairs" id="pairs" aria-live="polite"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="hive-wrap" id="hiveWrap">
    <div class="hive-card" id="hiveCard">
      <svg id="hive" role="img" aria-label="Honeycomb board">
        <g id="cellsG"></g><g id="trailsG"></g><g id="flowersG"></g><g id="beesG"></g>
      </svg>
    </div>
  </div>

  <footer class="foot" id="foot">
    <button class="btn" id="btnRestart"><span class="ic" id="restartIcon"></span><span id="restartLabel">Restart</span></button>
    <button class="btn" id="btnUndo"><span class="ic" id="undoIcon"></span><span>Undo</span></button>
    <button class="btn" id="btnHint"><span class="ic" id="hintIcon"></span><span class="lbl-l">Hint</span><span class="lbl-s">Hint</span></button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<script>
const GAME = { id: 'bee-line', seed: 7331 };
/* =====================================================================
   Shared shell: saves, seeded randomness, icons, live-synthesised audio,
   modals, toasts and the level picker. The game code below plugs into it
   through the GAME object and a loadLevel(idx) function.
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const scrim = $('#scrim');
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* ---------- saved progress (private to this browser) ---------- */
const STORE_KEY = GAME.id + '-v1';
let save = Object.assign({ done: {}, seenHelp: false, level: 0 }, GAME.saveDefaults || {});
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
if (!save.done || typeof save.done !== 'object') save.done = {};
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- seeded randomness, so level N is the same puzzle on every device ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function seedFor(idx, salt) {
  let h = (0x9e3779b9 ^ (GAME.seed || 0)) >>> 0;
  h = Math.imul(h ^ (idx + 1), 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h ^ ((salt || 0) + 0x27d4eb2f), 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
const pickOne = (arr, rnd) => arr[Math.floor(rnd() * arr.length)];

/* ---------- icons ---------- */
const ICON = {
  tick: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.4l2.4 2.4 4.6-5"/></svg>',
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6C12 20.6 3.2 15.4 3.2 9.2C3.2 6.4 5.3 4.4 7.9 4.4C9.7 4.4 11.2 5.4 12 6.8C12.8 5.4 14.3 4.4 16.1 4.4C18.7 4.4 20.8 6.4 20.8 9.2C20.8 15.4 12 20.6 12 20.6Z"/></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.2 6-.8z"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  hint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21.2h4"/><path d="M12 2.8a6.4 6.4 0 0 0-3.9 11.5c.6.5.9 1.2.9 2V16.6h6v-.3c0-.8.3-1.5.9-2A6.4 6.4 0 0 0 12 2.8z"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  musicOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3.2L12 17.5v-11L7.2 10H4z" fill="currentColor" stroke="none"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.8a7.5 7.5 0 0 1 0 10.4"/></svg>',
  musicOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3.2L12 17.5v-11L7.2 10H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke-width="2.4"/></svg>',
  sfxOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c-.9 0-1.6.7-1.7 1.6-2.9.9-5 3.6-5 6.8v3l-1.6 2.1c-.3.4 0 1 .5 1h15.6c.5 0 .8-.6.5-1L18.7 15.6v-3c0-3.2-2.1-5.9-5-6.8-.1-.9-.8-1.6-1.7-1.6z" fill="currentColor" stroke="none"/><path d="M9.8 19.5a2.3 2.3 0 0 0 4.4 0"/></svg>',

/* ---------- honeycomb geometry (pointy-top hexes, axial q/r coordinates) ---------- */
/* directions: E, NE, NW, W, SW, SE */
const HEX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

/* 'h3' = hexagon of radius 3; 'r6x8' = 6 wide, 8 tall, odd rows shifted right */
function makeShape(spec) {
  const cells = [];
  if (spec[0] === 'h') {
    const R = +spec.slice(1);
    for (let r = -R; r <= R; r++) for (let q = -R; q <= R; q++) if (Math.abs(q + r) <= R) cells.push({ q, r });
  } else {
    const [W, H] = spec.slice(1).split('x').map(Number);
    for (let row = 0; row < H; row++) for (let col = 0; col < W; col++) cells.push({ q: col - (row - (row & 1)) / 2, r: row });
  }
  cells.sort((a, b) => a.r - b.r || a.q - b.q);
  const index = new Map();
  cells.forEach((c, i) => index.set(c.q + ',' + c.r, i));
  const dirNb = cells.map((c) => HEX_DIRS.map(([dq, dr]) => { const j = index.get((c.q + dq) + ',' + (c.r + dr)); return j === undefined ? -1 : j; }));
  const nb = dirNb.map((a) => a.filter((j) => j >= 0));

  const S3 = Math.sqrt(3);
  const pos = cells.map((c) => ({ x: S3 * (c.q + c.r / 2), y: 1.5 * c.r }));
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pos) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
  for (const p of pos) { p.x -= minX - S3 / 2; p.y -= minY - 1; }
  return { spec, n: cells.length, cells, index, dirNb, nb, pos, width: maxX - minX + S3, height: maxY - minY + 2 };
}

/* a snake through the rows: a Hamiltonian path to start shuffling from */
function snakePath(shape) {
  const rows = new Map();
  shape.cells.forEach((c, i) => { if (!rows.has(c.r)) rows.set(c.r, []); rows.get(c.r).push(i); });
  const out = [];
  [...rows.keys()].sort((a, b) => a - b).forEach((r, k) => { const row = rows.get(r); out.push(...(k % 2 ? row.slice().reverse() : row)); });
  return out;
}

/* "backbite" moves keep the path visiting every cell while mixing it up thoroughly */
function shufflePath(shape, path, steps, rnd) {
  const n = path.length, pos = new Int32Array(shape.n);

      if (i <= 1) continue;
      for (let a = 0, b = i - 1; a < b; a++, b--) { const t = path[a]; path[a] = path[b]; path[b] = t; }
      for (let a = 0; a < i; a++) pos[path[a]] = a;
    } else {
      const e = path[n - 1], nbs = shape.nb[e], v = nbs[Math.floor(rnd() * nbs.length)], i = pos[v];
      if (i >= n - 2) continue;
      for (let a = i + 1, b = n - 1; a < b; a++, b--) { const t = path[a]; path[a] = path[b]; path[b] = t; }
      for (let a = i + 1; a < n; a++) pos[path[a]] = a;
    }

}

/* ---------- flower colours (each also gets its own petal count, so pairs differ by shape too) ---------- */
const COLORS = ['#e5484d', '#3b82f6', '#16a34a', '#8b5cf6', '#f97316', '#ec4899', '#0d9488', '#1e3a8a', '#65a30d', '#a16207', '#c026d3', '#0ea5e9'];
const PETALS = [5, 6, 4, 5, 6, 4, 5, 6, 4, 5, 6, 4];
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);

}
function mix(hex, other, t) {
  const a = parseInt(hex.slice(1), 16), b = parseInt(other.slice(1), 16);
  const ch = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
  return 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')';
}
function flowerMarkup(color, petals, r) {
  let h = '';
  for (let i = 0; i < petals; i++) {
    const a = (i / petals) * Math.PI * 2 - Math.PI / 2;
    h += '<circle stroke="rgba(0,0,0,.18)" stroke-width=".03" cx="' + (Math.cos(a) * r * 0.5).toFixed(3) + '" cy="' + (Math.sin(a) * r * 0.5).toFixed(3) + '" r="' + (r * (petals === 4 ? 0.42 : 0.36)).toFixed(3) + '" fill="' + color + '"/>';
  }
  return h + '<circle fill="#ffe27a" stroke="#b8860b" stroke-width=".045" r="' + (r * 0.3).toFixed(3) + '"/>';
}
function chipSVG(k) {
  return '<svg viewBox="-1 -1 2 2" aria-hidden="true">' + flowerMarkup(COLORS[k % COLORS.length], PETALS[k % PETALS.length], 0.95) + '</svg>';
}

/* ---------- levels: a verified bank first, then fresh puzzles built on your device ---------- */
const levelCache = {};
function decodeBank(L) {
  const shape = makeShape(L.s);
  const paths = L.p.split(' ').map((tok) => {
    const [a, d] = tok.split(':'); const p = [parseInt(a, 36)];
    for (const ch of d) p.push(shape.dirNb[p[p.length - 1]][+ch]);
    return p;
  });
  return { shape, sol: paths };
}
function genLevel(idx) {
  const rnd = mulberry32(seedFor(idx, 11));
  const options = [['h4', 8, 9], ['r7x9', 8, 9], ['r8x9', 9, 10], ['r8x10', 9, 11], ['h5', 10, 11]];
  const [spec, kmin, kmax] = options[Math.floor(rnd() * options.length)];
  const shape = makeShape(spec);
  for (let attempt = 0; attempt < 600; attempt++) {
    const k = kmin + Math.floor(rnd() * (kmax - kmin + 1));
    const paths = growPaths(shape, rnd, 3, Math.max(4, Math.round(shape.n / k * 1.7)));
    if (!paths || paths.length < k - 1 || paths.length > k + 1) continue;
    if (paths.some((p) => shape.nb[p[0]].includes(p[p.length - 1]))) continue;
    if (countSolutions(shape, paths.map((p) => [p[0], p[p.length - 1]]), 2, 200000) !== 1) continue;
    return { shape, sol: paths };
  }
  return decodeBank(BANK[100 + (idx % (BANK.length - 100))]);
}
function getLevel(idx) {
  if (!levelCache[idx]) {
    const L = idx < BANK.length ? decodeBank(BANK[idx]) : genLevel(idx);
    L.pairs = L.sol.map((p) => [p[0], p[p.length - 1]]);
    levelCache[idx] = L;
  }
  return levelCache[idx];
}
function pairCount(idx) {
  if (idx < BANK.length) return BANK[idx].p.split(' ').length;
  return getLevel(idx).pairs.length;
}

GAME.total = Infinity;
GAME.levelLabel = (i) => i < BANK.length ? pairCount(i) + ' pairs' : 'fresh';
GAME.levelBadge = (stars) => starsHTML(stars);

/* ---------- state ---------- */
let G = null;
let stroke = null;
let winTimer = 0, saveTimer = 0, lastTick = 0;
const svg = $('#hive'), cellsG = $('#cellsG'), trailsG = $('#trailsG'), flowersG = $('#flowersG'), beesG = $('#beesG');

function loadLevel(idx) {
  idx = Math.max(0, idx | 0);
  startLevel(idx, getLevel(idx));
  setTimeout(() => getLevel(idx + 1), 500);
}

function startLevel(idx, L) {
  clearTimeout(winTimer);
  if (disarmRestart) disarmRestart();
  $('#restartIcon').innerHTML = ICON.restart;
  const K = L.pairs.length;
  const endOf = new Int16Array(L.shape.n).fill(-1);
  L.pairs.forEach(([a, b], k) => { endOf[a] = k; endOf[b] = k; });
  G = { idx, L, shape: L.shape, K, endOf, paths: L.pairs.map(([a]) => [a]), owner: null,
        moves: 0, hints: 0, lastPair: -1, won: false, undo: [], connected: new Uint8Array(K) };
  if (save.cur && save.cur.i === idx && Array.isArray(save.cur.p) && save.cur.p.length === K) {
    const ok = save.cur.p.every((p, k) => Array.isArray(p) && p.length && (p[0] === L.pairs[k][0] || p[0] === L.pairs[k][1]));
    if (ok) { G.paths = save.cur.p.map((p) => p.slice()); G.moves = save.cur.m | 0; G.hints = save.cur.h | 0; }
  }
  save.level = idx; persist();
  $('#lvTitle').textContent = 'Level ' + (idx + 1);
  $('#lvSub').textContent = K + ' flower pairs';
  buildBoard();
  recompute();
  for (let k = 0; k < K; k++) G.connected[k] = isComplete(k) ? 1 : 0;
  render();
  closeModal();
}

/* ---------- drawing the honeycomb ---------- */
let VB = { w: 1, h: 1 };
function hexPoints(x, y, s) {
  let pts = '';
  for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); pts += (x + s * Math.cos(a)).toFixed(3) + ',' + (y + s * Math.sin(a)).toFixed(3) + ' '; }
  return pts.trim();
}
function buildBoard() {
  const sh = G.shape;
  VB = { w: sh.width, h: sh.height };
  svg.setAttribute('viewBox', '0 0 ' + sh.width.toFixed(3) + ' ' + sh.height.toFixed(3));
  cellsG.innerHTML = ''; trailsG.innerHTML = ''; flowersG.innerHTML = ''; beesG.innerHTML = '';
  G.cellEls = sh.pos.map((p) => el('polygon', { class: 'cell', points: hexPoints(p.x, p.y, 0.97) }, cellsG));
  G.trailEls = []; G.dashEls = [];
  for (let k = 0; k < G.K; k++) {
    G.trailEls.push(el('path', { class: 'trail', stroke: COLORS[k % COLORS.length] }, trailsG));
    G.dashEls.push(el('path', { class: 'trail-dash' }, trailsG));
  }
  G.headEl = el('circle', { class: 'headring', r: 0.42 }, trailsG);
  G.headEl.style.opacity = 0;
  G.flowerEls = [];
  G.L.pairs.forEach(([a, b], k) => {
    for (const c of [a, b]) {
      const g = el('g', { class: 'flower', transform: 'translate(' + sh.pos[c].x.toFixed(3) + ' ' + sh.pos[c].y.toFixed(3) + ')' }, flowersG);
      g.innerHTML = '<g class="fl">' + flowerMarkup(COLORS[k % COLORS.length], PETALS[k % PETALS.length], 0.7) + '</g>';
      G.flowerEls.push({ k, c, g: g.firstChild });

function layout() {

  const wrap = $('#hiveWrap');
  const availW = Math.min(wrap.clientWidth, 452) - 20;
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const availH = Math.max(220, window.innerHeight - top - $('#foot').offsetHeight - 52);
  const scale = Math.min(availW / VB.w, availH / VB.h);
  svg.style.width = (VB.w * scale).toFixed(1) + 'px';
  svg.style.height = (VB.h * scale).toFixed(1) + 'px';
}
window.addEventListener('resize', layout);

/* ---------- path bookkeeping ---------- */
function recompute() {
  const owner = new Int16Array(G.shape.n).fill(-1);
  G.L.pairs.forEach(([a, b], k) => { owner[a] = k; owner[b] = k; });
  G.paths.forEach((p, k) => { for (const c of p) owner[c] = k; });
  G.owner = owner;
}
function isComplete(k) {
  const p = G.paths[k], [a, b] = G.L.pairs[k];
  return p.length > 1 && ((p[0] === a && p[p.length - 1] === b) || (p[0] === b && p[p.length - 1] === a));
}
function filledCount() { let n = 0; for (let i = 0; i < G.shape.n; i++) if (G.owner[i] >= 0) n++; return n; }

const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function render() {
  const sh = G.shape;
  const base = darkMQ && darkMQ.matches ? '#1b140a' : '#fff7e0';
  const onTrail = new Int16Array(sh.n).fill(-1);
  G.paths.forEach((p, k) => { if (p.length > 1) for (const c of p) onTrail[c] = k; });
  for (let i = 0; i < sh.n; i++) {
    const k = onTrail[i];
    G.cellEls[i].style.fill = k >= 0 ? mix(COLORS[k % COLORS.length], base, 0.62) : '';
  }
  for (let k = 0; k < G.K; k++) {
    const p = G.paths[k];
    const d = p.length > 1 ? 'M' + p.map((c) => sh.pos[c].x.toFixed(3) + ' ' + sh.pos[c].y.toFixed(3)).join('L') : '';
    G.trailEls[k].setAttribute('d', d);
    G.dashEls[k].setAttribute('d', d);
    G.trailEls[k].classList.toggle('done', isComplete(k));
  }
  if (stroke && G.paths[stroke.k].length) {
    const h = G.paths[stroke.k][G.paths[stroke.k].length - 1];
    G.headEl.setAttribute('cx', sh.pos[h].x); G.headEl.setAttribute('cy', sh.pos[h].y);
    G.headEl.style.opacity = isComplete(stroke.k) ? 0 : 0.9;
  } else G.headEl.style.opacity = 0;
  const chips = $('#pairs').children;
  for (let k = 0; k < G.K; k++) chips[k].classList.toggle('on', isComplete(k));
  const pct = Math.round(filledCount() / sh.n * 100);
  $('#count').innerHTML = '<small>Moves</small>' + G.moves + '<span class="sub">' + pct + '% of the comb</span>';
}

/* ---------- input: drag from a flower (or the end of a trail) to fly a bee ---------- */
function svgPoint(e) {
  const r = svg.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VB.w, y: (e.clientY - r.top) / r.height * VB.h };
}
function nearestCell(pt, maxD) {
  let best = -1, bd = maxD * maxD;
  const pos = G.shape.pos;
  for (let i = 0; i < pos.length; i++) { const dx = pos[i].x - pt.x, dy = pos[i].y - pt.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  return best;
}
function snapshot() { return G.paths.map((p) => p.slice()); }

svg.addEventListener('pointerdown', (e) => {
  if (!G || G.won || stroke) return;
  const c = nearestCell(svgPoint(e), 0.95);
  if (c < 0) return;
  let k = -1;
  if (G.endOf[c] >= 0) { k = G.endOf[c]; }
  else if (G.owner[c] >= 0) { k = G.owner[c]; }
  if (k < 0) return;
  e.preventDefault();
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  const before = snapshot();
  if (G.endOf[c] >= 0) G.paths[k] = [c];
  else G.paths[k] = G.paths[k].slice(0, G.paths[k].indexOf(c) + 1);
  stroke = { id: e.pointerId, k, before, base: snapshot(), was: isComplete(k) };
  /* "base" keeps other trails as they were, so a trail you cut grows back if you retreat */
  stroke.base[k] = G.paths[k].slice();
  recompute(); render();
  sfx('tick', 0);
});

function stepTo(c) {
  const k = stroke.k, p = G.paths[k], head = p[p.length - 1];
  if (c === head) return true;
  if (!G.shape.nb[head].includes(c)) return false;
  const at = p.indexOf(c);
  if (at >= 0) { G.paths[k] = p.slice(0, at + 1); restoreOthers(); return true; }
  if (isComplete(k)) return false;
  if (G.endOf[c] >= 0 && G.endOf[c] !== k) { if (!stroke.bonked) { sfx('bonk'); stroke.bonked = true; } return false; }
  if (G.endOf[c] === k && c === p[0]) return false;
  p.push(c);
  stroke.bonked = false;
  restoreOthers();
  const now = performance.now();
  if (now - lastTick > 40) { sfx('tick', p.length); lastTick = now; }
  if (isComplete(k)) onConnect(k);
  return true;
}
function restoreOthers() {
  const mine = new Set(G.paths[stroke.k]);
  let cut = false;
  for (let j = 0; j < G.K; j++) {
    if (j === stroke.k) continue;
    const base = stroke.base[j];
    let n = base.length;
    for (let x = 1; x < base.length; x++) if (mine.has(base[x])) { n = x; break; }
    if (n !== G.paths[j].length) cut = cut || n < G.paths[j].length;
    G.paths[j] = base.slice(0, n);
  }
  if (cut) sfx('snip');
}
svg.addEventListener('pointermove', (e) => {
  if (!stroke || e.pointerId !== stroke.id) return;
  const pt = svgPoint(e);
  const k = stroke.k, sh = G.shape;
  const head = G.paths[k][G.paths[k].length - 1];
  const target = nearestCell(pt, 1.05);
  if (target < 0 || target === head) return;
  /* walk from the head towards the finger so fast swipes don't skip cells */
  const hx = sh.pos[head].x, hy = sh.pos[head].y;
  const dist = Math.hypot(pt.x - hx, pt.y - hy), steps = Math.max(1, Math.ceil(dist / 0.3));
  let changed = false;
  for (let s = 1; s <= steps; s++) {
    const c = nearestCell({ x: hx + (pt.x - hx) * s / steps, y: hy + (pt.y - hy) * s / steps }, 1.05);
    const cur = G.paths[k][G.paths[k].length - 1];
    if (c < 0 || c === cur) continue;
    if (!stepTo(c)) break;
    changed = true;
  }
  if (changed) { recompute(); render(); }
});
function endStroke(e) {
  if (!stroke || (e && e.pointerId !== stroke.id)) return;
  const k = stroke.k;
  const changed = JSON.stringify(stroke.before) !== JSON.stringify(G.paths);
  if (changed) {
    G.undo.push(stroke.before);
    if (G.undo.length > 60) G.undo.shift();
    if (k !== G.lastPair) { G.moves++; G.lastPair = k; }
  }
  stroke = null;
  for (let j = 0; j < G.K; j++) G.connected[j] = isComplete(j) ? 1 : 0;
  render();
  queueSave();
  checkWin(changed);
}
svg.addEventListener('pointerup', endStroke);
svg.addEventListener('pointercancel', endStroke);

function onConnect(k) {
  sfx('connect', k);
  haptic(15);
  for (const f of G.flowerEls) if (f.k === k) { f.g.classList.remove('bloom'); requestAnimationFrame(() => f.g.classList.add('bloom')); }
  const chip = $('#pairs').children[k];
  chip.classList.remove('pop'); void chip.offsetWidth; chip.classList.add('pop');
  flyBee(G.paths[k].slice(), 0);
}

/* a little bee buzzes along a finished trail */
function flyBee(path, delay) {
  if (path.length < 2) return;
  const g = el('g', { class: 'bee', opacity: 0 }, beesG);
  g.innerHTML = BEE;
  const pos = G.shape.pos, dur = Math.min(1400, 160 + path.length * 90);
  let t0 = 0;
  const frame = (t) => {
    if (!t0) t0 = t + delay;
    const u = Math.max(0, Math.min(1, (t - t0) / dur));
    const f = u * (path.length - 1), i = Math.min(path.length - 2, Math.floor(f)), w = f - i;
    const a = pos[path[i]], b = pos[path[i + 1]];
    const x = a.x + (b.x - a.x) * w, y = a.y + (b.y - a.y) * w + Math.sin(t / 70) * 0.05;
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    const flip = Math.abs(ang) > 90;
    g.setAttribute('transform', 'translate(' + x.toFixed(3) + ' ' + y.toFixed(3) + ') rotate(' + (flip ? ang + 180 : ang).toFixed(1) + ') scale(' + (flip ? -1.25 : 1.25) + ' 1.25)');
    g.setAttribute('opacity', u <= 0 ? 0 : u > 0.92 ? ((1 - u) / 0.08).toFixed(2) : 1);
    if (u < 1 && g.isConnected) requestAnimationFrame(frame); else g.remove();
  };
  requestAnimationFrame(frame);
}

function checkWin(fromMove) {
  if (G.won) return;
  let all = true;
  for (let k = 0; k < G.K; k++) if (!isComplete(k)) { all = false; break; }
  if (!all) return;
  if (filledCount() < G.shape.n) {
    if (fromMove) toast('Every pair is linked — now stretch the trails so they cover every cell.', 2800);
    return;
  }
  win();
}

/* ---------- hint: lay down the true trail for one pair ---------- */
function hint() {
  if (!G || G.won) return;
  const sol = G.L.sol;
  let pick = -1;
  for (let k = 0; k < G.K; k++) {
    const mine = G.paths[k], s = sol[k];
    const same = isComplete(k) && mine.length === s.length && (mine.every((c, i) => c === s[i]) || mine.every((c, i) => c === s[s.length - 1 - i]));
    if (!same) { pick = k; break; }
  }
  if (pick < 0) { toast('These trails are all spot on — fill in the rest!'); return; }
  G.undo.push(snapshot());
  const s = sol[pick].slice();
  G.paths[pick] = s;
  const mine = new Set(s);
  for (let j = 0; j < G.K; j++) {
    if (j === pick) continue;
    const p = G.paths[j];
    let n = p.length;
    for (let x = 0; x < p.length; x++) if (mine.has(p[x])) { n = x; break; }
    G.paths[j] = n === 0 ? [G.L.pairs[j][0]] : p.slice(0, n);
  }
  G.hints++; G.lastPair = -1;
  recompute(); render();
  G.trailEls[pick].classList.add('hint-glow');
  setTimeout(() => G && G.trailEls[pick] && G.trailEls[pick].classList.remove('hint-glow'), 3200);
  onConnect(pick);
  queueSave();
  checkWin(true);
}
$('#btnHint').addEventListener('click', hint);

$('#btnUndo').addEventListener('click', () => {
  if (!G || G.won || !G.undo.length) return;
  G.paths = G.undo.pop();
  G.lastPair = -1;
  recompute(); render(); queueSave();
  sfx('tick', 0);
});

function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!G || G.won) { if (save.cur) { delete save.cur; persist(); } return; }
    save.cur = { i: G.idx, p: G.paths, m: G.moves, h: G.hints };
    persist();
  }, 300);
}

/* ---------- winning ---------- */
function starsFor() {
  let s = G.moves <= G.K ? 3 : G.moves <= G.K + 3 ? 2 : 1;
  if (G.hints >= 2) s = Math.min(s, 1); else if (G.hints === 1) s = Math.min(s, 2);
  return s;
}
const WIN_TITLES = ['Bee-autiful!', 'Buzzing!', 'Sweet as honey!', 'Bee-rilliant!', 'Hive five!'];
function win() {
  G.won = true;
  const stars = starsFor();
  save.done[G.idx] = Math.max(save.done[G.idx] || 0, stars);
  delete save.cur;
  persist();
  $('#restartLabel').textContent = 'Next';
  $('#restartIcon').innerHTML = ICON.chevR;
  $('#hiveCard').classList.add('win');
  G.cellEls.forEach((c, i) => { c.style.animationDelay = (G.shape.pos[i].x * 30 + G.shape.pos[i].y * 20) + 'ms'; });
  for (let k = 0; k < G.K; k++) flyBee(G.paths[k].slice(), k * 90);
  sfx('win');
  winTimer = setTimeout(() => showWin(stars), 1500);
}
function showWin(stars) {
  const perfect = G.moves <= G.K && !G.hints;
  openModal(
    '<div class="art"><svg viewBox="-1.2 -1.2 2.4 2.4">' + flowerMarkup(COLORS[G.idx % COLORS.length], PETALS[G.idx % PETALS.length], 1) + '<g transform="translate(.62 -.62) scale(1.5)">' + BEE + '</g></svg></div>' +
    '<h2>' + WIN_TITLES[G.idx % WIN_TITLES.length] + '</h2>' +
    '<p>' + (perfect ? 'A perfect hive: every pair in one flight.' : 'The whole comb is pollinated in ' + G.moves + ' move' + (G.moves === 1 ? '' : 's') + '.') + '</p>' +
    '<div class="badge-row">' + starsHTML(stars) + '</div>' +
    (stars < 3 && !G.hints ? '<p style="font-size:15px;margin-top:-6px">Link each pair in a single move for three stars.</p>' : '') +
    '<div class="stack">' +
    '<button class="btn primary" data-act="next">Next level</button>' +
    '<button class="btn" data-act="levels">Choose level</button>' +
    '<button class="btn" data-act="retry">Play again</button>' +
    '</div>'
  );
}

GAME.showHelp = () => {
  const demo = '<svg viewBox="-1.1 -1.1 2.2 2.2">' + flowerMarkup(COLORS[0], 5, 1) + '</svg>';
  openModal(
    '<div class="logo"><svg viewBox="-1 -1 2 2">' + BEE.replace(/<ellipse cx="0"/, '<ellipse cx="0"') + '</svg><h2>Bee Line</h2></div>' +
    '<p>Guide a bee between each pair of matching flowers.</p>' +
    '<ul class="rules">' +
    '<li><span class="mini">' + demo + '</span><span>Drag from a flower to draw a trail to its twin.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24"><path d="M3 12h18M12 3v18" stroke="#e5484d" stroke-width="3.2" stroke-linecap="round"/><path d="M12 3v18" stroke="#3b82f6" stroke-width="3.2" stroke-linecap="round"/></svg></span><span>Trails can\'t cross. Drawing over a trail cuts it.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.8l7.9 4.6v9.2L12 21.2l-7.9-4.6V7.4z" fill="#f2a516" stroke="#3a2a10"/></svg></span><span>Cover every cell of the comb to finish.</span></li>' +
    '<li><span class="mini"><span class="star">' + ICON.star + '</span></span><span>Link each pair in one move for a perfect three stars.</span></li>' +
    '</ul>' +
    '<p style="font-size:15px;margin-top:-4px">Tap a flower to clear its trail. Undo and Hint are in the bottom bar.</p>' +
    '<div class="stack"><button class="btn primary" data-act="close">Let\'s buzz</button></div>'
  );
};

/* ---------- music: a bouncy marimba tune over a soft hive hum ---------- */
GAME.music = {
  tempo: 116,
  tracks: [
    { inst: INST.marimba, vol: 0.15, seq: track('G5:.5 B5:.5 D6:.5 B5:.5 G5 A5 B5:.5 A5:.5 G5:.5 E5:.5 D5:2 E5:.5 G5:.5 C6:.5 B5:.5 A5 G5 F#5:.5 G5:.5 A5:.5 B5:.5 A5:2 ' +
      'G5:.5 B5:.5 D6:.5 E6:.5 D6 B5 C6:.5 B5:.5 A5:.5 G5:.5 E5:2 C5:.5 E5:.5 A5:.5 G5:.5 F#5 A5 G5:1.5 D5:.5 G5 -') },
    { inst: INST.wbass, vol: 0.13, seq: track('G2 D3 G2 D3 E2 B2 E2 B2 C3 G3 C3 G3 D3 A3 D3 A3 G2 D3 G2 D3 C3 G3 C3 G3 A2 E3 D3 A3 G2 D3 G2 -') },
    { inst: INST.shaker, perc: true, vol: 0.02, seq: track(Array(32).fill('-:.5 x:.5').join(' ')) }
  ],
  ambient() {
    /* a hum like a distant hive: two detuned saws through a low filter, slowly swelling */
    const o1 = actx.createOscillator(), o2 = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    const lfo = actx.createOscillator(), lg = actx.createGain();
    o1.type = o2.type = 'sawtooth'; o1.frequency.value = 196; o2.frequency.value = 197.8;
    f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 4;
    g.gain.value = 0.012; lfo.frequency.value = 0.11; lg.gain.value = 0.009;
    lfo.connect(lg); lg.connect(g.gain);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(musicBus);
    o1.start(); o2.start(); lfo.start();
    return () => { try { o1.stop(); o2.stop(); lfo.stop(); } catch (e) {} };
  }
};
GAME.sfx = {
  tick(t, n) { tone(t, 600 + Math.min(n || 0, 24) * 22, { type: 'sine', a: 0.002, dur: 0.035, vol: 0.035 }); },
  connect(t, k) {
    const f = noteFreq('C5') * Math.pow(2, [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26][(k || 0) % 12] / 12);
    tone(t, f, { type: 'sine', a: 0.004, dur: 0.4, vol: 0.13 });
    tone(t + 0.08, f * 1.5, { type: 'sine', a: 0.004, dur: 0.4, vol: 0.09 });
    tone(t, 220, { type: 'sawtooth', to: 330, a: 0.02, dur: 0.25, vol: 0.025, lp: 900, vib: 0.03, vibRate: 30 });
  },
  snip(t) { noise(t, { f: 3200, q: 2.5, dur: 0.05, vol: 0.06 }); },
  bonk: SFX.bonk,
  win(t) {
    SFX.win(t);
    tone(t + 0.4, 200, { type: 'sawtooth', to: 420, a: 0.05, dur: 0.6, vol: 0.03, lp: 1200, vib: 0.04, vibRate: 28 });
  }
};

/* ---------- boot ---------- */
$('#undoIcon').innerHTML = ICON.undo;
$('#hintIcon').innerHTML = ICON.hint;
$('#restartIcon').innerHTML = ICON.restart;
const disarmRestart = armConfirm($('#btnRestart'), $('#restartLabel'), 'Restart',
  () => G && !G.won && G.paths.some((p) => p.length > 1),
  () => {
    if (G.won) { loadLevel(G.idx + 1); return; }
    delete save.cur; persist();
    startLevel(G.idx, G.L);
  });
shellBoot();
loadLevel(save.level || 0);
if (!save.seenHelp) { GAME.showHelp(); save.seenHelp = true; persist(); }
</script>
</body>
