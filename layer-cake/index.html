<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Layer Cake</title>
<meta name="description" content="Sort the mixed-up sponge layers so every stand holds a cake of one flavour.">
<meta name="theme-color" content="#fdeef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Layer Cake">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdeef0;
  --card:#fffafa;
  --card-edge:#f2d3d9;
  --ink:#3d2330;
  --muted:#8e6878;
  --accent:#e2557e;
  --accent-ink:#ffffff;
  --heart:#e5484d;
  --star:#f2b233;
  --gridink:#3d2330;
  --mini:#ffd5e1;
  --shadow:0 10px 28px rgba(120,40,70,.14);
  --scrim:rgba(40,12,24,.5);
  --counter:#f7dfe3;
  --counter-edge:#ecc4cc;
  --plate:#ffffff;
  --plate-edge:#d9c4cb;
  --cream:#fff8ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1b1216;
    --card:#271a20;
    --card-edge:#452e38;
    --ink:#fbeaf0;
    --muted:#c0a0ad;
    --accent:#ff7aa0;
    --accent-ink:#2a0c17;
    --heart:#ff6b86;
    --star:#f6c35b;
    --gridink:#0c0709;
    --mini:#5a2a3c;
    --shadow:0 10px 28px rgba(0,0,0,.5);
    --scrim:rgba(8,3,5,.72);
    --counter:#2c1d24;
    --counter-edge:#4a3240;
    --plate:#e9e1e4;
    --plate-edge:#9a8890;
    --cream:#fff3e3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1b1216;--card:#271a20;--card-edge:#452e38;--ink:#fbeaf0;--muted:#c0a0ad;--accent:#ff7aa0;--accent-ink:#2a0c17;--heart:#ff6b86;--star:#f6c35b;
  --gridink:#0c0709;--mini:#5a2a3c;--shadow:0 10px 28px rgba(0,0,0,.5);--scrim:rgba(8,3,5,.72);--counter:#2c1d24;--counter-edge:#4a3240;
  --plate:#e9e1e4;--plate-edge:#9a8890;--cream:#fff3e3;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:default}
.title{text-align:center;line-height:1.05;min-width:0}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status row */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:34px;gap:10px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.pop{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star.off path{fill:none;stroke:var(--muted);opacity:.5}

/* control hints */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how > div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--mini);display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn[hidden]{display:none}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn .tag{font-size:12px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .art{width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%;overflow:visible}
.sheet .badge-row{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .badge-row svg{width:30px;height:30px}
.sheet .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px}
.sheet .logo svg{width:44px;height:44px}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mini);border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:74%;height:74%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;min-height:66px;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:10px}
.lv .mh svg{width:10px;height:10px}
.lv .mh .heart path,.lv .mh .star path{stroke:none}
.lv .mh .lost path,.lv .mh .off path{fill:var(--card-edge);opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.25;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  width:max-content;max-width:min(88vw,420px);text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .top{gap:6px;grid-template-columns:auto 1fr 42px}
  .top-left{gap:4px}
  .top-left .icon-btn{width:40px;height:40px;border-radius:13px}
  .top > .icon-btn{width:42px;height:42px;border-radius:14px}
  .title h1{font-size:23px}
  .foot{gap:8px}
}
@media (max-width:340px){
  .title h1{font-size:19px}
  .title p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

.status .stars-now{display:flex;gap:4px}
.status .stars-now svg{width:28px;height:28px}
.count{text-align:right;line-height:1.05}
.count .sub{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}

.counter-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.counter{
  position:relative;width:100%;border-radius:24px;background:var(--counter);
  box-shadow:0 0 0 2px var(--counter-edge),var(--shadow);touch-action:manipulation;
}
.stand{position:absolute;border-radius:14px;cursor:pointer}
.stand .plate{
  position:absolute;left:-8%;right:-8%;bottom:0;height:var(--plateH);border-radius:50%/60%;
  background:linear-gradient(var(--plate),var(--plate) 55%,var(--plate-edge));box-shadow:0 3px 6px rgba(80,30,50,.22);
}
.stand .foot{position:absolute;left:30%;right:30%;bottom:calc(var(--plateH) * -.9);height:calc(var(--plateH) * 1.1);border-radius:0 0 40% 40%;background:linear-gradient(90deg,var(--plate-edge),var(--plate) 45%,var(--plate-edge))}
.stand .slot{position:absolute;left:0;right:0;bottom:var(--plateH);top:0;border-radius:12px;transition:background .2s}
.stand.sel .slot{background:rgba(255,255,255,.35)}
.stand.done{cursor:default}
.stand.nope{animation:nope .35s ease}
@keyframes nope{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.stand.hint .slot{box-shadow:0 0 0 3px var(--accent);animation:hintp 1s ease-in-out 3}
@keyframes hintp{50%{box-shadow:0 0 0 5px var(--accent),0 0 16px var(--accent)}}

.layer{
  position:absolute;border-radius:calc(var(--lh) * .32);pointer-events:none;
  transition:left .28s cubic-bezier(.3,.9,.4,1),top .28s cubic-bezier(.3,.9,.4,1);
  box-shadow:inset 0 calc(var(--lh) * -.16) 0 rgba(0,0,0,.12),inset 0 calc(var(--lh) * .1) 0 rgba(255,255,255,.28);
  background-color:var(--fc);
}
.layer::after{content:"";position:absolute;left:4%;right:4%;top:-3px;height:5px;border-radius:5px;background:var(--cream);opacity:.95}
.layer.f0{--fc:#f78fb3;background-image:radial-gradient(circle,#ffe58a 0 1.4px,transparent 2px);background-size:11px 9px}
.layer.f1{--fc:#7b4a2e;background-image:radial-gradient(circle,#3b2012 0 2px,transparent 2.5px);background-size:13px 11px}
.layer.f2{--fc:#f3dfae;background-image:radial-gradient(circle,#6b4a2a 0 .9px,transparent 1.3px);background-size:9px 8px}
.layer.f3{--fc:#86c463;background-image:linear-gradient(90deg,rgba(255,255,255,.25) 0 2px,transparent 2px);background-size:12px 100%}
.layer.f4{--fc:#6c6fd1;background-image:radial-gradient(circle,#383aa0 0 2.4px,transparent 3px);background-size:14px 12px}
.layer.f5{--fc:#f6d04d;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 2px,transparent 2px 9px)}
.layer.f6{--fc:#f3913f;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1.4px,transparent 2px);background-size:10px 9px}
.layer.f7{--fc:#69d0b9;background-image:radial-gradient(circle,#2b2b2b 0 1.8px,transparent 2.3px);background-size:12px 10px}
.layer.f8{--fc:#c43546;background-image:radial-gradient(circle,#fff3e3 0 1.6px,transparent 2.1px);background-size:15px 11px}
.layer.f9{--fc:#69b9f0;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 3px,transparent 3px 10px)}
.layer.f10{--fc:#c98a3d;background-image:repeating-linear-gradient(0deg,rgba(255,240,200,.45) 0 2px,transparent 2px 7px)}
.layer.f11{--fc:#b48bd8;background-image:radial-gradient(circle,#7a4fb0 0 1.5px,transparent 2px);background-size:9px 12px}
.layer.mystery{--fc:#d8c3b5;background-image:none}
.layer.mystery::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:calc(var(--lh) * .62);color:rgba(80,50,40,.55)}
.layer.reveal{animation:reveal .4s ease}
@keyframes reveal{0%{filter:brightness(1.6)}100%{filter:none}}

.topper{position:absolute;pointer-events:none;transform-origin:50% 100%;animation:topper .5s cubic-bezier(.2,1.6,.4,1) both}
.topper svg{width:100%;height:100%;overflow:visible}
@keyframes topper{from{transform:scale(0) translateY(10px)}to{transform:none}}
.sprinkle{position:absolute;width:6px;height:12px;border-radius:3px;pointer-events:none;animation:fall 1.5s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(var(--fy)) rotate(var(--fr));opacity:0}}
.btn .tag{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="btnLevels" aria-label="Choose level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false"><span id="musicIcon"></span></button>
      <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false"><span id="sfxIcon"></span></button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">&nbsp;</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Rating and moves">
    <div class="stars-now" id="starsNow" aria-live="polite"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="counter-wrap" id="counterWrap">
    <div class="counter" id="counter" role="application" aria-label="Cake stands. Tap a stand to pick up its top layers, then tap another stand to place them."></div>
  </div>

  <footer class="foot" id="foot">
    <button class="btn" id="btnRestart"><span id="restartIcon"></span><span id="restartLabel">Restart</span></button>
    <button class="btn" id="btnUndo"><span id="undoIcon"></span><span>Undo</span></button>
    <button class="btn" id="btnExtra" aria-label="Add a spare stand (once per level)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 18h16M7 18v-3h10v3M12 4v7M8.5 7.5h7"/></svg><span>Stand</span></button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<script>
const GAME = { id: 'layer-cake', seed: 909 };
/* =====================================================================
   Shared shell: saves, seeded randomness, icons, live-synthesised audio,
   modals, toasts and the level picker. The game code below plugs into it
   through the GAME object and a loadLevel(idx) function.
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const scrim = $('#scrim');
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* ---------- saved progress (private to this browser) ---------- */
const STORE_KEY = GAME.id + '-v1';
let save = Object.assign({ done: {}, seenHelp: false, level: 0 }, GAME.saveDefaults || {});
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
if (!save.done || typeof save.done !== 'object') save.done = {};
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- seeded randomness, so level N is the same puzzle on every device ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function seedFor(idx, salt) {
  let h = (0x9e3779b9 ^ (GAME.seed || 0)) >>> 0;
  h = Math.imul(h ^ (idx + 1), 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h ^ ((salt || 0) + 0x27d4eb2f), 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
const pickOne = (arr, rnd) => arr[Math.floor(rnd() * arr.length)];

/* ---------- icons ---------- */
const ICON = {
  tick: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.4l2.4 2.4 4.6-5"/></svg>',
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6C12 20.6 3.2 15.4 3.2 9.2C3.2 6.4 5.3 4.4 7.9 4.4C9.7 4.4 11.2 5.4 12 6.8C12.8 5.4 14.3 4.4 16.1 4.4C18.7 4.4 20.8 6.4 20.8 9.2C20.8 15.4 12 20.6 12 20.6Z"/></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.2 6-.8z"/></svg>',

/* ---------- Layer Cake rules: stands hold up to CAP layers; move the top run onto a matching top or an empty stand ---------- */
const CAP = 4;

function topRun(s) {
  if (!s.length) return 0;

  return n;
}

  if (b.length && b[b.length - 1] !== a[a.length - 1]) return false;
  return true;
}

function moveCount(st, i, j) { return Math.min(topRun(st[i]), CAP - st[j].length); }

  const n = moveCount(st, i, j);
  for (let k = 0; k < n; k++) st[j].push(st[i].pop());

}

function solveCake(stands, budget) {

    return true;

    if (allSorted(st)) return true;
    const k = key();
    if (seen.has(k)) return false;

    if (++nodes > budget) throw 0;
    const moves = [];
    for (let i = 0; i < st.length; i++) for (let j = 0; j < st.length; j++) {
      if (!canMove(st, i, j) || !useful(i, j)) continue;
      /* finishing a cake or stacking onto a matching top first, empty stands last */
      const n = moveCount(st, i, j);
      const score = (st[j].length + n === CAP && (!st[j].length || st[j][0] === st[i][st[i].length - 1]) ? 0 : 1) + (st[j].length ? 0 : 2) + (n < topRun(st[i]) ? 1 : 0);
      moves.push([score, i, j]);
    }
    moves.sort((a, b) => a[0] - b[0]);
    for (const [, i, j] of moves) {
      const n = applyMove(st, i, j);
      path.push([i, j]);
      if (dfs()) return true;
      path.pop();
      for (let x = 0; x < n; x++) st[i].push(st[j].pop());
    }
    return false;
  }
  try { return dfs() ? path.slice() : null; } catch (e) { return null; }
}

/* deal a level: n flavours, `empty` spare stands; never starts with a finished cake */
function dealCake(n, empty, rnd) {
  for (let tries = 0; tries < 200; tries++) {
    const pool = [];
    for (let f = 0; f < n; f++) for (let k = 0; k < CAP; k++) pool.push(f);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    const st = [];
    for (let s = 0; s < n; s++) st.push(pool.slice(s * CAP, s * CAP + CAP));
    for (let e = 0; e < empty; e++) st.push([]);
    if (st.some((s) => s.length === CAP && topRun(s) >= 3)) continue;
    let pairs = 0;
    for (const s of st) for (let k = 1; k < s.length; k++) if (s[k] === s[k - 1]) pairs++;
    if (pairs > Math.ceil(n * 0.6)) continue;
    const sol = solveCake(st, 60000);
    if (sol) return { stands: st, sol };
  }
  return null;
}

/* ---------- levels: more flavours as you go; some "mystery" bakes hide the lower layers ---------- */
function plan(idx) {
  const steps = [[1, 2, 1], [2, 3, 2], [5, 4, 2], [10, 5, 2], [20, 6, 2], [35, 7, 2], [55, 8, 2], [80, 9, 2], [110, 10, 2], [150, 11, 2]];

function getLevel(idx) {

  let d = null;
  for (let salt = 0; !d && salt < 20; salt++) d = dealCake(P.n, P.e, salt ? mulberry32(seedFor(idx, 50 + salt)) : rnd);
  const L = { n: P.n, mystery: P.mystery, stands: d.stands, par: d.sol.length };
  /* flavour colours vary from level to level */
  const order = shuffleArr([...Array(12).keys()], mulberry32(seedFor(idx, 2)));
  L.stands = L.stands.map((s) => s.map((f) => order[f]));

}

/* ---------- layout: stands in one or two rows on the counter ---------- */
function computeGeo() {
  const S = G.stands.length;
  const rows = S <= 6 ? 1 : 2, per = Math.ceil(S / rows);
  const W = Math.min($('#counterWrap').clientWidth, 452);
  const pad = 14, gap = per >= 7 ? 9 : 14;
  const top = $('#counterWrap').getBoundingClientRect().top + window.scrollY;
  const availH = Math.max(260, window.innerHeight - top - $('#foot').offsetHeight - 40);
  let sw = Math.min(70, (W - pad * 2 - gap * (per - 1)) / per);
  let lh = sw * 0.44;
  /* each row: lift room + CAP layers + plate */
  const rowH = () => lh * 1.5 + lh * CAP + sw * 0.22 + 22;
  while (rows * rowH() + pad * 2 > availH && sw > 30) { sw -= 2; lh = sw * 0.44; }
  const plateH = Math.max(8, sw * 0.2);
  const rh = rowH();
  return { S, rows, per, W, pad, gap, sw, lh, plateH, rh, H: rows * rh + pad * 2 - 8 };
}
function standXY(s) {
  const r = Math.floor(s / geo.per), inRow = r === geo.rows - 1 ? geo.S - geo.per * r : geo.per;
  const c = s - r * geo.per;
  const rowW = inRow * geo.sw + (inRow - 1) * geo.gap;
  return { x: (geo.W - rowW) / 2 + c * (geo.sw + geo.gap), y: geo.pad + r * geo.rh + geo.lh * 1.5 };
}
function layerXY(s, k, lifted) {
  const p = standXY(s);

}
function build() {

  counter.style.height = geo.H + 'px';
  counter.style.width = geo.W + 'px';
  counter.style.setProperty('--lh', geo.lh + 'px');
  counter.style.setProperty('--plateH', geo.plateH + 'px');
  G.standEls = G.stands.map((_, s) => {
    const d = document.createElement('div');
    d.className = 'stand';
    const p = standXY(s);
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    d.style.width = geo.sw + 'px'; d.style.height = (CAP * geo.lh + geo.plateH) + 'px';
    d.innerHTML = '<div class="slot"></div><div class="foot"></div><div class="plate"></div>';
    d.dataset.s = s;
    d.setAttribute('role', 'button');
    d.tabIndex = 0;
    counter.appendChild(d);
    return d;
  });
  G.els = {}; G.toppers = {};
  G.stands.forEach((st, s) => st.forEach((l, k) => {
    const e = document.createElement('div');
    e.style.width = geo.sw * 0.88 + 'px';
    e.style.height = geo.lh * 0.94 + 'px';
    counter.appendChild(e);
    G.els[l.id] = e;

}
function render(instant) {
  G.stands.forEach((st, s) => {
    st.forEach((l, k) => {
      const e = G.els[l.id];
      if (!l.hidden && e.classList.contains('mystery')) { e.classList.add('reveal'); }
      e.className = 'layer ' + (l.hidden ? 'mystery' : 'f' + l.f) + (e.classList.contains('reveal') && !l.hidden ? ' reveal' : '');
      const run = s === G.sel ? topRun(st.map((x) => x.f)) : 0;
      const p = layerXY(s, k, s === G.sel && k >= st.length - run);
      if (instant) e.style.transition = 'none';
      e.style.left = p.x + 'px'; e.style.top = p.y + 'px';
      if (instant) { void e.offsetWidth; e.style.transition = ''; }
    });
    const el = G.standEls[s];

    el.classList.toggle('done', done);

      t.style.left = (p.x - geo.sw * 0.08) + 'px'; t.style.top = (p.y - geo.lh * 0.95) + 'px';
      t.style.width = geo.sw * 1.04 + 'px'; t.style.height = geo.lh * 1.25 + 'px';

}
function starsNow() {

window.addEventListener('resize', () => { if (G) build(); });

/* ---------- input: tap a stand to lift its top layers, tap another to set them down ---------- */
function flavours(s) { return G.stands[s].map((l) => l.f); }
function tapStand(s) {

  clearHint();
  const st = G.stands[s];
  if (G.sel < 0) {
    if (!st.length || isDone(flavours(s))) { nope(s); return; }
    G.sel = s; sfx('pick'); render(); return;
  }
  if (G.sel === s) { G.sel = -1; sfx('drop'); render(); return; }
  const from = G.sel;
  const fl = G.stands.map((x) => x.map((l) => l.f));
  if (!canMove(fl, from, s)) { G.sel = -1; render(); nope(s); return; }
  G.history.push(snapshot());
  if (G.history.length > 200) G.history.shift();
  const n = moveCount(fl, from, s);
  const moving = [];
  for (let k = 0; k < n; k++) moving.unshift(G.stands[from].pop());
  for (const l of moving) G.stands[s].push(l);
  /* the newly exposed layer is revealed */
  const src = G.stands[from];
  if (src.length && src[src.length - 1].hidden) src[src.length - 1].hidden = false;
  G.moves++; G.sel = -1;
  /* a finished cake shows all its layers */
  if (isDone(flavours(s))) for (const l of G.stands[s]) l.hidden = false;
  arc(moving, from, s);

  sfx('place', n);
  if (isDone(flavours(s))) { sfx('done'); haptic(25); }

/* moving layers hop up and over in a little arc */
function arc(layers, from, to) {

    const e = G.els[l.id];
    const k = G.stands[to].indexOf(l);
    const a = layerXY(from, G.stands[from].length + i, true), b = layerXY(to, k);
    const midY = Math.min(a.y, b.y) - geo.lh * 1.2;

        { transform: 'translate(' + (a.x - b.x) + 'px,' + (a.y - b.y) + 'px)' },

const disarmRestart = armConfirm($('#btnRestart'), $('#restartLabel'), 'Restart',
  () => G && !G.won && G.moves > 0,
  () => {
    if (G.won) { loadLevel(G.idx + 1); return; }
    delete save.cur; persist();
    startLevel(G.idx, G.L);
  });
shellBoot();
loadLevel(save.level || 0);
if (!save.seenHelp) { GAME.showHelp(); save.seenHelp = true; persist(); }
</script>
</body>
</html>
