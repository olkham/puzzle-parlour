<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thread Count</title>
<meta name="description" content="A cross-stitch picture-logic puzzle: use the number clues to stitch a hidden picture.">
<meta name="theme-color" content="#f3ebdf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thread Count">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ebdf;
  --card:#fffaf3;
  --card-edge:#e4d5c3;
  --ink:#2f2a44;
  --muted:#7d7591;
  --accent:#4456c7;
  --accent-ink:#ffffff;
  --heart:#e5484d;
  --star:#f2b84b;
  --gridink:#2f2a44;
  --mini:#cfd6ff;
  --shadow:0 10px 28px rgba(60,45,30,.14);
  --scrim:rgba(30,24,40,.55);
  --fabric:#f2e8d5;
  --hole:rgba(110,85,55,.22);
  --line:rgba(110,85,55,.20);
  --line5:rgba(80,60,40,.50);
  --frame:#c9a77c;
  --thread:#4456c7;
  --thread-hi:#7d8cf0;
  --dot:#9a8f84;
  --wrong:#d3182f;
  --wrongbg:#f9d4d4;
  --hl:rgba(68,86,199,.13);
  --ghost:rgba(68,86,199,.32);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16141f;
    --card:#211e2e;
    --card-edge:#383352;
    --ink:#f1eefb;
    --muted:#a9a3c2;
    --accent:#8f9cff;
    --accent-ink:#151532;
    --heart:#ff6b86;
    --star:#f6c35b;
    --gridink:#0c0b12;
    --mini:#3b4380;
    --shadow:0 10px 28px rgba(0,0,0,.45);
    --scrim:rgba(6,4,14,.7);
    --fabric:#2b2738;
    --hole:rgba(0,0,0,.35);
    --line:rgba(255,255,255,.08);
    --line5:rgba(255,255,255,.26);
    --frame:#7b6650;
    --thread:#aab6ff;
    --thread-hi:#d6dcff;
    --dot:#7d7894;
    --wrong:#ff5c6c;
    --wrongbg:#4a2230;
    --hl:rgba(143,156,255,.16);
    --ghost:rgba(170,182,255,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16141f;--card:#211e2e;--card-edge:#383352;--ink:#f1eefb;--muted:#a9a3c2;--accent:#8f9cff;--accent-ink:#151532;
  --heart:#ff6b86;--star:#f6c35b;--gridink:#0c0b12;--mini:#3b4380;--shadow:0 10px 28px rgba(0,0,0,.45);--scrim:rgba(6,4,14,.7);
  --fabric:#2b2738;--hole:rgba(0,0,0,.35);--line:rgba(255,255,255,.08);--line5:rgba(255,255,255,.26);--frame:#7b6650;
  --thread:#aab6ff;--thread-hi:#d6dcff;--dot:#7d7894;--wrong:#ff5c6c;--wrongbg:#4a2230;--hl:rgba(143,156,255,.16);--ghost:rgba(170,182,255,.3);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:default}
.title{text-align:center;line-height:1.05;min-width:0}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status row */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:34px;gap:10px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.pop{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star.off path{fill:none;stroke:var(--muted);opacity:.5}

/* control hints */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how > div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--mini);display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn[hidden]{display:none}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn .tag{font-size:12px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .art{width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%;overflow:visible}
.sheet .badge-row{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .badge-row svg{width:30px;height:30px}
.sheet .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px}
.sheet .logo svg{width:44px;height:44px}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mini);border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:74%;height:74%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;min-height:66px;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:10px}
.lv .mh svg{width:10px;height:10px}
.lv .mh .heart path,.lv .mh .star path{stroke:none}
.lv .mh .lost path,.lv .mh .off path{fill:var(--card-edge);opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.25;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  width:max-content;max-width:min(88vw,420px);text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .top{gap:6px;grid-template-columns:auto 1fr 42px}
  .top-left{gap:4px}
  .top-left .icon-btn{width:40px;height:40px;border-radius:13px}
  .top > .icon-btn{width:42px;height:42px;border-radius:14px}
  .title h1{font-size:23px}
  .foot{gap:8px}
}
@media (max-width:340px){
  .title h1{font-size:19px}
  .title p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- the hoop: clues on the top and left, fabric grid in the corner ---------- */
.hoop-wrap{display:flex;justify-content:center;align-items:center;width:100%;flex:1;touch-action:none}
.hoop{
  position:relative;display:grid;grid-template-columns:var(--rw,auto) var(--vw,auto);grid-template-rows:var(--ch,auto) var(--vh,auto);
  background:var(--card);border:2px solid var(--card-edge);border-radius:20px;
  padding:8px 10px 10px 8px;box-shadow:var(--shadow);
}
.corner{display:grid;place-items:center;padding:0 6px 6px 0}
.corner canvas{display:block;image-rendering:pixelated;border-radius:6px;background:var(--fabric);box-shadow:0 0 0 2px var(--frame)}
/* zoomed in, each part is a window: the clues slide along with the grid but stay pinned to its edges */
.clip{overflow:hidden;overflow:clip;min-width:0;min-height:0;touch-action:none}
.cclip{display:flex;align-items:flex-end}
.rclip{display:flex;align-items:flex-start;justify-content:flex-end}
.gclip{border-radius:6px}
.cclues,.rclues,.grid{flex:none}
.cclues{display:grid;grid-template-columns:repeat(var(--w),var(--cs));align-items:end;padding:0 2px}
.cclue{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  font-size:var(--fs);line-height:1.08;padding:3px 0 5px;font-weight:600;color:var(--ink);
  border-radius:9px 9px 0 0;font-variant-numeric:tabular-nums;transition:color .2s,opacity .2s;
}
.rclues{display:grid;grid-template-rows:repeat(var(--h),var(--cs));padding:2px 0}
.rclue{
  display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--fs)*.3);
  padding:0 7px 0 4px;font-size:var(--fs);font-weight:600;color:var(--ink);
  border-radius:9px 0 0 9px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .2s,opacity .2s;
}
/* commas between a row's numbers, so "3 1" can't be read as 31 */
.rclue span:not(:last-child)::after{content:","}
.cclue.hl,.rclue.hl{background:var(--hl)}
.cclue.done,.rclue.done{color:var(--muted);opacity:.5}
.cclue.hint,.rclue.hint{background:var(--accent);color:var(--accent-ink);opacity:1}

.grid{
  display:grid;grid-template-columns:repeat(var(--w),var(--cs));grid-template-rows:repeat(var(--h),var(--cs));width:max-content;
  background-color:var(--fabric);
  border:2px solid var(--frame);border-radius:6px;touch-action:none;position:relative;outline:none;
}
.grid:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.cell{
  position:relative;min-width:0;min-height:0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background-image:radial-gradient(circle at 0 0,var(--hole) 0 1.3px,transparent 1.8px);
  transition:border-color .5s;
}
.cell.c5{border-right:2px solid var(--line5)}
.cell.r5{border-bottom:2px solid var(--line5)}
.cell.cl{border-right:0}
.cell.rl{border-bottom:0}
.cell.cur{box-shadow:inset 0 0 0 2px var(--accent)}

/* a cross-stitch is two diagonal threads; the top one is drawn a touch lighter */
.cell.s::before,.cell.s::after,.cell.g::before,.cell.g::after{
  content:"";position:absolute;left:-10%;right:-10%;top:50%;height:24%;margin-top:-12%;
  border-radius:99px;background-color:var(--th,var(--thread));
  transition:background-color .55s ease var(--d,0s);
  z-index:1;
}
.cell.s::before,.cell.g::before{transform:rotate(45deg);box-shadow:0 1px 1.5px rgba(0,0,0,.25)}
.cell.s::after,.cell.g::after{transform:rotate(-45deg);background-image:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 60%);box-shadow:0 1px 1.5px rgba(0,0,0,.22)}
.cell.s.pop::before{animation:stitchA .2s ease-out both}
.cell.s.pop::after{animation:stitchB .2s ease-out .07s both}
@keyframes stitchA{from{transform:rotate(45deg) scaleX(0)}to{transform:rotate(45deg) scaleX(1)}}
@keyframes stitchB{from{transform:rotate(-45deg) scaleX(0)}to{transform:rotate(-45deg) scaleX(1)}}
.cell.g::before,.cell.g::after{background-color:var(--ghost);box-shadow:none;background-image:none}

.cell.m::before{
  content:"";position:absolute;left:50%;top:50%;width:20%;height:20%;margin:-10% 0 0 -10%;
  border-radius:50%;background:var(--dot);
}
.cell.x{background-color:var(--wrongbg);animation:shake .4s ease}
.cell.x::before,.cell.x::after{
  content:"";position:absolute;left:24%;right:24%;top:50%;height:11%;margin-top:-5.5%;
  border-radius:99px;background:var(--wrong);
}
.cell.x::before{transform:rotate(45deg)}
.cell.x::after{transform:rotate(-45deg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10%)}50%{transform:translateX(8%)}75%{transform:translateX(-5%)}}
.cell.hint{animation:hintpulse 1s ease-in-out 3;z-index:2}
@keyframes hintpulse{0%,100%{box-shadow:inset 0 0 0 2px var(--accent)}50%{box-shadow:inset 0 0 0 5px var(--accent),0 0 12px var(--accent)}}

/* finished: the gridlines fade and every stitch takes on its real colour */
.grid.bloom{border-color:var(--frame)}
.grid.bloom .cell{border-color:transparent}
.grid.bloom .cell.s::before,.grid.bloom .cell.s::after{--th:var(--pc)}
.hoop.solved .cclue,.hoop.solved .rclue{opacity:.25}

/* footer */
.seg{flex:1.6;display:flex;background:var(--card);border:2px solid var(--card-edge);border-radius:16px;padding:3px;gap:3px;min-height:48px}
.seg button{
  flex:1;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:600;color:var(--muted);padding:0 6px;
}
.seg button svg{width:20px;height:20px;flex:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn.sq{flex:0 0 52px;padding:0}
#restartIcon svg{width:18px;height:18px}
@media (max-width:370px){
  #restartIcon,.seg button span{display:none}
  .seg button{padding:0 4px}
  .btn.sq{flex-basis:48px}
}
.lv .thumb{width:36px;height:30px;display:grid;place-items:center;margin-bottom:2px}
.lv .thumb svg{max-width:100%;max-height:100%}
.lv.done small{font-weight:600;color:var(--ink)}
.sheet .frame{width:132px;height:132px;margin:0 auto 12px;border-radius:50%;background:var(--fabric);box-shadow:0 0 0 7px var(--frame),0 0 0 10px var(--card-edge),var(--shadow);display:grid;place-items:center}
.sheet .frame svg{width:66%;height:66%}
.hoop .zoom-fit{top:-14px;left:-14px}

/* zoom-out button, shown while zoomed in */
.zoom-fit{
  position:absolute;z-index:4;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;
  background:var(--card);border:2px solid var(--card-edge);box-shadow:var(--shadow);color:var(--ink);
  animation:zoomfit .2s ease;touch-action:manipulation;
}
.zoom-fit[hidden]{display:none}
.zoom-fit svg{width:21px;height:21px}
.zoom-fit:active{transform:scale(.92)}
@keyframes zoomfit{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="btnLevels" aria-label="Choose level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false"><span id="musicIcon"></span></button>
      <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false"><span id="sfxIcon"></span></button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">&nbsp;</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Lives and progress">
    <div class="lives" id="lives" aria-live="polite"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="hoop-wrap" id="hoopWrap">
    <div class="hoop" id="hoop">
      <div class="corner"><canvas id="preview" aria-hidden="true"></canvas></div>
      <div class="clip cclip"><div class="cclues" id="cclues" aria-hidden="true"></div></div>
      <div class="clip rclip"><div class="rclues" id="rclues" aria-hidden="true"></div></div>

<script>
const GAME = { id: 'thread-count', seed: 4111 };

}

function heartsHTML(left, max, cls) {

/* =====================================================================

const MUSIC_KEY = GAME.id + '-music-v1', SFX_KEY = GAME.id + '-sfx-v1';
let musicOn = false, sfxOn = false;
try { musicOn = localStorage.getItem(MUSIC_KEY) === '1'; sfxOn = localStorage.getItem(SFX_KEY) === '1'; } catch (e) {}

}
const NOTE_FREQ = {};
function noteFreq(note) {
  if (!note) return 0;
  if (typeof note === 'number') return note;
  if (NOTE_FREQ[note]) return NOTE_FREQ[note];
  const m = /^([A-G])(#|b)?(\d)$/.exec(note);
  if (!m) return 0;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);

/* one synth voice: oscillator -> (optional lowpass) -> envelope -> bus */
function tone(t, f, o) {

/* a burst of filtered noise: shakers, splashes, rustles */

  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);

const INST = {
  pluck: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.008, dur: Math.min(d * 0.9, 0.35), vol: v || 0.16, bus: musicBus }),
  bell: (t, f, d, v) => {
    v = v || 0.11;

    tone(t, f * 2.005, { type: 'sine', a: 0.003, dur: Math.min(d, 0.45), vol: v * 0.32, bus: musicBus });
    tone(t, f * 3.01, { type: 'sine', a: 0.002, dur: 0.12, vol: v * 0.12, bus: musicBus });
  },
  marimba: (t, f, d, v) => {
    v = v || 0.17;
    tone(t, f, { type: 'sine', a: 0.003, dur: Math.min(d * 0.85, 0.5), vol: v, bus: musicBus });
    tone(t, f * 3.98, { type: 'sine', a: 0.002, dur: 0.07, vol: v * 0.22, bus: musicBus });
  },
  flute: (t, f, d, v) => tone(t, f, { type: 'sine', a: 0.06, hold: d * 0.45, dur: d * 0.55 + 0.08, vol: v || 0.1, vib: 0.006, vibRate: 5, bus: musicBus }),
  reed: (t, f, d, v) => tone(t, f, { type: 'square', a: 0.02, hold: d * 0.35, dur: d * 0.5, vol: v || 0.045, lp: 1500, bus: musicBus }),
  harp: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.004, dur: Math.min(d * 2.5, 1.3), vol: v || 0.08, lp: 2400, bus: musicBus }),
  bass: (t, f, d, v) => tone(t, f, { type: 'sine', a: 0.02, dur: d, vol: v || 0.13, bus: musicBus }),
  wbass: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.01, dur: Math.min(d * 0.9, 0.55), vol: v || 0.15, lp: 650, bus: musicBus }),
  hat: (t, v) => noise(t, { f: 8000, q: 0.7, dur: 0.03, vol: v || 0.025, ftype: 'highpass', bus: musicBus }),
  shaker: (t, v) => noise(t, { f: 5500, q: 1.2, dur: 0.06, vol: v || 0.03, bus: musicBus }),

/* "E5:.5 - G5:1" -> [{n:'E5', d:.5}, {n:null, d:1}, ...] ("-" or "r" is a rest, default length 1 beat) */
function track(str) {
  return str.trim().split(/\s+/).map((tok) => {
    const p = tok.split(':');
    return { n: p[0] === '-' || p[0] === 'r' ? null : p[0], d: p[1] ? parseFloat(p[1]) : 1 };
  });
}
function scheduler() {
  const M = GAME.music, beat = 60 / M.tempo, until = actx.currentTime + 0.2;
  for (const tr of M.tracks) {

      const dur = s.d * beat;
      if (s.n) {

function setMusic(on, fromUser) {

  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Turn music off' : 'Turn music on');
  $('#musicIcon').innerHTML = on ? ICON.musicOn : ICON.musicOff;

  if (ambientStop) { try { ambientStop(); } catch (e) {} ambientStop = null; }

    const t0 = actx.currentTime + 0.06;
    for (const tr of GAME.music.tracks) { tr.next = t0; tr.i = 0; }

}
function setSfx(on) {

  try { localStorage.setItem(SFX_KEY, on ? '1' : '0'); } catch (e) {}

  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Turn sound effects off' : 'Turn sound effects on');

/* sound effects every game can use */
const SFX = {
  warn(t) {

  },
  fail(t) {
    [['G4', 0.22], ['F#4', 0.22], ['F4', 0.22], ['E4', 0.6]].forEach(([n, d], i) => {

    });

  win(t) {

    ['C5', 'E5', 'G5', 'C6'].forEach((n) => tone(c, noteFreq(n), { type: 'sawtooth', a: 0.03, dur: 0.7, vol: 0.1, lp: 3000 }));

}
document.addEventListener('pointerdown', primeAudioOnce, true);
document.addEventListener('visibilitychange', () => {
  if (!actx) return;

/* ---------- little helpers ---------- */
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

function toast(msg, ms) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg;

      labelEl.textContent = 'Confirm?';
      armed = setTimeout(() => { labelEl.textContent = label; armed = 0; }, 2200);
      return;
    }
    clearTimeout(armed); armed = 0; labelEl.textContent = label;
    go();
  });

}

/* ---------- modal plumbing ---------- */
let modalLocked = false;
function openModal(html, locked) {

}
function closeModal() { modalLocked = false; scrim.classList.remove('open'); scrim.innerHTML = ''; }
function modalOpen() { return scrim.classList.contains('open'); }
scrim.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target === scrim && !modalLocked) closeModal(); return; }
  const act = a.dataset.act;
  if (act === 'close') closeModal();
  else if (act === 'levels') showLevels();
  else if (act === 'page') showLevels(+a.dataset.page);
  else if (act === 'pick') loadLevel(+a.dataset.level);
  else if (act === 'next') loadLevel(curLevel() + 1);
  else if (act === 'retry') loadLevel(curLevel());

/* opened from the Puzzle Parlour launcher? then offer a way back to it */
let FROM_PARLOUR = false;
try {
  if (location.hash === '#parlour') sessionStorage.setItem('parlour', '1');
  FROM_PARLOUR = location.hash === '#parlour' || sessionStorage.getItem('parlour') === '1';
} catch (e) { FROM_PARLOUR = location.hash === '#parlour'; }

/* ---------- level picker: pages of 20, with each finished level's best result ---------- */
const PAGE = 20;
function curLevel() { return (typeof G !== 'undefined' && G) ? G.idx : (save.level || 0); }
function showLevels(page) {
  const cur = curLevel();
  const total = GAME.total || Infinity;
  if (typeof page !== 'number') page = Math.floor(cur / PAGE);
  const first = page * PAGE, last = Math.min(first + PAGE, total);
  let h = '<h2>Levels</h2><div class="pager">' +
    '<button class="icon-btn" data-act="page" data-page="' + (page - 1) + '"' + (page === 0 ? ' disabled' : '') + ' aria-label="Earlier levels">' + ICON.chevL + '</button>' +
    '<span>' + (first + 1) + '–' + last + '</span>' +
    '<button class="icon-btn" data-act="page" data-page="' + (page + 1) + '"' + (last >= total ? ' disabled' : '') + ' aria-label="Later levels">' + ICON.chevR + '</button>' +

/* =====================================================================
   Zoom and pan, for when the board gets big. Pinch with two fingers to
   zoom (moving them drags the board around), or use the mouse wheel, a
   trackpad pinch or the + − 0 keys. One finger still plays: a touch waits
   a moment, or until it moves or lifts, before the game sees it, so the
   first finger of a pinch never plays a move by accident. The game gives:
     el                     the area that takes touches
     layout()               lay the board out at zoom Z.z (setting Z.max on
                            the way) and return {cw, ch, vw, vh, left, top}:
                            the board's size at that zoom, the size of the
                            window onto it, and where that window is on screen
     pan()                  slide the board so (Z.x, Z.y) sits at the window's
                            top-left corner
     down/move/up/cancel(e) one-finger play
     canPan(e)              optional: when zoomed in, should a one-finger drag
                            from here slide the board instead of playing?
     focus()                optional: the screen point the keys zoom around
     fit, tip               the zoom-out button, and a first-time tip
   ===================================================================== */
const ZOOM_ICON = {
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20 20M7.6 10.5h5.8"/></svg>',
  in: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20 20M7.6 10.5h5.8M10.5 7.6v5.8"/></svg>'
};
function makeZoom(o) {
  const Z = { z: 1, x: 0, y: 0, max: 1, g: null };
  const pts = new Map();          /* touches on the board: pointerId -> {x, y} */
  let mode = '';                  /* '' | 'wait' | 'play' | 'pan' | 'pinch' */
  let one = null, pinch = null, raf = 0, tween = 0, gs = 0;
  const WAIT = 220;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  /* only boards that gain at least a quarter from zooming can zoom */
  const zoomable = () => Z.max >= 1.25;
  const top = () => (zoomable() ? Z.max : 1);
  const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (o.fit) {
    o.fit.innerHTML = ZOOM_ICON.out;
    o.fit.addEventListener('click', () => reset(true));
  }

  function settle() {
    const g = Z.g;
    if (Z.z <= 1) { Z.x = 0; Z.y = 0; }
    Z.x = clamp(Z.x, 0, Math.max(0, g.cw - g.vw));
    Z.y = clamp(Z.y, 0, Math.max(0, g.ch - g.vh));
    o.pan();
    if (o.fit) o.fit.hidden = Z.z <= 1.01;
  }
  /* the board point under a screen point, as a fraction of the board's size */
  function at(cx, cy) { const g = Z.g; return [(cx - g.left + Z.x) / g.cw, (cy - g.top + Z.y) / g.ch]; }
  /* zoom to z with board point (u, v) under screen point (cx, cy) */
  function place(z, cx, cy, u, v) {
    z = clamp(z, 1, top());
    if (z !== Z.z || !Z.g) { Z.z = z; Z.g = o.layout(); }
    Z.x = u * Z.g.cw - (cx - Z.g.left);
    Z.y = v * Z.g.ch - (cy - Z.g.top);
    settle();
  }
  function zoomAt(z, cx, cy) {
    cancelAnimationFrame(tween);
    Z.g = o.layout();
    if (cx == null) { cx = Z.g.left + Z.g.vw / 2; cy = Z.g.top + Z.g.vh / 2; }
    const [u, v] = at(cx, cy);
    place(z, cx, cy, u, v);
  }
  function panBy(dx, dy) { if (Z.z > 1) { Z.x += dx; Z.y += dy; settle(); } }
  /* after a resize or a new board: lay out again at the current zoom */
  function refresh() {
    Z.g = o.layout();
    if (Z.z > top()) { Z.z = top(); Z.g = o.layout(); }
    settle();
  }
  /* back to the whole board, gliding there if asked */
  function reset(glide) {
    cancelAnimationFrame(tween);
    if (!glide || Z.z <= 1.01 || calm()) { Z.z = 1; refresh(); return; }
    Z.g = o.layout();
    const cx = Z.g.left + Z.g.vw / 2, cy = Z.g.top + Z.g.vh / 2, [u, v] = at(cx, cy), z0 = Z.z, t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 260);
      place(z0 + (1 - z0) * (1 - Math.pow(1 - k, 3)), cx, cy, u, v);
      if (k < 1) tween = requestAnimationFrame(step);
    };
    tween = requestAnimationFrame(step);
  }
  /* slide the board so a box (in board pixels at the current zoom) is in view */
  function show(x, y, w, h) {
    if (Z.z <= 1 || !Z.g) return;
    const g = Z.g, m = 10;
    if (x - m < Z.x) Z.x = x - m; else if (x + w + m > Z.x + g.vw) Z.x = x + w + m - g.vw;
    if (y - m < Z.y) Z.y = y - m; else if (y + h + m > Z.y + g.vh) Z.y = y + h + m - g.vh;
    settle();
  }
  /* on a phone, mention pinching the first time a board is big enough to need it */
  function tip() {
    if (top() < 1.6 || save.zoomTip || !o.tip || !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) return;
    setTimeout(() => {
      if (save.zoomTip || modalOpen()) return;
      save.zoomTip = true; persist();
      toast(o.tip, 4200);
    }, 900);
  }

  /* ---------- touches, mouse and pen ---------- */
  function commit() {
    if (mode !== 'wait') return;
    clearTimeout(one.t);
    mode = 'play';
    o.down(one.e);
  }
  function startPinch(a, b) {
    cancelAnimationFrame(tween);
    const p = pts.get(a), q = pts.get(b);
    pinch = { ids: [a, b], d: Math.max(1, Math.hypot(p.x - q.x, p.y - q.y)), mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2 };
    mode = 'pinch'; one = null;
    Z.g = o.layout();
    for (const id of pinch.ids) { try { o.el.setPointerCapture(id); } catch (err) {} }
  }
  function pinchFrame() {
    raf = 0;
    if (mode !== 'pinch') return;
    const p = pts.get(pinch.ids[0]), q = pts.get(pinch.ids[1]);
    if (!p || !q) return;
    const d = Math.max(1, Math.hypot(p.x - q.x, p.y - q.y)), mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    /* keep the point that was between the fingers between them, at the new spread */
    const [u, v] = at(pinch.mx, pinch.my);
    place(Z.z * d / pinch.d, mx, my, u, v);
    pinch.d = d; pinch.mx = mx; pinch.my = my;
  }
  const startOne = (e) => ({ id: e.pointerId, e, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, pan: Z.z > 1.01 && (!o.canPan || !!o.canPan(e)) });
  const quit = (id, x, y) => o.cancel({ pointerId: id, clientX: x, clientY: y, type: 'pointercancel' });

  o.el.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('[data-zoom-skip]')) return;
    cancelAnimationFrame(tween);
    if (e.pointerType !== 'touch') {
      if (mode) return;
      if (e.button === 1) {
        if (Z.z > 1) { e.preventDefault(); one = startOne(e); mode = 'pan'; }
        return;
      }
      one = startOne(e); mode = 'play';
      o.down(e);
      return;
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === 'pinch') return;
    if (!mode) {
      one = startOne(e);
      if (zoomable()) { mode = 'wait'; one.t = setTimeout(commit, WAIT); }
      else { mode = 'play'; o.down(e); }
      return;
    }
    /* a second finger turns whatever the first was doing into a pinch (small boards don't zoom, so it's ignored there) */
    if (!one || !pts.has(one.id) || (mode === 'play' && !zoomable())) return;
    if (mode === 'wait') clearTimeout(one.t);
    else if (mode === 'play') { const p = pts.get(one.id); quit(one.id, p.x, p.y); }
    startPinch(one.id, e.pointerId);
  });
  window.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }
    if (mode === 'pinch') {
      if (p && pinch.ids.includes(e.pointerId) && !raf) raf = requestAnimationFrame(pinchFrame);
      return;
    }
    if (!one || e.pointerId !== one.id) return;
    const far = Math.hypot(e.clientX - one.x, e.clientY - one.y) > (e.pointerType === 'touch' ? 10 : 5);
    if (mode === 'wait' && far) {
      if (one.pan) { clearTimeout(one.t); mode = 'pan'; } else commit();
    } else if (mode === 'play' && far && one.pan) { quit(one.id, e.clientX, e.clientY); mode = 'pan'; }
    if (mode === 'play') o.move(e);
    else if (mode === 'pan') panBy(one.lx - e.clientX, one.ly - e.clientY);
    one.lx = e.clientX; one.ly = e.clientY;
  });
  function end(e) {
    pts.delete(e.pointerId);
    if (mode === 'pinch') {
      if (!pinch.ids.includes(e.pointerId)) return;
      /* lift one finger and the other carries on sliding the board */
      const rest = pinch.ids.find((id) => id !== e.pointerId && pts.has(id));
      pinch = null; cancelAnimationFrame(raf); raf = 0;
      if (rest !== undefined) { const q = pts.get(rest); one = { id: rest, x: q.x, y: q.y, lx: q.x, ly: q.y }; mode = 'pan'; }
      else { mode = ''; one = null; }
      return;
    }
    if (!one || e.pointerId !== one.id) return;
    const up = e.type === 'pointerup';
    if (mode === 'wait') { clearTimeout(one.t); if (up) { o.down(one.e); o.up(e); } }
    else if (mode === 'play') { if (up) o.up(e); else o.cancel(e); }
    mode = ''; one = null;
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  /* mouse wheel, and trackpad pinches (which arrive as wheel events with ctrl held) */
  o.el.addEventListener('wheel', (e) => {
    if (!zoomable()) return;
    e.preventDefault();
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    zoomAt(Z.z * Math.exp(-clamp(dy, -150, 150) * (e.ctrlKey ? 0.01 : 0.002)), e.clientX, e.clientY);
  }, { passive: false });
  /* Safari: trackpad pinches on a Mac, and stopping iPhones zooming the whole page */
  o.el.addEventListener('gesturestart', (e) => { e.preventDefault(); gs = pts.size ? 0 : (e.scale || 1); });
  o.el.addEventListener('gesturechange', (e) => {
    e.preventDefault();
    if (!gs || pts.size || !zoomable()) return;
    zoomAt(Z.z * e.scale / gs, e.clientX, e.clientY);
    gs = e.scale;
  });
  o.el.addEventListener('gestureend', (e) => { e.preventDefault(); gs = 0; });
  /* keys: + and - zoom, 0 shows the whole board */
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || modalOpen() || !zoomable() || !Z.g) return;
    const k = e.key;
    if (k === '0') { e.preventDefault(); reset(true); return; }
    const f = k === '+' || k === '=' ? 1.3 : k === '-' || k === '_' ? 1 / 1.3 : 0;
    if (!f) return;
    e.preventDefault();
    const p = o.focus && o.focus();
    zoomAt(Z.z * f, p ? p.x : null, p ? p.y : null);
  });

  return Object.assign(Z, { refresh, reset, zoomAt, panBy, show, tip });
}

/* ---------- nonogram logic: clues, a line solver, and a whole-grid logic solver ---------- */
/* runs of filled cells in a line, e.g. [1,1,0,1] -> [2,1]; an empty line gives [0] */
function runsOf(line) {
  const out = [];
  let run = 0;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === 1) run++;
    else if (run) { out.push(run); run = 0; }
  }
  if (run) out.push(run);
  return out.length ? out : [0];
}

/* Given a line's clue and what's known so far (-1 unknown, 0 empty, 1 filled),
   work out every cell that is forced across all valid placements.
   Returns a new array, or null if the line can't be satisfied. */
function lineSolve(clue, known) {
  const n = known.length;
  const blocks = clue.length === 1 && clue[0] === 0 ? [] : clue;
  const k = blocks.length;
  /* prefix count of cells known to be empty, so "can a block sit on [a,b)" is O(1) */
  const emptyBefore = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) emptyBefore[i + 1] = emptyBefore[i] + (known[i] === 0 ? 1 : 0);
  const fits = (a, len) => a + len <= n && emptyBefore[a + len] - emptyBefore[a] === 0 && (a + len === n || known[a + len] !== 1);
  const W = k + 1;
  /* reach[i*W+j]: positions 0..i-1 decided, j blocks placed, cell i is free to be anything */
  const fwd = new Uint8Array((n + 2) * W), bwd = new Uint8Array((n + 2) * W);
  fwd[0] = 1;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= k; j++) {
      if (!fwd[i * W + j]) continue;
      if (known[i] !== 1) fwd[(i + 1) * W + j] = 1;
      if (j < k && fits(i, blocks[j])) {
        const e = i + blocks[j];
        fwd[(e === n ? n : e + 1) * W + j + 1] = 1;
      }
    }
  }
  if (!fwd[n * W + k]) return null;
  bwd[n * W + k] = 1;
  for (let i = n - 1; i >= 0; i--) {
    for (let j = k; j >= 0; j--) {
      let ok = 0;
      if (known[i] !== 1 && bwd[(i + 1) * W + j]) ok = 1;
      if (!ok && j < k && fits(i, blocks[j])) {
        const e = i + blocks[j];
        if (bwd[(e === n ? n : e + 1) * W + j + 1]) ok = 1;
      }
      bwd[i * W + j] = ok;
    }
  }
  const canFill = new Uint8Array(n), canEmpty = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= k; j++) {
      if (!fwd[i * W + j]) continue;
      if (known[i] !== 1 && bwd[(i + 1) * W + j]) canEmpty[i] = 1;
      if (j < k && fits(i, blocks[j])) {
        const e = i + blocks[j], nx = e === n ? n : e + 1;
        if (bwd[nx * W + j + 1]) {
          for (let x = i; x < e; x++) canFill[x] = 1;
          if (e < n) canEmpty[e] = 1;
        }
      }
    }
  }
  const out = known.slice();
  for (let i = 0; i < n; i++) {
    if (canFill[i] && !canEmpty[i]) out[i] = 1;
    else if (canEmpty[i] && !canFill[i]) out[i] = 0;
    else if (!canFill[i] && !canEmpty[i]) return null;
  }
  return out;
}

/* Solve as far as line-by-line logic goes. grid: Int8Array w*h of -1/0/1 (modified in place).
   Returns 'solved', 'stuck' or 'bad'. maxSteps limits work (single-cell hints use 1 pass). */
function logicSolve(w, h, rowClues, colClues, grid) {
  const dirty = new Uint8Array(w + h).fill(1);
  let changed = true, guard = 0;
  while (changed && guard++ < 400) {
    changed = false;
    for (let L = 0; L < w + h; L++) {
      if (!dirty[L]) continue;
      dirty[L] = 0;
      const isRow = L < h, idx = isRow ? L : L - h, len = isRow ? w : h;
      const known = new Array(len);
      for (let x = 0; x < len; x++) known[x] = grid[isRow ? idx * w + x : x * w + idx];
      const res = lineSolve(isRow ? rowClues[idx] : colClues[idx], known);
      if (!res) return 'bad';
      for (let x = 0; x < len; x++) {
        if (res[x] !== known[x]) {
          grid[isRow ? idx * w + x : x * w + idx] = res[x];
          dirty[isRow ? h + x : x] = 1;
          changed = true;
        }
      }
    }
  }
  for (let i = 0; i < w * h; i++) if (grid[i] < 0) return 'stuck';
  return 'solved';
}

/* clues for a solution mask (Uint8Array/array of 0/1, row-major) */
function cluesFor(w, h, sol) {
  const rows = [], cols = [];
  for (let r = 0; r < h; r++) { const line = []; for (let c = 0; c < w; c++) line.push(sol[r * w + c]); rows.push(runsOf(line)); }
  for (let c = 0; c < w; c++) { const line = []; for (let r = 0; r < h; r++) line.push(sol[r * w + c]); cols.push(runsOf(line)); }
  return { rows, cols };
}

/* true if the picture has exactly one solution and logic alone reaches it */
function isLogicSolvable(w, h, sol) {
  const { rows, cols } = cluesFor(w, h, sol);
  const grid = new Int8Array(w * h).fill(-1);
  return logicSolve(w, h, rows, cols, grid) === 'solved';
}

if (typeof module !== 'undefined') module.exports = { runsOf, lineSolve, logicSolve, cluesFor, isLogicSolvable };

  const tr = drag.axis === 'row' ? drag.r0 : p.r, tc = drag.axis === 'row' ? p.c : drag.c0;
  while (drag.live && (drag.r !== tr || drag.c !== tc)) {
    if (drag.axis === 'row') drag.c += Math.sign(tc - drag.c); else drag.r += Math.sign(tr - drag.r);
    setHighlight(drag.r, drag.c);
    drag.live = applyAt(drag.r, drag.c);
  }
  queueSave();
}
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  drag = null;
  if (G && !G.won && !G.over) setHighlight(-1, -1);
  queueSave();
}
grid.addEventListener('contextmenu', (e) => e.preventDefault());

const zoom = makeZoom({
  el: $('#hoopWrap'),
  fit: $('#zoomFit'),
  layout, pan: panBoard,
  down: playDown, move: playMove, up: endDrag, cancel: endDrag,
  /* zoomed in, a one-finger drag on the clues or around the hoop slides the board */
  canPan: (e) => !cellFromPoint(e.clientX, e.clientY),
  focus: () => {
    if (!cursor.show) return null;
    const r = grid.getBoundingClientRect();
    return { x: r.left + 2 + (cursor.c + 0.5) * cellPx, y: r.top + 2 + (cursor.r + 0.5) * cellPx };
  },
  tip: 'Tip: pinch the hoop to zoom in. Drag with two fingers, or along the clues, to look around.'
});

/* keyboard: arrows move a cursor, Enter/Space stitches, X / . / M marks */
grid.addEventListener('keydown', (e) => {
  if (!G || G.over || G.won) return;
  const k = e.key;
  const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  const old = cursor.r * G.w + cursor.c;
  if (moves[k]) {
    e.preventDefault();
    cursor.r = Math.max(0, Math.min(G.h - 1, cursor.r + moves[k][0]));
    cursor.c = Math.max(0, Math.min(G.w - 1, cursor.c + moves[k][1]));
    cursor.show = true;
    renderCell(old); renderCell(cursor.r * G.w + cursor.c);
    setHighlight(cursor.r, cursor.c);
    showCell(cursor.r, cursor.c);
    return;
  }
  let act = null;
  if (k === 'Enter' || k === ' ') act = 'fill';
  else if (k === 'x' || k === 'X' || k === '.' || k === 'm' || k === 'M') act = G.cells[old] === 2 ? 'unmark' : 'mark';
  if (!act) return;
  e.preventDefault();
  cursor.show = true;
  clearHint();
  drag = { act, count: 0 };
  applyAt(cursor.r, cursor.c);
  drag = null;
  if (G && !G.won && !G.over) renderCell(cursor.r * G.w + cursor.c);
  queueSave();
});
grid.addEventListener('blur', () => { if (cursor.show && G) { cursor.show = false; renderCell(cursor.r * G.w + cursor.c); setHighlight(-1, -1); } });

function setMode(m) {
  mode = m;
  $('#modeFill').setAttribute('aria-pressed', String(m === 'fill'));
  $('#modeMark').setAttribute('aria-pressed', String(m === 'mark'));
}
$('#modeFill').addEventListener('click', () => setMode('fill'));
$('#modeMark').addEventListener('click', () => setMode('mark'));

/* ---------- hint: find a square that one row or column already pins down ---------- */
function findHint() {
  const { w, h, sol } = G;
  const known = new Int8Array(w * h).fill(-1);
  for (let i = 0; i < w * h; i++) {
    const s = G.cells[i];
    if (s === 1) known[i] = 1;
    else if (s === 3 || (s === 2 && !sol[i])) known[i] = 0;
  }
  const lines = shuffleArr([...Array(w + h).keys()], Math.random);
  let fallback = null;
  for (const L of lines) {
    const isRow = L < h, k = isRow ? L : L - h, n = isRow ? w : h;
    const line = [];
    for (let x = 0; x < n; x++) line.push(known[isRow ? k * w + x : x * w + k]);
    const res = lineSolve(isRow ? G.rows[k] : G.cols[k], line);
    if (!res) continue;
    for (let x = 0; x < n; x++) {
      if (line[x] !== -1 || res[x] === -1) continue;
      const i = isRow ? k * w + x : x * w + k;
      if (res[x] === 1 && G.cells[i] !== 1) return { i, fill: true, isRow, k };
      if (res[x] === 0 && G.cells[i] === 0 && !fallback) fallback = { i, fill: false, isRow, k };
    }
  }
  return fallback;
}
$('#btnHint').addEventListener('click', () => {
  if (!G || G.over || G.won) return;
  clearHint();
  const hnt = findHint();
  if (!hnt) { toast('Every square left is already worked out — keep stitching!'); return; }
  grid.children[hnt.i].classList.add('hint');
  showCell(Math.floor(hnt.i / G.w), hnt.i % G.w);
  (hnt.isRow ? rclues : cclues).children[hnt.k].classList.add('hint');
  toast(hnt.fill ? 'This ' + (hnt.isRow ? 'row' : 'column') + ' says the glowing square needs a stitch.'
                 : 'This ' + (hnt.isRow ? 'row' : 'column') + ' says the glowing square stays empty.', 2800);
  hintTimer = setTimeout(clearHint, 3200);
  sfx('hint');
});

/* ---------- win and lose ---------- */
const WIN_TITLES = ['Sew lovely!', 'Neatly stitched!', 'Hoop hooray!', 'Picture perfect!', 'Darn good!'];
function win() {
  if (G.won) return;
  G.won = true;
  clearHint(); setHighlight(-1, -1);
  $('#restartLabel').textContent = 'Next';
  $('#restartIcon').innerHTML = ICON.chevR;
  const best = save.done[G.idx] || 0;
  save.done[G.idx] = Math.max(best, G.lives);
  delete save.cur;
  persist();
  /* bloom outward from the middle */
  const cx = (G.w - 1) / 2, cy = (G.h - 1) / 2, maxD = Math.hypot(cx, cy) || 1;
  for (let i = 0; i < G.w * G.h; i++) {
    const el = grid.children[i];
    if (G.cells[i] === 2) { G.cells[i] = 0; renderCell(i); }
    el.style.setProperty('--d', (Math.hypot(i % G.w - cx, Math.floor(i / G.w) - cy) / maxD * 0.7).toFixed(2) + 's');
  }
  hoop.classList.add('solved');
  zoom.reset(true);
  requestAnimationFrame(() => requestAnimationFrame(() => grid.classList.add('bloom')));
  drawPreview();
  sfx('bloom');
  winTimer = setTimeout(showWin, 1500);
}
function lose() {
  G.over = true;
  clearHint(); setHighlight(-1, -1);
  $('#restartLabel').textContent = 'Retry';
  delete save.cur; persist();
  for (let i = 0; i < G.w * G.h; i++) if (G.sol[i] && G.cells[i] !== 1) { G.cells[i] = 4; renderCell(i); }
  zoom.reset(true);
  drawPreview();
  sfx('fail');
  winTimer = setTimeout(showLose, 900);
}
function showWin() {
  const L = G.L;
  const what = L.kind === 'quilt' ? 'a <b>' + L.name.toLowerCase() + '</b> motif' : 'a <b>' + L.name.toLowerCase() + '</b>';
  openModal(
    '<div class="frame">' + pictureSVG(L) + '</div>' +
    '<h2>' + WIN_TITLES[G.idx % WIN_TITLES.length] + '</h2>' +
    '<p>You stitched ' + what + '.</p>' +
    '<div class="badge-row">' + heartsHTML(G.lives, MAX_LIVES) + '</div>' +
    '<div class="stack">' +
    '<button class="btn primary" data-act="next">Next level</button>' +
    '<button class="btn" data-act="levels">Your sampler</button>' +
    '<button class="btn" data-act="close">Admire it</button>' +
    '</div>'
  );
}
function showLose() {
  openModal(
    '<h2>Out of thread</h2>' +
    '<p>The rest of the pattern is shown faintly on the hoop. Have another go?</p>' +
    '<div class="stack">' +
    '<button class="btn primary" data-act="retry">Try again</button>' +
    '<button class="btn" data-act="close">View the pattern</button>' +
    '<button class="btn" data-act="levels">Choose level</button>' +
    '</div>'
  );
}

GAME.showHelp = () => {
  openModal(
    '<div class="logo">' + TC_ICON.needle + '<h2>Thread Count</h2></div>' +
    '<p>Stitch the hidden picture using the number clues.</p>' +
    '<ul class="rules">' +
    '<li><span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none" font-family="Fredoka,system-ui">3,1</text></svg></span><span>Each number is a run of stitches in that row or column, in order.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24"><path d="M3 12h7M14 12h7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span><span>Runs are split by at least one empty square.</span></li>' +
    '<li><span class="mini">' + TC_ICON.stitch + '</span><span>Tap or drag to stitch. A wrong stitch costs one of your 3 hearts.</span></li>' +
    '<li><span class="mini">' + TC_ICON.dot + '</span><span>Switch to <b>Mark</b> to dot squares you know are empty.</span></li>' +
    '<li><span class="mini">' + ICON.hint + '</span><span>Stuck? The bulb points at a square you can work out.</span></li>' +
    '<li><span class="mini">' + ZOOM_ICON.in + '</span><span>Big hoop? Pinch to zoom in, and drag with two fingers to look around.</span></li>' +
    '</ul>' +
    '<p style="font-size:15px;margin-top:-4px">Every puzzle has one answer, reachable by logic alone. Finished pictures bloom into colour and join your sampler.</p>' +
    '<div class="stack"><button class="btn primary" data-act="close">Start stitching</button></div>'
  );
};

/* ---------- music: a gentle music-box waltz ---------- */
GAME.music = {
  tempo: 104,
  tracks: [
    { inst: INST.bell, vol: 0.1, seq: track('A4 C5 F5 E5:1.5 D5:.5 C5 Bb4 D5 G5 F5:2 - A5 G5 F5 E5 G5 C6 Bb5 A5:.5 G5:.5 E5 F5:2 - ' +
      'C5 F5 A5 G5:1.5 F5:.5 E5 D5 F5 Bb5 A5:2 - C6 Bb5 A5 G5 A5 Bb5 A5 G5:.5 E5:.5 G5 F5:2 -') },
    { inst: INST.harp, vol: 0.06, seq: track('F3 C4 A3 C3 G3 E3 G2 D3 Bb3 F2 C3 A3 F2 A3 C4 C3 E3 G3 Bb2 F3 C3 F2 C3 F3 ' +
      'F3 C4 A3 C3 G3 E3 Bb2 F3 D4 F2 C3 A3 A2 E3 C4 Bb2 F3 D4 C3 G3 E3 F2 C3 F3') }
  ]
};
GAME.sfx = {
  stitch(t, k) {
    const f = 880 * Math.pow(2, ([0, 2, 4, 7, 9][(k || 0) % 5] + 12 * (Math.floor((k || 0) / 5) % 2)) / 12);
    tone(t, f, { type: 'sine', a: 0.002, dur: 0.08, vol: 0.06 });
    noise(t, { f: 4500, q: 3, dur: 0.03, vol: 0.03 });
  },
  mark(t) { tone(t, 520, { type: 'sine', to: 470, a: 0.002, dur: 0.05, vol: 0.05 }); },
  line(t, k) { SFX.chime(t, 3 + (k || 0)); },
  hint(t) { tone(t, 1320, { type: 'sine', a: 0.004, dur: 0.25, vol: 0.06 }); tone(t + 0.09, 1760, { type: 'sine', a: 0.004, dur: 0.3, vol: 0.05 }); },
  bloom(t) {
    SFX.win(t);
    [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => tone(t + 0.5 + k * 0.07, noteFreq('C6') * Math.pow(2, s / 12), { type: 'sine', a: 0.003, dur: 0.35, vol: 0.04 }));
  }
};

/* ---------- boot ---------- */
$('#icoStitch').innerHTML = TC_ICON.stitch;
$('#icoDot').innerHTML = TC_ICON.dot;
$('#btnHint').innerHTML = ICON.hint;
const disarmRestart = armConfirm($('#btnRestart'), $('#restartLabel'), 'Restart',
  () => G && !G.won && !G.over && (G.lives < MAX_LIVES || G.cells.some((v) => v === 1 || v === 2)),
  () => {
    if (G.won) { loadLevel(G.idx + 1); return; }
    delete save.cur; persist(); startLevel(G.idx, G.L);
  });
shellBoot();
loadLevel(save.level || 0);
if (!save.seenHelp) { GAME.showHelp(); save.seenHelp = true; persist(); }
</script>
