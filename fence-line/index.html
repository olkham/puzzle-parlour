<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fence Line</title>
<meta name="description" content="Build one fence around the field: a loop-logic puzzle where numbers count the fenced sides of each square.">
<meta name="theme-color" content="#eff1dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fence Line">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eff1dc;
  --card:#fbfcf1;
  --card-edge:#dcdfbd;
  --ink:#2f3524;
  --muted:#6f7658;
  --accent:#a95f2c;
  --accent-ink:#ffffff;
  --heart:#e5484d;
  --star:#f0b23e;
  --gridink:#2f3524;
  --mini:#d9ecb8;
  --shadow:0 10px 28px rgba(60,70,30,.15);
  --scrim:rgba(28,34,16,.55);
  --grass:#bcd98c;
  --grass-edge:#a6c974;
  --tuft:#93bb5f;
  --guide:rgba(58,80,28,.17);
  --lush:#79c04b;
  --lush-hi:#93d465;
  --rail:#b97a45;
  --rail-dark:#6b4220;
  --rail-hi:#e6b47e;
  --post:#8a5a32;
  --post-dark:#55341a;
  --post-top:#c79868;
  --stone:#f6f3e8;
  --stone-edge:#c3b99f;
  --stone-ink:#37321f;
  --cross:#5f6545;
  --wrong:#d63a2a;
  --wrongbg:#ffd7cf;
  --glow:#ffe27a;
  --wool:#fffdf6;
  --wool-edge:#cfc6b2;
  --face:#3d3434;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141a12;
    --card:#1f271c;
    --card-edge:#34412e;
    --ink:#eef2df;
    --muted:#a6af90;
    --accent:#e39a5f;
    --accent-ink:#2a1405;
    --heart:#ff6b86;
    --star:#f6c35b;
    --gridink:#0b0f09;
    --mini:#3a5130;
    --shadow:0 10px 28px rgba(0,0,0,.5);
    --scrim:rgba(4,8,3,.7);
    --grass:#34512d;
    --grass-edge:#2a4325;
    --tuft:#44683b;
    --guide:rgba(225,240,195,.13);
    --lush:#4f9339;
    --lush-hi:#66ad4c;
    --rail:#c78d57;
    --rail-dark:#4a2c13;
    --rail-hi:#f2c48f;
    --post:#9b6a3e;
    --post-dark:#3e250f;
    --post-top:#d3a676;
    --stone:#59604f;
    --stone-edge:#2c3127;
    --stone-ink:#f6f4e8;
    --cross:#cdd4b4;
    --wrong:#ff6150;
    --wrongbg:#4d2420;
    --glow:#ffd75e;
    --wool:#eeeae0;
    --wool-edge:#a39c8c;
    --face:#2b2424;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141a12;--card:#1f271c;--card-edge:#34412e;--ink:#eef2df;--muted:#a6af90;--accent:#e39a5f;--accent-ink:#2a1405;
  --heart:#ff6b86;--star:#f6c35b;--gridink:#0b0f09;--mini:#3a5130;--shadow:0 10px 28px rgba(0,0,0,.5);--scrim:rgba(4,8,3,.7);
  --grass:#34512d;--grass-edge:#2a4325;--tuft:#44683b;--guide:rgba(225,240,195,.13);--lush:#4f9339;--lush-hi:#66ad4c;
  --rail:#c78d57;--rail-dark:#4a2c13;--rail-hi:#f2c48f;--post:#9b6a3e;--post-dark:#3e250f;--post-top:#d3a676;
  --stone:#59604f;--stone-edge:#2c3127;--stone-ink:#f6f4e8;--cross:#cdd4b4;--wrong:#ff6150;--wrongbg:#4d2420;--glow:#ffd75e;
  --wool:#eeeae0;--wool-edge:#a39c8c;--face:#2b2424;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:default}
.title{text-align:center;line-height:1.05;min-width:0}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status row */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:34px;gap:10px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.pop{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star.off path{fill:none;stroke:var(--muted);opacity:.5}

/* control hints */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how > div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--mini);display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn[hidden]{display:none}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn .tag{font-size:12px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .art{width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%;overflow:visible}
.sheet .badge-row{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .badge-row svg{width:30px;height:30px}
.sheet .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px}
.sheet .logo svg{width:44px;height:44px}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mini);border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:74%;height:74%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;min-height:66px;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:10px}
.lv .mh svg{width:10px;height:10px}
.lv .mh .heart path,.lv .mh .star path{stroke:none}
.lv .mh .lost path,.lv .mh .off path{fill:var(--card-edge);opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.25;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  width:max-content;max-width:min(88vw,420px);text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .top{gap:6px;grid-template-columns:auto 1fr 42px}
  .top-left{gap:4px}
  .top-left .icon-btn{width:40px;height:40px;border-radius:13px}
  .top > .icon-btn{width:42px;height:42px;border-radius:14px}
  .title h1{font-size:23px}
  .foot{gap:8px}
}
@media (max-width:340px){
  .title h1{font-size:19px}
  .title p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}


/* ---------- the field: grass, posts, rails and numbered stones ---------- */
.stars{display:flex;gap:6px}
.stars svg{width:30px;height:30px;overflow:visible}
.stars .star.pop{animation:heartpop .5s ease}
.count{text-align:right;line-height:1.05}
.count .sub{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}

.field-wrap{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:200px;touch-action:none}
.field-card{position:relative;background:var(--card);border-radius:24px;padding:10px;box-shadow:0 0 0 2px var(--card-edge),var(--shadow);touch-action:none;display:grid;place-items:center;max-width:100%}
.field-card.zoomed #field{overflow:hidden}
.field-card .zoom-fit{top:-14px;right:-14px}
#field{display:block;touch-action:none;overflow:visible;outline:none;border-radius:14px}
#field:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.grass{fill:var(--grass);stroke:var(--grass-edge);stroke-width:.06}
.tufts{fill:var(--tuft);stroke:none}
.guide{fill:none;stroke:var(--guide);stroke-width:.022;transition:opacity .6s}

/* a numbered stone; it fades once its count is met, and blushes red when it can't be */
.stone-sh{fill:rgba(40,50,20,.16)}
.stone{fill:var(--stone);stroke:var(--stone-edge);stroke-width:.035;transition:fill .2s}
.num{font-family:'Fredoka',ui-rounded,system-ui,sans-serif;font-size:.42px;font-weight:600;fill:var(--stone-ink);text-anchor:middle;transition:fill .2s}
.clue .stone-in{transition:opacity .3s;transform-box:fill-box;transform-origin:center}
.clue.done .stone-in{opacity:.38}
.clue.over .stone{fill:var(--wrong);stroke:var(--wrong)}
.clue.over .num{fill:#fff}
.clue.over .stone-in{opacity:1;animation:wobble .4s ease}
@keyframes wobble{0%,100%{transform:none}30%{transform:rotate(-9deg)}65%{transform:rotate(6deg)}}
.clue.hint .stone-in{opacity:1;animation:stonepulse 1s ease-in-out 3}
@keyframes stonepulse{50%{transform:scale(1.22)}}

/* rails: a warm plank with a dark seam (so it reads as two rails) and a little grain */
.rail line{fill:none;stroke-linecap:round}
.rail .r0{stroke:var(--rail-dark);stroke-width:.2}
.rail .r1{stroke:var(--rail);stroke-width:.14}
.rail .r2{stroke:var(--rail-dark);stroke-width:.026;opacity:.5;stroke-linecap:butt}
.rail .r3{stroke:var(--rail-hi);stroke-width:.022;stroke-dasharray:.2 .07 .12 .09;opacity:.85;stroke-linecap:butt}
.rail.warn{--rail:var(--wrong);--rail-dark:#7a1d14;--rail-hi:#ffb3a6}
.rail-in{transform-box:fill-box;transform-origin:center}
.rail-in.pop{animation:railH .24s cubic-bezier(.2,1.5,.4,1) both}
.rail-in.v.pop{animation-name:railV}
@keyframes railH{from{transform:scale(.15,1.4)}}
@keyframes railV{from{transform:scale(1.4,.15)}}
.xm{fill:none;stroke:var(--cross);stroke-width:.04;stroke-linecap:round;opacity:.7;transition:opacity .4s}
.xm.pop{animation:xin .2s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes xin{from{transform:scale(.2);opacity:0}}

/* posts: small pegs until a rail meets them, red when three or more rails crowd one */
.post .pb{fill:var(--post);stroke:var(--post-dark);stroke-width:.03;transition:fill .2s}
.post .pt{fill:var(--post-top);opacity:.75}
.post.bad .pb{fill:var(--wrong);stroke:#7a1d14}
.ring{fill:none;stroke:var(--wrong);stroke-width:.05;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.cursor{fill:none;stroke:var(--accent);stroke-width:.06;stroke-dasharray:.12 .08}
.hl{fill:none;stroke:var(--glow);stroke-width:.4;stroke-linecap:round;animation:hlpulse 1s ease-in-out 3;opacity:.0}
@keyframes hlpulse{0%,100%{opacity:.15}50%{opacity:.95}}
.hl-post{fill:var(--glow);animation:hlpulse 1s ease-in-out 3;opacity:0}

/* finished: the paddock turns lush, flowers open and the flock hops in */
.lush{fill:var(--lush);transform-box:fill-box;transform-origin:center;animation:lushin .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes lushin{from{transform:scale(.3);opacity:0;fill:var(--lush-hi)}}
.flower{transform-box:fill-box;transform-origin:center;animation:flowerin .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes flowerin{from{transform:scale(0) rotate(-40deg)}}
.field-card.won .xm,.field-card.won .guide{opacity:0}
.field-card.won .clue .stone-in{opacity:.3}
.field-card.won .post:not(.on){opacity:0;transition:opacity .5s}
.sheep .head{transform-box:fill-box;transform-origin:30% 80%}
.sheep.graze .head{animation:graze 2.6s ease-in-out infinite}
@keyframes graze{0%,55%,100%{transform:none}65%,90%{transform:rotate(28deg) translate(0,.03px)}}

/* footer */
.btn .lbl-s{display:none}
@media (max-width:370px){.btn .lbl-l{display:none}.btn .lbl-s{display:inline}}

/* picker thumbnails and the win card: the finished paddock */
.lv .thumb{width:36px;height:30px;display:grid;place-items:center;margin-bottom:2px}
.lv .thumb svg{max-width:100%;max-height:100%}
.lv.done small{font-weight:600;color:var(--ink)}
.pd-grass{fill:var(--grass)}
.pd-lush{fill:var(--lush)}
.pd-fence{fill:none;stroke:var(--rail);stroke-linecap:round;stroke-linejoin:round}
.pd-edge{fill:none;stroke:var(--rail-dark);stroke-linecap:round;stroke-linejoin:round}
.sheet .paddock{width:176px;height:176px;margin:4px auto 16px;border-radius:26px;background:var(--grass);box-shadow:0 0 0 6px var(--rail),0 0 0 9px var(--card-edge),var(--shadow);display:grid;place-items:center;padding:10px}
.sheet .paddock svg{width:100%;height:100%;overflow:visible}
.rules .mini{color:var(--ink)}
.rules .wood{stroke:var(--rail);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.rules .wood-d{stroke:var(--rail-dark);stroke-width:4.8;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* zoom-out button, shown while zoomed in */
.zoom-fit{
  position:absolute;z-index:4;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;
  background:var(--card);border:2px solid var(--card-edge);box-shadow:var(--shadow);color:var(--ink);
  animation:zoomfit .2s ease;touch-action:manipulation;
}
.zoom-fit[hidden]{display:none}
.zoom-fit svg{width:21px;height:21px}
.zoom-fit:active{transform:scale(.92)}
@keyframes zoomfit{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="btnLevels" aria-label="Choose level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false"><span id="musicIcon"></span></button>
      <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false"><span id="sfxIcon"></span></button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">&nbsp;</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Stars and progress">
    <div class="stars" id="stars" aria-live="polite"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="field-wrap" id="fieldWrap">
    <div class="field-card" id="fieldCard">

<script>
const GAME = { id: 'fence-line', seed: 9533 };
/* =====================================================================

const $ = (s) => document.querySelector(s);
const scrim = $('#scrim');

/* ---------- saved progress (private to this browser) ---------- */
const STORE_KEY = GAME.id + '-v1';

}

}

/* ---------- icons ---------- */

  sfxOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c-.9 0-1.6.7-1.7 1.6-2.9.9-5 3.6-5 6.8v3l-1.6 2.1c-.3.4 0 1 .5 1h15.6c.5 0 .8-.6.5-1L18.7 15.6v-3c0-3.2-2.1-5.9-5-6.8-.1-.9-.8-1.6-1.7-1.6z" fill="currentColor" stroke="none"/><path d="M9.8 19.5a2.3 2.3 0 0 0 4.4 0"/></svg>',
  sfxOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c-.9 0-1.6.7-1.7 1.6-2.9.9-5 3.6-5 6.8v3l-1.6 2.1c-.3.4 0 1 .5 1h15.6c.5 0 .8-.6.5-1L18.7 15.6v-3c0-3.2-2.1-5.9-5-6.8-.1-.9-.8-1.6-1.7-1.6z" fill="currentColor" stroke="none" opacity=".45"/><path d="M9.8 19.5a2.3 2.3 0 0 0 4.4 0" opacity=".45"/><path d="M5.5 5.5l13 13" stroke-width="2.6"/></svg>'
};
function heartsHTML(left, max, cls) {
  let h = '';

  return h;
}
function starsHTML(n, max) {
  let h = '';

/* =====================================================================
   Audio. There are no sound files: every note is built from oscillators,
   filters and envelopes. Music and sound effects are separate toggles,
   both off by default and remembered between visits.
   ===================================================================== */
const MUSIC_KEY = GAME.id + '-music-v1', SFX_KEY = GAME.id + '-sfx-v1';
let musicOn = false, sfxOn = false;
try { musicOn = localStorage.getItem(MUSIC_KEY) === '1'; sfxOn = localStorage.getItem(SFX_KEY) === '1'; } catch (e) {}
let actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let schedTimer = null, ambientStop = null;

function ensureAudio() {

  if (!AC) return false;
  try { actx = new AC(); } catch (e) { return false; }

  return true;
}
const NOTE_FREQ = {};
function noteFreq(note) {
  if (!note) return 0;
  if (typeof note === 'number') return note;
  if (NOTE_FREQ[note]) return NOTE_FREQ[note];
  const m = /^([A-G])(#|b)?(\d)$/.exec(note);
  if (!m) return 0;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);

/* one synth voice: oscillator -> (optional lowpass) -> envelope -> bus */
function tone(t, f, o) {

  if (hold) g.gain.setValueAtTime(vol, t + a + hold);

    if (o.q) fl.Q.value = o.q;

/* a burst of filtered noise: shakers, splashes, rustles */
function noise(t, o) {

  fl.Q.value = o.q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);

/* instruments for the background music */
const INST = {
  pluck: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.008, dur: Math.min(d * 0.9, 0.35), vol: v || 0.16, bus: musicBus }),
  bell: (t, f, d, v) => {
    v = v || 0.11;
    tone(t, f, { type: 'sine', a: 0.004, dur: Math.min(d * 1.8, 1.2), vol: v, bus: musicBus });
    tone(t, f * 2.005, { type: 'sine', a: 0.003, dur: Math.min(d, 0.45), vol: v * 0.32, bus: musicBus });
    tone(t, f * 3.01, { type: 'sine', a: 0.002, dur: 0.12, vol: v * 0.12, bus: musicBus });
  },
  marimba: (t, f, d, v) => {
    v = v || 0.17;
    tone(t, f, { type: 'sine', a: 0.003, dur: Math.min(d * 0.85, 0.5), vol: v, bus: musicBus });
    tone(t, f * 3.98, { type: 'sine', a: 0.002, dur: 0.07, vol: v * 0.22, bus: musicBus });
  },
  flute: (t, f, d, v) => tone(t, f, { type: 'sine', a: 0.06, hold: d * 0.45, dur: d * 0.55 + 0.08, vol: v || 0.1, vib: 0.006, vibRate: 5, bus: musicBus }),
  reed: (t, f, d, v) => tone(t, f, { type: 'square', a: 0.02, hold: d * 0.35, dur: d * 0.5, vol: v || 0.045, lp: 1500, bus: musicBus }),
  harp: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.004, dur: Math.min(d * 2.5, 1.3), vol: v || 0.08, lp: 2400, bus: musicBus }),
  bass: (t, f, d, v) => tone(t, f, { type: 'sine', a: 0.02, dur: d, vol: v || 0.13, bus: musicBus }),
  wbass: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.01, dur: Math.min(d * 0.9, 0.55), vol: v || 0.15, lp: 650, bus: musicBus }),
  hat: (t, v) => noise(t, { f: 8000, q: 0.7, dur: 0.03, vol: v || 0.025, ftype: 'highpass', bus: musicBus }),
  shaker: (t, v) => noise(t, { f: 5500, q: 1.2, dur: 0.06, vol: v || 0.03, bus: musicBus }),
  knock: (t, v) => tone(t, 190, { type: 'sine', to: 120, a: 0.002, dur: 0.08, vol: v || 0.08, bus: musicBus })

/* "E5:.5 - G5:1" -> [{n:'E5', d:.5}, {n:null, d:1}, ...] ("-" or "r" is a rest, default length 1 beat) */
function track(str) {
  return str.trim().split(/\s+/).map((tok) => {
    const p = tok.split(':');
    return { n: p[0] === '-' || p[0] === 'r' ? null : p[0], d: p[1] ? parseFloat(p[1]) : 1 };
  });
}
function scheduler() {
  const M = GAME.music, beat = 60 / M.tempo, until = actx.currentTime + 0.2;
  for (const tr of M.tracks) {
    let guard = 0;
    while (tr.next < until && guard++ < 64) {
      const s = tr.seq[tr.i];
      const dur = s.d * beat;
      if (s.n) {
        if (tr.perc) tr.inst(tr.next, tr.vol, s.n);
        else tr.inst(tr.next, noteFreq(s.n), dur * (tr.len || 1), tr.vol);

function setMusic(on, fromUser) {
  musicOn = on;
  try { localStorage.setItem(MUSIC_KEY, on ? '1' : '0'); } catch (e) {}
  const btn = $('#btnMusic');
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Turn music off' : 'Turn music on');
  $('#musicIcon').innerHTML = on ? ICON.musicOn : ICON.musicOff;
  if (on && fromUser && ensureAudio() && actx.state === 'suspended') actx.resume();
  clearInterval(schedTimer); schedTimer = null;
  if (ambientStop) { try { ambientStop(); } catch (e) {} ambientStop = null; }
  if (on && actx) {
    const t0 = actx.currentTime + 0.06;
    for (const tr of GAME.music.tracks) { tr.next = t0; tr.i = 0; }
    if (GAME.music.ambient) ambientStop = GAME.music.ambient();
    schedTimer = setInterval(scheduler, 25);
  }
}
function setSfx(on) {
  sfxOn = on;
  try { localStorage.setItem(SFX_KEY, on ? '1' : '0'); } catch (e) {}
  const btn = $('#btnSfx');
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Turn sound effects off' : 'Turn sound effects on');

function sfx(name, a, b) {

  if (actx.state === 'suspended') actx.resume();

/* sound effects every game can use */
const SFX = {
  warn(t) {
    tone(t, 330, { type: 'square', a: 0.004, dur: 0.07, vol: 0.06, lp: 1800 });
    tone(t + 0.09, 247, { type: 'square', a: 0.004, dur: 0.12, vol: 0.06, lp: 1500 });
  },
  fail(t) {
    [['G4', 0.22], ['F#4', 0.22], ['F4', 0.22], ['E4', 0.6]].forEach(([n, d], i) => {
      const f = noteFreq(n);
      tone(t, f * 1.03, { type: 'sawtooth', to: f * 0.97, a: 0.02, dur: d, vol: i === 3 ? 0.17 : 0.14, lp: 1100 });
      t += d;
    });
  },
  win(t) {
    let x = t;
    ['C5', 'E5', 'G5', 'C6'].forEach((n) => { tone(x, noteFreq(n), { type: 'triangle', a: 0.01, dur: 0.16, vol: 0.22 }); x += 0.085; });
    const c = x + 0.02;
    ['C5', 'E5', 'G5', 'C6'].forEach((n) => tone(c, noteFreq(n), { type: 'sawtooth', a: 0.03, dur: 0.7, vol: 0.1, lp: 3000 }));

  },

  bonk(t) { tone(t, 180, { type: 'triangle', to: 110, a: 0.003, dur: 0.14, vol: 0.14 }); },

    tone(t, f, { type: 'sine', a: 0.004, dur: 0.5, vol: 0.13 });

/* browsers only allow audio after a tap, so the first tap resumes music left on last visit */

}
document.addEventListener('pointerdown', primeAudioOnce, true);
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend();
  else if (musicOn || sfxOn) actx.resume();
});

/* ---------- little helpers ---------- */
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let toastTimer = 0, toastEl = null;
function toast(msg, ms) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add('show');

/* a button that asks "Confirm?" before throwing away progress */
function armConfirm(btn, labelEl, label, isBusy, go) {
  let armed = 0;
  btn.addEventListener('click', () => {
    if (isBusy() && !armed) {
      labelEl.textContent = 'Confirm?';
      armed = setTimeout(() => { labelEl.textContent = label; armed = 0; }, 2200);
      return;
    }
    clearTimeout(armed); armed = 0; labelEl.textContent = label;
    go();
  });
  return () => { clearTimeout(armed); armed = 0; labelEl.textContent = label; };
}

/* ---------- modal plumbing ---------- */
let modalLocked = false;
function openModal(html, locked) {
  modalLocked = !!locked;
  scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  scrim.classList.add('open');
}
function closeModal() { modalLocked = false; scrim.classList.remove('open'); scrim.innerHTML = ''; }
function modalOpen() { return scrim.classList.contains('open'); }
scrim.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target === scrim && !modalLocked) closeModal(); return; }
  const act = a.dataset.act;
  if (act === 'close') closeModal();
  else if (act === 'levels') showLevels();
  else if (act === 'page') showLevels(+a.dataset.page);
  else if (act === 'pick') loadLevel(+a.dataset.level);
  else if (act === 'next') loadLevel(curLevel() + 1);
  else if (act === 'retry') loadLevel(curLevel());
  else if (GAME.actions && GAME.actions[act]) GAME.actions[act](a);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOpen() && !modalLocked) closeModal(); });

/* opened from the Puzzle Parlour launcher? then offer a way back to it */
let FROM_PARLOUR = false;
try {
  if (location.hash === '#parlour') sessionStorage.setItem('parlour', '1');
  FROM_PARLOUR = location.hash === '#parlour' || sessionStorage.getItem('parlour') === '1';
} catch (e) { FROM_PARLOUR = location.hash === '#parlour'; }

/* ---------- level picker: pages of 20, with each finished level's best result ---------- */
const PAGE = 20;
function curLevel() { return (typeof G !== 'undefined' && G) ? G.idx : (save.level || 0); }
function showLevels(page) {
  const cur = curLevel();
  const total = GAME.total || Infinity;
  if (typeof page !== 'number') page = Math.floor(cur / PAGE);
  const first = page * PAGE, last = Math.min(first + PAGE, total);
  let h = '<h2>Levels</h2><div class="pager">' +
    '<button class="icon-btn" data-act="page" data-page="' + (page - 1) + '"' + (page === 0 ? ' disabled' : '') + ' aria-label="Earlier levels">' + ICON.chevL + '</button>' +
    '<span>' + (first + 1) + '–' + last + '</span>' +
    '<button class="icon-btn" data-act="page" data-page="' + (page + 1) + '"' + (last >= total ? ' disabled' : '') + ' aria-label="Later levels">' + ICON.chevR + '</button>' +
    '</div><div class="levels">';
  for (let i = first; i < last; i++) {
    const done = hasOwn(save.done, i);
    const label = GAME.levelLabel(i);
    h += '<button class="lv' + (done ? ' done' : '') + (i === cur ? ' cur' : '') + '" data-act="pick" data-level="' + i +
      '" aria-label="Level ' + (i + 1) + ', ' + label + (done ? ', completed' : '') + '">' +
      (done ? '<span class="ok">' + ICON.tick + '</span>' : '') +
      (GAME.levelTile ? GAME.levelTile(i, done) : '<b>' + (i + 1) + '</b><small>' + label + '</small>') +
      '<span class="mh">' + (done ? GAME.levelBadge(save.done[i], i) : '') + '</span>' +
      '</button>';

    (FROM_PARLOUR ? '<a class="btn" href="../index.html#parlour">All Puzzle Parlour games</a>' : '') + '</div>';

}

/* =====================================================================
   Zoom and pan, for when the board gets big. Pinch with two fingers to
   zoom (moving them drags the board around), or use the mouse wheel, a
   trackpad pinch or the + − 0 keys. One finger still plays: a touch waits
   a moment, or until it moves or lifts, before the game sees it, so the
   first finger of a pinch never plays a move by accident. The game gives:
     el                     the area that takes touches
     layout()               lay the board out at zoom Z.z (setting Z.max on
                            the way) and return {cw, ch, vw, vh, left, top}:
                            the board's size at that zoom, the size of the
                            window onto it, and where that window is on screen
     pan()                  slide the board so (Z.x, Z.y) sits at the window's
                            top-left corner
     down/move/up/cancel(e) one-finger play
     canPan(e)              optional: when zoomed in, should a one-finger drag
                            from here slide the board instead of playing?
     focus()                optional: the screen point the keys zoom around
     fit, tip               the zoom-out button, and a first-time tip
   ===================================================================== */
const ZOOM_ICON = {
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20 20M7.6 10.5h5.8"/></svg>',
  in: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L20 20M7.6 10.5h5.8M10.5 7.6v5.8"/></svg>'
};
function makeZoom(o) {
  const Z = { z: 1, x: 0, y: 0, max: 1, g: null };
  const pts = new Map();          /* touches on the board: pointerId -> {x, y} */
  let mode = '';                  /* '' | 'wait' | 'play' | 'pan' | 'pinch' */
  let one = null, pinch = null, raf = 0, tween = 0, gs = 0;
  const WAIT = 220;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  /* only boards that gain at least a quarter from zooming can zoom */
  const zoomable = () => Z.max >= 1.25;
  const top = () => (zoomable() ? Z.max : 1);
  const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (o.fit) {
    o.fit.innerHTML = ZOOM_ICON.out;
    o.fit.addEventListener('click', () => reset(true));
  }

  function settle() {
    const g = Z.g;
    if (Z.z <= 1) { Z.x = 0; Z.y = 0; }
    Z.x = clamp(Z.x, 0, Math.max(0, g.cw - g.vw));
    Z.y = clamp(Z.y, 0, Math.max(0, g.ch - g.vh));

  }
  /* the board point under a screen point, as a fraction of the board's size */
  function at(cx, cy) { const g = Z.g; return [(cx - g.left + Z.x) / g.cw, (cy - g.top + Z.y) / g.ch]; }
  /* zoom to z with board point (u, v) under screen point (cx, cy) */
  function place(z, cx, cy, u, v) {
    z = clamp(z, 1, top());
    if (z !== Z.z || !Z.g) { Z.z = z; Z.g = o.layout(); }
    Z.x = u * Z.g.cw - (cx - Z.g.left);
    Z.y = v * Z.g.ch - (cy - Z.g.top);

  }
  function zoomAt(z, cx, cy) {
    cancelAnimationFrame(tween);
    Z.g = o.layout();

  /* after a resize or a new board: lay out again at the current zoom */
  function refresh() {
    Z.g = o.layout();

    settle();
  }
  /* back to the whole board, gliding there if asked */
  function reset(glide) {
    cancelAnimationFrame(tween);
    if (!glide || Z.z <= 1.01 || calm()) { Z.z = 1; refresh(); return; }
    Z.g = o.layout();
    const cx = Z.g.left + Z.g.vw / 2, cy = Z.g.top + Z.g.vh / 2, [u, v] = at(cx, cy), z0 = Z.z, t0 = performance.now();
    const step = (t) => {

    if (x - m < Z.x) Z.x = x - m; else if (x + w + m > Z.x + g.vw) Z.x = x + w + m - g.vw;
    if (y - m < Z.y) Z.y = y - m; else if (y + h + m > Z.y + g.vh) Z.y = y + h + m - g.vh;
    settle();
  }
  /* on a phone, mention pinching the first time a board is big enough to need it */

    if (top() < 1.6 || save.zoomTip || !o.tip || !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) return;
    setTimeout(() => {
      if (save.zoomTip || modalOpen()) return;
      save.zoomTip = true; persist();
      toast(o.tip, 4200);
    }, 900);
  }

  /* ---------- touches, mouse and pen ---------- */
  function commit() {
    if (mode !== 'wait') return;

    mode = 'play';
    o.down(one.e);
  }
  function startPinch(a, b) {
    cancelAnimationFrame(tween);
    const p = pts.get(a), q = pts.get(b);
    pinch = { ids: [a, b], d: Math.max(1, Math.hypot(p.x - q.x, p.y - q.y)), mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2 };

    Z.g = o.layout();
    for (const id of pinch.ids) { try { o.el.setPointerCapture(id); } catch (err) {} }
  }
  function pinchFrame() {
    raf = 0;
    if (mode !== 'pinch') return;
    const p = pts.get(pinch.ids[0]), q = pts.get(pinch.ids[1]);
    if (!p || !q) return;
    const d = Math.max(1, Math.hypot(p.x - q.x, p.y - q.y)), mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    /* keep the point that was between the fingers between them, at the new spread */
    const [u, v] = at(pinch.mx, pinch.my);
    place(Z.z * d / pinch.d, mx, my, u, v);
    pinch.d = d; pinch.mx = mx; pinch.my = my;
  }
  const startOne = (e) => ({ id: e.pointerId, e, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, pan: Z.z > 1.01 && (!o.canPan || !!o.canPan(e)) });
  const quit = (id, x, y) => o.cancel({ pointerId: id, clientX: x, clientY: y, type: 'pointercancel' });

  o.el.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('[data-zoom-skip]')) return;
    cancelAnimationFrame(tween);
    if (e.pointerType !== 'touch') {
      if (mode) return;
      if (e.button === 1) {
        if (Z.z > 1) { e.preventDefault(); one = startOne(e); mode = 'pan'; }
        return;
      }
      one = startOne(e); mode = 'play';
      o.down(e);
      return;
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === 'pinch') return;
    if (!mode) {
      one = startOne(e);
      if (zoomable()) { mode = 'wait'; one.t = setTimeout(commit, WAIT); }
      else { mode = 'play'; o.down(e); }
      return;
    }
    /* a second finger turns whatever the first was doing into a pinch (small boards don't zoom, so it's ignored there) */
    if (!one || !pts.has(one.id) || (mode === 'play' && !zoomable())) return;
    if (mode === 'wait') clearTimeout(one.t);

  });
  window.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }

      if (p && pinch.ids.includes(e.pointerId) && !raf) raf = requestAnimationFrame(pinchFrame);
      return;
    }
    if (!one || e.pointerId !== one.id) return;
    const far = Math.hypot(e.clientX - one.x, e.clientY - one.y) > (e.pointerType === 'touch' ? 10 : 5);

    } else if (mode === 'play' && far && one.pan) { quit(one.id, e.clientX, e.clientY); mode = 'pan'; }
    if (mode === 'play') o.move(e);

    one.lx = e.clientX; one.ly = e.clientY;
  });

      if (!pinch.ids.includes(e.pointerId)) return;
      /* lift one finger and the other carries on sliding the board */
      const rest = pinch.ids.find((id) => id !== e.pointerId && pts.has(id));
      pinch = null; cancelAnimationFrame(raf); raf = 0;
      if (rest !== undefined) { const q = pts.get(rest); one = { id: rest, x: q.x, y: q.y, lx: q.x, ly: q.y }; mode = 'pan'; }

  o.el.addEventListener('wheel', (e) => {
    if (!zoomable()) return;
    e.preventDefault();
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    zoomAt(Z.z * Math.exp(-clamp(dy, -150, 150) * (e.ctrlKey ? 0.01 : 0.002)), e.clientX, e.clientY);
  }, { passive: false });

  o.el.addEventListener('gesturestart', (e) => { e.preventDefault(); gs = pts.size ? 0 : (e.scale || 1); });
  o.el.addEventListener('gesturechange', (e) => {
    e.preventDefault();

    gs = e.scale;
  });
  o.el.addEventListener('gestureend', (e) => { e.preventDefault(); gs = 0; });

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || modalOpen() || !zoomable() || !Z.g) return;
    const k = e.key;
    if (k === '0') { e.preventDefault(); reset(true); return; }
    const f = k === '+' || k === '=' ? 1.3 : k === '-' || k === '_' ? 1 / 1.3 : 0;
    if (!f) return;

    zoomAt(Z.z * f, p ? p.x : null, p ? p.y : null);
  });

  return Object.assign(Z, { refresh, reset, zoomAt, panBy, show, tip });
}

/* ---------- the field: posts, sides and squares ---------- */
/* A field of W×H squares has (W+1)×(H+1) posts. Sides are numbered with the horizontal ones first,
   row by row ((H+1) rows of W), then the vertical ones (H rows of W+1).
   Side states: 0 open question, 1 fenced (a rail), 2 no fence (a cross). */
const FIELDS = {};
function makeField(W, H) {
  const key = W + 'x' + H;
  if (FIELDS[key]) return FIELDS[key];
  const NC = W * H, NP = (W + 1) * (H + 1), NH = (H + 1) * W, NE = NH + H * (W + 1);
  const hE = (r, c) => r * W + c, vE = (r, c) => NH + r * (W + 1) + c, P = (r, c) => r * (W + 1) + c;
  const ends = new Int32Array(NE * 2), eC = new Int32Array(NE * 2).fill(-1);
  for (let r = 0; r <= H; r++) for (let c = 0; c < W; c++) {
    const e = hE(r, c); ends[2 * e] = P(r, c); ends[2 * e + 1] = P(r, c + 1);
    if (r > 0) eC[2 * e] = (r - 1) * W + c;
    if (r < H) eC[2 * e + 1] = r * W + c;
  }
  for (let r = 0; r < H; r++) for (let c = 0; c <= W; c++) {
    const e = vE(r, c); ends[2 * e] = P(r, c); ends[2 * e + 1] = P(r + 1, c);
    if (c > 0) eC[2 * e] = r * W + c - 1;
    if (c < W) eC[2 * e + 1] = r * W + c;
  }
  /* each post's sides: up, right, down, left (-1 at the edge of the field) */
  const pE = new Int32Array(NP * 4).fill(-1);
  for (let r = 0; r <= H; r++) for (let c = 0; c <= W; c++) {
    const p = P(r, c);
    if (r > 0) pE[4 * p] = vE(r - 1, c);
    if (c < W) pE[4 * p + 1] = hE(r, c);
    if (r < H) pE[4 * p + 2] = vE(r, c);
    if (c > 0) pE[4 * p + 3] = hE(r, c - 1);
  }
  /* each square's sides: top, right, bottom, left */
  const cE = new Int32Array(NC * 4);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c;
    cE[4 * i] = hE(r, c); cE[4 * i + 1] = vE(r, c + 1); cE[4 * i + 2] = hE(r + 1, c); cE[4 * i + 3] = vE(r, c);
  }
  /* corner pairs: the two sides that meet at a post in one quadrant (0 up-left, 1 up-right,
     2 down-right, 3 down-left), which are also two sides of the square in that quadrant.
     Square corners (top-left, top-right, bottom-right, bottom-left) map to pairs in qOf. */
  const qa = new Int32Array(NP * 4), qb = new Int32Array(NP * 4), qCell = new Int32Array(NP * 4).fill(-1);
  for (let r = 0; r <= H; r++) for (let c = 0; c <= W; c++) {
    const p = P(r, c), U = pE[4 * p], R = pE[4 * p + 1], D = pE[4 * p + 2], L = pE[4 * p + 3];
    qa[4 * p] = U; qb[4 * p] = L; qa[4 * p + 1] = U; qb[4 * p + 1] = R;
    qa[4 * p + 2] = D; qb[4 * p + 2] = R; qa[4 * p + 3] = D; qb[4 * p + 3] = L;
    if (r > 0 && c > 0) qCell[4 * p] = (r - 1) * W + c - 1;
    if (r > 0 && c < W) qCell[4 * p + 1] = (r - 1) * W + c;
    if (r < H && c < W) qCell[4 * p + 2] = r * W + c;
    if (r < H && c > 0) qCell[4 * p + 3] = r * W + c - 1;
  }
  const qOf = new Int32Array(NC * 4);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c;
    qOf[4 * i] = 4 * P(r, c) + 2; qOf[4 * i + 1] = 4 * P(r, c + 1) + 3;
    qOf[4 * i + 2] = 4 * P(r + 1, c + 1); qOf[4 * i + 3] = 4 * P(r + 1, c) + 1;
  }
  return (FIELDS[key] = { W, H, NC, NP, NH, NE, ends, eC, pE, cE, qa, qb, qCell, qOf });
}

/* corner reasoning keeps, for every corner pair, which totals (0, 1 or 2 rails) are still possible,
   as a 3-bit mask. These tables say what one pair allows given its partner's mask. */
const POST_OK = new Uint8Array(8), CELL_OK = [0, 1, 2, 3].map(() => new Uint8Array(8));
for (let m = 0; m < 8; m++) {
  /* diagonal pairs at a post together hold all four of its sides: 0 or 2 rails in total */
  POST_OK[m] = ((m & 5) ? 1 : 0) | ((m & 2) ? 2 : 0) | ((m & 1) ? 4 : 0);
  /* opposite corners of a square together hold all four of its sides: k rails in total */
  for (let k = 0; k < 4; k++) for (let s = 0; s <= 2; s++) if (k - s >= 0 && k - s <= 2 && (m >> (k - s)) & 1) CELL_OK[k][m] |= 1 << s;
}
const BAD = { bad: true }, STOP = { stop: true };

/* Solve as far as logic goes, without ever guessing. clues: Int8Array (-1 = no number);
   st: Int8Array of side states, filled in place. level 0 uses the counting, post and loop rules;
   level 1 adds corner reasoning. Returns 'solved', 'stuck' or 'bad'.
   With first set, it stops at the first side it settles and returns {e, v, why, at, m}. */
function solveField(F, clues, st, level, first) {
  const { NE, NC, NP, ends, eC, pE, cE, qa, qb, qCell, qOf } = F;
  const mask = new Uint8Array(NP * 4);

  const qPostF = (p) => { if (!inP[p]) { inP[p] = 1; pq[pn++] = p; } };
  function set(e, v, why, at, m) {
    if (st[e] === v) return;
    if (st[e]) throw BAD;
    st[e] = v;
    if (first) { found = { e, v, why, at, m }; throw STOP; }
    qCellF(eC[2 * e]); qCellF(eC[2 * e + 1]); qPostF(ends[2 * e]); qPostF(ends[2 * e + 1]);
  }
  function narrow(q, m) {
    if (m === mask[q]) return;
    if (!m) throw BAD;
    mask[q] = m;
    qPostF(q >> 2); qCellF(qCell[q]);
  }
  for (let q = 0; q < NP * 4; q++) mask[q] = qa[q] < 0 && qb[q] < 0 ? 1 : qa[q] < 0 || qb[q] < 0 ? 3 : 7;
  for (let c = NC - 1; c >= 0; c--) qCellF(c);
  for (let p = NP - 1; p >= 0; p--) qPostF(p);

  function doCell(c) {
    const k = clues[c];
    let on = 0, un = 0;
    for (let j = 0; j < 4; j++) { const s = st[cE[4 * c + j]]; if (s === 1) on++; else if (!s) un++; }
    if (on > k || on + un < k) throw BAD;
    if (un && (on === k || on + un === k)) {
      const v = on === k ? 2 : 1;
      for (let j = 0; j < 4; j++) { const e = cE[4 * c + j]; if (!st[e]) set(e, v, v === 2 ? 'cellDone' : 'cellNeed', c); }
      return;
    }
    if (level < 1) return;
    for (let j = 0; j < 2; j++) {
      const a = qOf[4 * c + j], b = qOf[4 * c + j + 2];
      const ma = mask[a], mb = mask[b];
      narrow(a, ma & CELL_OK[k][mb]);
      narrow(b, mb & CELL_OK[k][mask[a]]);
    }
  }
  function doPost(p) {
    let on = 0, un = 0, last = -1;
    for (let j = 0; j < 4; j++) { const e = pE[4 * p + j]; if (e < 0) continue; if (st[e] === 1) on++; else if (!st[e]) { un++; last = e; } }
    if (on > 2 || (on === 1 && !un)) throw BAD;
    if (un) {
      if (on === 2) { for (let j = 0; j < 4; j++) { const e = pE[4 * p + j]; if (e >= 0 && !st[e]) set(e, 2, 'postFull', p); } return; }
      if (un === 1) { set(last, on ? 1 : 2, on ? 'postEnd' : 'postLone', p); return; }
    }
    if (level < 1) return;
    for (let j = 0; j < 4; j++) {
      const q = 4 * p + j, a = qa[q], b = qb[q];
      const sa = a < 0 ? 2 : st[a], sb = b < 0 ? 2 : st[b];
      const lo = (sa === 1) + (sb === 1), hi = lo + !sa + !sb;
      narrow(q, mask[q] & (((1 << (hi + 1)) - 1) & ~((1 << lo) - 1)));
    }
    for (let j = 0; j < 2; j++) {
      const a = 4 * p + j, b = 4 * p + j + 2;
      narrow(a, mask[a] & POST_OK[mask[b]]);
      narrow(b, mask[b] & POST_OK[mask[a]]);
    }
    for (let j = 0; j < 4; j++) {
      const q = 4 * p + j, a = qa[q], b = qb[q], m = mask[q];
      const sa = a < 0 ? 2 : st[a], sb = b < 0 ? 2 : st[b];

  for (let c = 0; c < L.w * L.h; c++) size += L.region[c];
  openModal(
    '<div class="paddock">' + paddockSVG(L, true, spots) + '</div>' +
    '<h2>' + WIN_TITLES[G.idx % WIN_TITLES.length] + '</h2>' +
    '<p>The flock has a new paddock: ' + size + ' squares of fresh grass.</p>' +
    '<div class="badge-row">' + starsHTML(stars) + '</div>' +
    (stars < 3 ? '<p style="font-size:15px;margin-top:-6px">Finish without a hint for three stars.</p>' : '') +
    '<div class="stack">' +
    '<button class="btn primary" data-act="next">Next level</button>' +
    '<button class="btn" data-act="levels">Your paddocks</button>' +
    '<button class="btn" data-act="close">Admire it</button>' +
    '</div>'
  );
}

/* ---------- how to play ---------- */
GAME.showHelp = () => {
  const wood = (d) => '<path class="wood-d" d="' + d + '"/><path class="wood" d="' + d + '"/>';
  openModal(
    '<div class="logo">' + SHEEP_FACE + '<h2>Fence Line</h2></div>' +
    '<p>Build one fence around the field for the flock.</p>' +
    '<ul class="rules">' +
    '<li><span class="mini"><svg viewBox="0 0 24 24"><path d="M19 5v14H5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2" opacity=".35"/>' + wood('M5 19V5h14') +
      '<text x="12.6" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="currentColor" font-family="Fredoka,system-ui">2</text></svg></span><span>Each number says how many of its square\'s four sides are fenced.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24">' + wood('M4 5h10v6h6v8H4z') + '</svg></span><span>Make one closed loop: no branches, no crossings, no loose ends.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24">' + wood('M4 7h16') + '<path d="M9.5 13.5l5 5M14.5 13.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".7"/></svg></span><span>Tap a side for a rail, again for an x (no fence), again to clear.</span></li>' +
    '<li><span class="mini"><svg viewBox="0 0 24 24">' + wood('M4 20v-8h8V4h7') + '<circle cx="19" cy="4" r="3" fill="var(--accent)"/></svg></span><span>Drag along the lines to lay fence; drag back to take it up.</span></li>' +
    '<li><span class="mini">' + ICON.hint + '</span><span>Stuck? A hint settles one side and says why. Fewer hints, more stars.</span></li>' +
    '<li><span class="mini">' + ZOOM_ICON.in + '</span><span>Big field? Pinch to zoom in, and drag with two fingers to look around.</span></li>' +
    '</ul>' +
    '<p style="font-size:15px;margin-top:-4px">Every field has one answer, reachable by logic alone. Close the loop and the flock moves in.</p>' +
    '<div class="stack"><button class="btn primary" data-act="close">Start fencing</button></div>'
  );
};

/* ---------- music: a lazy pastoral tune on a pipe over soft strings ---------- */
const PIPE = (t, f, d, v) => {
  v = v || 0.085;
  tone(t, f, { type: 'sine', a: 0.07, hold: d * 0.5, dur: d * 0.5 + 0.12, vol: v, vib: 0.007, vibRate: 4.8, bus: musicBus });
  tone(t, f * 2, { type: 'sine', a: 0.06, hold: d * 0.3, dur: d * 0.4, vol: v * 0.12, bus: musicBus });
  noise(t, { f: Math.min(9000, f * 3), q: 5, dur: 0.07, vol: v * 0.2, bus: musicBus });
};
const STRINGS = (t, f, d, v) => {
  v = v || 0.02;
  tone(t, f, { type: 'sawtooth', a: 0.5, hold: d * 0.45, dur: d * 0.55, vol: v, lp: 760, bus: musicBus });
  tone(t, f * 1.005, { type: 'sawtooth', a: 0.6, hold: d * 0.4, dur: d * 0.55, vol: v * 0.8, lp: 700, bus: musicBus });
};
GAME.music = {
  tempo: 80,
  tracks: [
    { inst: PIPE, vol: 0.085, seq: track('D5:1.5 E5:.5 D5 B4 G4:2 A4 B4 C5:1.5 B4:.5 A4 G4 A4:3 - B4:1.5 C5:.5 D5 G5 E5:2 D5 B4 C5:1.5 A4:.5 B4 A4 G4:3 - ' +
      'G5:1.5 F#5:.5 E5 D5 E5:2 D5 B4 C5:1.5 D5:.5 E5 C5 D5:3 - B4:1.5 C5:.5 D5 B4 C5:1.5 B4:.5 A4 G4 A4:1.5 B4:.5 A4 F#4 G4:3 -') },
    { inst: STRINGS, vol: 0.022, seq: track('G2:4 E2:4 C3:4 D3:4 G2:4 E2:4 A2:4 G2:4 G2:4 E2:4 C3:4 D3:4 G2:4 A2:4 D3:4 G2:4') },
    { inst: STRINGS, vol: 0.016, seq: track('B3:4 G3:4 E3:4 F#3:4 B3:4 G3:4 C4:4 B3:4 B3:4 G3:4 E3:4 F#3:4 B3:4 C4:4 F#3:4 B3:4') },
    { inst: INST.harp, vol: 0.045, seq: track('G3 D4 G4 D4 E3 B3 E4 B3 C3 G3 C4 G3 D3 A3 D4 A3 G3 D4 G4 D4 E3 B3 E4 B3 A2 E3 A3 E3 G3 D4 G4 D4 ' +
      'G3 D4 G4 D4 E3 B3 E4 B3 C3 G3 C4 G3 D3 A3 D4 A3 G3 D4 G4 D4 A2 E3 A3 E3 D3 A3 D4 A3 G3 D4 G4 D4') }
  ]
};
GAME.sfx = {
  /* a wooden knock as a rail goes up */
  rail(t, k) {
    const f = 1 + ((k || 0) % 5) * 0.045;
    tone(t, 215 * f, { type: 'sine', to: 140 * f, a: 0.002, dur: 0.08, vol: 0.17 });
    tone(t, 560 * f, { type: 'triangle', to: 410 * f, a: 0.001, dur: 0.03, vol: 0.05 });
    noise(t, { f: 1250, q: 2.2, dur: 0.035, vol: 0.06 });
  },
  lift(t) { tone(t, 300, { type: 'sine', to: 220, a: 0.002, dur: 0.05, vol: 0.06 }); noise(t, { f: 900, q: 2, dur: 0.025, vol: 0.03 }); },
  /* a soft pluck for an x */
  cross(t) { tone(t, 784, { type: 'triangle', a: 0.002, dur: 0.15, vol: 0.075, lp: 2600 }); tone(t, 1568, { type: 'sine', a: 0.002, dur: 0.05, vol: 0.02 }); },
  clear(t) { tone(t, 520, { type: 'sine', to: 440, a: 0.002, dur: 0.045, vol: 0.04 }); },
  hint(t) { tone(t, 1175, { type: 'sine', a: 0.004, dur: 0.25, vol: 0.06 }); tone(t + 0.09, 1568, { type: 'sine', a: 0.004, dur: 0.3, vol: 0.05 }); },
  baa(t, k) {
    const f = [392, 440, 349, 415, 370][(k || 0) % 5];
    tone(t, f * 1.04, { type: 'sawtooth', to: f * 0.94, glide: 0.45, a: 0.03, hold: 0.14, dur: 0.3, vol: 0.035, lp: 1500, vib: 0.05, vibRate: 10 });
    tone(t, f * 2.02, { type: 'sawtooth', to: f * 1.9, glide: 0.45, a: 0.03, hold: 0.1, dur: 0.25, vol: 0.012, lp: 2400, vib: 0.05, vibRate: 10 });
  },
  /* a little fanfare, then a bleating chord: wobbly saws that sag in pitch */
  win(t) {
    SFX.win(t);
    const c = t + 0.5;
    ['G4', 'B4', 'D5'].forEach((n, i) => {
      const f = noteFreq(n);
      tone(c + i * 0.025, f * 1.03, { type: 'sawtooth', to: f * 0.97, glide: 0.6, a: 0.04, hold: 0.25, dur: 0.45, vol: 0.055, lp: 1700, vib: 0.035, vibRate: 9 });
    });
  }
};

/* ---------- boot ---------- */
$('#undoIcon').innerHTML = ICON.undo;
$('#hintIcon').innerHTML = ICON.hint;
$('#restartIcon').innerHTML = ICON.restart;
const disarmRestart = armConfirm($('#btnRestart'), $('#restartLabel'), 'Restart',
  () => G && !G.won && G.st.some((v) => v),
  () => {
    if (G.won) { loadLevel(G.idx + 1); return; }
    delete save.cur; persist();
    startLevel(G.idx, G.L, G.hints);
  });
shellBoot();
loadLevel(save.level || 0);
if (!save.seenHelp) { GAME.showHelp(); save.seenHelp = true; persist(); }
</script>
</body>
