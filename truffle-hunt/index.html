<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Truffle Hunt</title>
<meta name="description" content="A cosy forest-floor logic puzzle: follow the truffle pig's sniff numbers to dig every safe square. No guessing, ever.">
<meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18130e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Truffle Hunt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4ecdc;
  --card:#fffaf1;
  --card-edge:#e8d6ba;
  --ink:#3a2a1e;
  --muted:#85705b;
  --accent:#b4582a;
  --accent-ink:#ffffff;
  --heart:#e5484d;
  --star:#f2b233;
  --gridink:#3a2a1e;
  --mini:#f8e4c8;
  --shadow:0 10px 28px rgba(80,50,20,.15);
  --scrim:rgba(36,24,12,.55);
  --earth:#6b4628;
  --earth-hi:#7f5634;
  --moss:#8fa452;
  --soil:#e8cda2;
  --soil-zero:#eed8b3;
  --litter:#a65c27;
  --litter-dk:#7c4019;
  --leafdim:1;
  --n1:#1d58a3;
  --n2:#2a6a1f;
  --n3:#b0213a;
  --n4:#6b2c9c;
  --n5:#8f3c0c;
  --n6:#0a6764;
  --n7:#3a2a1e;
  --n8:#545c68;
  --wrong:#d3182f;
  --wrongbg:#efb7a4;
  --reveal:#e8cda2;
  --hl:rgba(180,88,42,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#18130e;
    --card:#241c15;
    --card-edge:#3e3126;
    --ink:#f5ebdd;
    --muted:#b9a690;
    --accent:#f09a5c;
    --accent-ink:#2a1405;
    --heart:#ff6b86;
    --star:#f6c35b;
    --gridink:#0c0906;
    --mini:#3a2b1d;
    --shadow:0 10px 28px rgba(0,0,0,.5);
    --scrim:rgba(8,5,2,.72);
    --earth:#2a1c11;
    --earth-hi:#35251a;
    --moss:#56693a;
    --soil:#5a4130;
    --soil-zero:#634836;
    --litter:#874b20;
    --litter-dk:#5e3214;
    --leafdim:.8;
    --n1:#8fc6ff;
    --n2:#a3e28c;
    --n3:#ffa0b2;
    --n4:#d8b4ff;
    --n5:#ffc27e;
    --n6:#80e7db;
    --n7:#f6e8d3;
    --n8:#d0d8e3;
    --wrong:#ff5c6c;
    --wrongbg:#a8584a;
    --reveal:#9a7758;
    --hl:rgba(240,154,92,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#18130e;--card:#241c15;--card-edge:#3e3126;--ink:#f5ebdd;--muted:#b9a690;--accent:#f09a5c;--accent-ink:#2a1405;
  --heart:#ff6b86;--star:#f6c35b;--gridink:#0c0906;--mini:#3a2b1d;--shadow:0 10px 28px rgba(0,0,0,.5);--scrim:rgba(8,5,2,.72);
  --earth:#2a1c11;--earth-hi:#35251a;--moss:#56693a;--soil:#5a4130;--soil-zero:#634836;--litter:#874b20;--litter-dk:#5e3214;--leafdim:.8;
  --n1:#8fc6ff;--n2:#a3e28c;--n3:#ffa0b2;--n4:#d8b4ff;--n5:#ffc27e;--n6:#80e7db;--n7:#f6e8d3;--n8:#d0d8e3;
  --wrong:#ff5c6c;--wrongbg:#a8584a;--reveal:#9a7758;--hl:rgba(240,154,92,.2);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:default}
.title{text-align:center;line-height:1.05;min-width:0}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status row */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:34px;gap:10px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.pop{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star.off path{fill:none;stroke:var(--muted);opacity:.5}

/* control hints */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how > div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--mini);display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn[hidden]{display:none}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn .tag{font-size:12px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .art{width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%;overflow:visible}
.sheet .badge-row{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .badge-row svg{width:30px;height:30px}
.sheet .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px}
.sheet .logo svg{width:44px;height:44px}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mini);border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:74%;height:74%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;min-height:66px;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:10px}
.lv .mh svg{width:10px;height:10px}
.lv .mh .heart path,.lv .mh .star path{stroke:none}
.lv .mh .lost path,.lv .mh .off path{fill:var(--card-edge);opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.25;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  width:max-content;max-width:min(88vw,420px);text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .top{gap:6px;grid-template-columns:auto 1fr 42px}
  .top-left{gap:4px}
  .top-left .icon-btn{width:40px;height:40px;border-radius:13px}
  .top > .icon-btn{width:42px;height:42px;border-radius:14px}
  .title h1{font-size:23px}
  .foot{gap:8px}
}
@media (max-width:340px){
  .title h1{font-size:19px}
  .title p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- status row: hearts, the pig, and the truffle basket ---------- */
.count{display:flex;align-items:center;gap:6px}
.count small{margin:0 0 0 1px}
.count .basket{width:34px;height:31px;flex:none;transform-origin:50% 90%}
.count .basket svg{width:100%;height:100%;overflow:visible}
.count .basket.bump{animation:bump .28s ease}
@keyframes bump{40%{transform:scale(1.18,.86)}75%{transform:scale(.95,1.06)}}
.basket .peek{opacity:0;transition:opacity .2s}
.basket.some .peek{opacity:1}
.pig{width:58px;height:40px;flex:none;margin:0 auto}
.pig svg{width:100%;height:100%;overflow:visible}
.pig .body{transform-origin:50% 80%;transform-box:view-box;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.03) translateY(-.5px)}}
.pig .snout,.pig .ear,.pig .leg,.pig .tail{transform-box:fill-box}
.pig .ear{transform-origin:20% 90%;transition:transform .3s}
.pig .snout{transform-origin:0 50%}
.pig .leg{transform-origin:50% 0}
.pig .tail{transform-origin:100% 60%;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,80%,100%{transform:none}88%{transform:rotate(-25deg)}94%{transform:rotate(12deg)}}
.pig.sniff .snout{animation:snuffle .16s ease-in-out 6}
@keyframes snuffle{50%{transform:translate(1.2px,-.8px) scale(1.12)}}
.pig.sniff .body{animation:none;transform:rotate(4deg)}
.pig.sad .ear{transform:rotate(55deg)}
.pig.sad .body{animation:none;transform:translateY(1.5px) scaleY(.96)}
.pig.sad .eye{transform:scaleY(.45);transform-box:fill-box;transform-origin:center}
.pig.trot svg{animation:trot .3s ease-in-out 7}
@keyframes trot{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
.pig.trot .leg.a{animation:stepA .3s ease-in-out 7}
.pig.trot .leg.b{animation:stepB .3s ease-in-out 7}
@keyframes stepA{50%{transform:rotate(28deg)}}
@keyframes stepB{50%{transform:rotate(-28deg)}}
.pig.trot .ear{transform:rotate(-14deg)}

/* ---------- the forest floor ---------- */
.floor-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;touch-action:none}
.floor-frame{position:relative}
.floor-view{
  border-radius:18px;overflow:hidden;overflow:clip;touch-action:none;background:var(--earth);
  box-shadow:0 0 0 3px var(--moss),var(--shadow);
}
.floor{
  display:grid;grid-template-columns:repeat(var(--w),var(--cs));grid-auto-rows:var(--cs);gap:2px;padding:5px;width:max-content;
  background-color:var(--earth);
  background-image:radial-gradient(circle at 30% 40%,var(--earth-hi) 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 75%,var(--earth-hi) 0 1px,transparent 2px);
  background-size:13px 13px,19px 19px;
  touch-action:none;outline:none;position:relative;
}
.floor:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
.floor-frame .zoom-fit{top:-14px;right:-14px}

.cell{
  position:relative;border-radius:24%;overflow:hidden;
  display:grid;place-items:center;cursor:pointer;
  font-size:calc(var(--cs) * .6);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
  transition:transform .12s;
}
/* covered: layered autumn leaves */
.cell.h,.cell.f,.cell.wf{
  background:linear-gradient(160deg,var(--litter),var(--litter-dk));
  box-shadow:inset 0 -2px 0 rgba(40,15,0,.28),inset 0 1px 0 rgba(255,214,160,.28);
}
.cell.h::before,.cell.f::before,.cell.wf::before,.leafout{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--lv) center/100% 100% no-repeat;transform:rotate(var(--rot,0deg));filter:brightness(var(--leafdim));
}
@media (hover:hover){.cell.h:hover::before{filter:brightness(calc(var(--leafdim) * 1.12))}}
.cell.press{transform:scale(.9)}
/* leaves blowing off a square as it's dug */
.leafout{
  z-index:2;background:var(--lv) center/100% 100% no-repeat,linear-gradient(160deg,var(--litter),var(--litter-dk));
  animation:rustle .5s cubic-bezier(.45,0,.75,.6) both;
}
@keyframes rustle{
  0%{opacity:1;transform:rotate(var(--rot,0deg))}
  30%{opacity:1;transform:rotate(calc(var(--rot,0deg) + 9deg)) translate(4%,-8%) scale(1.04)}
  100%{opacity:0;transform:rotate(calc(var(--rot,0deg) - 28deg)) translate(-6%,-46%) scale(1.3)}
}
/* dug: warm soil, with the sniff number */
.cell.d,.cell.s,.cell.t,.cell.ho{background:var(--soil);box-shadow:inset 0 2px 3px rgba(60,28,6,.24);cursor:default}
.cell.d.z{background:var(--soil-zero)}
.cell.num{color:var(--nc);cursor:pointer}
.cell.num::before{
  content:"";position:absolute;inset:0;pointer-events:none;background:currentColor;opacity:.55;
  -webkit-mask:var(--wisp) center/100% 100% no-repeat;mask:var(--wisp) center/100% 100% no-repeat;
}
.cell.num.calm{color:color-mix(in srgb,var(--nc) 62%,var(--soil))}
.cell.num.calm::before{opacity:.3}
.cell.num.sniff::before{animation:sniffwisp .45s ease-in-out 2}
@keyframes sniffwisp{50%{opacity:1;transform:translate(6%,-10%) scale(1.12)}}
.cell.num.sniff{animation:sniffnum .45s ease-in-out 2}
@keyframes sniffnum{50%{transform:scale(1.12)}}
.n1{--nc:var(--n1)}.n2{--nc:var(--n2)}.n3{--nc:var(--n3)}.n4{--nc:var(--n4)}
.n5{--nc:var(--n5)}.n6{--nc:var(--n6)}.n7{--nc:var(--n7)}.n8{--nc:var(--n8)}
/* the pig's hoofprints mark where the hunt began */
.cell.st::before{content:"";position:absolute;inset:14%;background:var(--hoof) center/contain no-repeat;opacity:.5}
/* a wooden marker stick */
.cell.f::after,.cell.wf::after{content:"";position:absolute;inset:3%;background:var(--stake) center/contain no-repeat;pointer-events:none}
.cell.f.plant::after{animation:plant .34s cubic-bezier(.2,1.5,.5,1)}
@keyframes plant{from{transform:translateY(-45%) scale(.85);opacity:0}to{transform:none;opacity:1}}
.cell.wf::after{background:var(--cross) center/72% 72% no-repeat,var(--stake) center/contain no-repeat;opacity:.9}
/* a squashed truffle (sad), a truffle shown at the end, and an empty hole once it's in the basket */
.cell.s{background:var(--wrongbg)}
.cell.t{background:var(--reveal)}
.cell.s::after,.cell.t::after{content:"";position:absolute;inset:6%;background:var(--squash) center/contain no-repeat}
.cell.s.splat::after{animation:splat .45s cubic-bezier(.3,1.4,.5,1) .12s both}
@keyframes splat{0%{transform:translateY(-35%) scale(.8,1.25);opacity:0}45%{transform:scale(1.25,.7);opacity:1}100%{transform:none}}
.cell.t::after{inset:8%;background-image:var(--truffle);animation:popin .35s ease var(--d,0s) both}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.cell.ho::after{
  content:"";position:absolute;left:24%;right:24%;top:30%;bottom:22%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,rgba(45,20,4,.5),rgba(45,20,4,.22) 62%,transparent 72%);
}
.cell.cur{outline:3px solid var(--accent);outline-offset:-3px;z-index:3}
.cell.hint{z-index:3;outline:3px solid #ffe07a;outline-offset:-3px;animation:hintglow 1s ease-in-out 3}
@keyframes hintglow{0%,100%{outline:3px solid #ffe07a;outline-offset:-3px}50%{outline:4px solid #ffe07a;outline-offset:-1px;transform:scale(1.07);filter:brightness(1.25) drop-shadow(0 0 6px #ffd24a)}}
.cell.src{outline:3px dashed var(--accent);outline-offset:-3px;z-index:2}
.cell.nudge{animation:nudge .32s ease}
@keyframes nudge{35%{transform:scale(.86) rotate(-4deg)}70%{transform:scale(1.04) rotate(2deg)}}
.floor.win .cell.d{animation:winhop .5s ease both;animation-delay:var(--wd,0s)}
@keyframes winhop{40%{transform:translateY(-14%) scale(1.06)}}

/* truffles tumbling into the basket */
.flyer{position:fixed;left:0;top:0;z-index:15;pointer-events:none;background:var(--truffle) center/contain no-repeat}

/* footer */
.seg{flex:1.6;display:flex;background:var(--card);border:2px solid var(--card-edge);border-radius:16px;padding:3px;gap:3px;min-height:48px}
.seg button{
  flex:1;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:600;color:var(--muted);padding:0 6px;
}
.seg button svg{width:20px;height:20px;flex:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn.sq{flex:0 0 52px;padding:0}
#restartIcon svg{width:18px;height:18px}
@media (max-width:370px){
  #restartIcon,.seg button span{display:none}
  .seg button{padding:0 4px}
  .btn.sq{flex-basis:48px}
  .pig{width:48px;height:34px}
  .count small{display:none}
}
.lv .thumb{width:36px;height:30px;display:grid;place-items:center;margin-bottom:2px}
.lv .thumb svg{max-width:100%;max-height:100%}
.lv.done small{font-weight:600;color:var(--ink)}
.sheet .haul{width:190px;height:122px;margin:0 auto 8px}
.sheet .haul svg{width:100%;height:100%;overflow:visible}
.sheet .haul .hop{animation:haulhop .5s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
@keyframes haulhop{50%{transform:translateY(-6px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* zoom-out button, shown while zoomed in */
.zoom-fit{
  position:absolute;z-index:4;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;
  background:var(--card);border:2px solid var(--card-edge);box-shadow:var(--shadow);color:var(--ink);
  animation:zoomfit .2s ease;touch-action:manipulation;
}
.zoom-fit[hidden]{display:none}
.zoom-fit svg{width:21px;height:21px}
.zoom-fit:active{transform:scale(.92)}
@keyframes zoomfit{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="btnLevels" aria-label="Choose level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false"><span id="musicIcon"></span></button>
      <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false"><span id="sfxIcon"></span></button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">&nbsp;</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Hearts and truffles">
    <div class="lives" id="lives" aria-live="polite"></div>
    <div class="pig" id="pig" aria-hidden="true"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="floor-wrap" id="floorWrap">
    <div class="floor-frame">
      <div class="floor-view" id="floorView">
        <div class="floor" id="floor" tabindex="0" role="grid" aria-label="Forest floor. Arrow keys move, Enter or Space digs, F flags. Plus and minus zoom."></div>
      </div>
      <button class="zoom-fit" id="zoomFit" data-zoom-skip hidden aria-label="Zoom out to see the whole forest floor"></button>
    </div>
  </div>
  <div class="sr" id="cellSay" aria-live="polite"></div>

  <footer class="foot" id="foot">
    <button class="btn" id="btnRestart">
      <span id="restartIcon"></span>
      <span id="restartLabel">Restart</span>
    </button>
    <div class="seg" role="group" aria-label="What a tap does">
      <button id="modeDig" aria-pressed="true"><span id="icoDig"></span>Dig</button>
      <button id="modeFlag" aria-pressed="false"><span id="icoFlag"></span>Flag</button>
    </div>
    <button class="btn sq" id="btnHint" aria-label="Show a square you can work out"></button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<script>
const GAME = { id: 'truffle-hunt', seed: 8461 };
/* =====================================================================
   Shared shell: saves, seeded randomness, icons, live-synthesised audio,
   modals, toasts and the level picker. The game code below plugs into it
   through the GAME object and a loadLevel(idx) function.
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const scrim = $('#scrim');
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* ---------- saved progress (private to this browser) ---------- */
const STORE_KEY = GAME.id + '-v1';
let save = Object.assign({ done: {}, seenHelp: false, level: 0 }, GAME.saveDefaults || {});
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
if (!save.done || typeof save.done !== 'object') save.done = {};
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- seeded randomness, so level N is the same puzzle on every device ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function seedFor(idx, salt) {
  let h = (0x9e3779b9 ^ (GAME.seed || 0)) >>> 0;
  h = Math.imul(h ^ (idx + 1), 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h ^ ((salt || 0) + 0x27d4eb2f), 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
const pickOne = (arr, rnd) => arr[Math.floor(rnd() * arr.length)];

/* ---------- icons ---------- */
const ICON = {
  tick: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.4l2.4 2.4 4.6-5"/></svg>',
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6C12 20.6 3.2 15.4 3.2 9.2C3.2 6.4 5.3 4.4 7.9 4.4C9.7 4.4 11.2 5.4 12 6.8C12.8 5.4 14.3 4.4 16.1 4.4C18.7 4.4 20.8 6.4 20.8 9.2C20.8 15.4 12 20.6 12 20.6Z"/></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.2 6-.8z"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  hint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21.2h4"/><path d="M12 2.8a6.4 6.4 0 0 0-3.9 11.5c.6.5.9 1.2.9 2V16.6h6v-.3c0-.8.3-1.5.9-2A6.4 6.4 0 0 0 12 2.8z"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  musicOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3.2L12 17.5v-11L7.2 10H4z" fill="currentColor" stroke="none"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.8a7.5 7.5 0 0 1 0 10.4"/></svg>',
  musicOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3.2L12 17.5v-11L7.2 10H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke-width="2.4"/></svg>',
  sfxOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c-.9 0-1.6.7-1.7 1.6-2.9.9-5 3.6-5 6.8v3l-1.6 2.1c-.3.4 0 1 .5 1h15.6c.5 0 .8-.6.5-1L18.7 15.6v-3c0-3.2-2.1-5.9-5-6.8-.1-.9-.8-1.6-1.7-1.6z" fill="currentColor" stroke="none"/><path d="M9.8 19.5a2.3 2.3 0 0 0 4.4 0"/></svg>',
  sfxOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2c-.9 0-1.6.7-1.7 1.6-2.9.9-5 3.6-5 6.8v3l-1.6 2.1c-.3.4 0 1 .5 1h15.6c.5 0 .8-.6.5-1L18.7 15.6v-3c0-3.2-2.1-5.9-5-6.8-.1-.9-.8-1.6-1.7-1.6z" fill="currentColor" stroke="none" opacity=".45"/><path d="M9.8 19.5a2.3 2.3 0 0 0 4.4 0" opacity=".45"/><path d="M5.5 5.5l13 13" stroke-width="2.6"/></svg>'
};
function heartsHTML(left, max, cls) {
  let h = '';
  for (let k = 0; k < max; k++) h += '<span class="heart' + (k >= left ? ' lost' : '') + (cls && k === left ? ' ' + cls : '') + '">' + ICON.heart + '</span>';
  return h;
}
function starsHTML(n, max) {
  let h = '';
  for (let k = 0; k < (max || 3); k++) h += '<span class="star' + (k >= n ? ' off' : '') + '">' + ICON.star + '</span>';
  return h;
}

/* =====================================================================
   Audio. There are no sound files: every note is built from oscillators,
   filters and envelopes. Music and sound effects are separate toggles,
   both off by default and remembered between visits.
   ===================================================================== */
const MUSIC_KEY = GAME.id + '-music-v1', SFX_KEY = GAME.id + '-sfx-v1';
let musicOn = false, sfxOn = false;
try { musicOn = localStorage.getItem(MUSIC_KEY) === '1'; sfxOn = localStorage.getItem(SFX_KEY) === '1'; } catch (e) {}
let actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let schedTimer = null, ambientStop = null;

function ensureAudio() {
  if (actx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  try { actx = new AC(); } catch (e) { return false; }
  master = actx.createGain(); master.gain.value = 0.42; master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = 0.85; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  return true;
}
const NOTE_FREQ = {};
function noteFreq(note) {
  if (!note) return 0;
  if (typeof note === 'number') return note;
  if (NOTE_FREQ[note]) return NOTE_FREQ[note];
  const m = /^([A-G])(#|b)?(\d)$/.exec(note);
  if (!m) return 0;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return (NOTE_FREQ[note] = 440 * Math.pow(2, (base + (parseInt(m[3], 10) - 4) * 12 - 9) / 12));
}
/* one synth voice: oscillator -> (optional lowpass) -> envelope -> bus */
function tone(t, f, o) {
  o = o || {};
  if (!f) return;
  const osc = actx.createOscillator(), g = actx.createGain();
  const a = o.a || 0.006, hold = o.hold || 0, dur = o.dur || 0.25, vol = o.vol == null ? 0.15 : o.vol;
  const end = t + a + hold + dur;
  osc.type = o.type || 'triangle';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || a + hold + dur));
  if (o.vib) {
    const l = actx.createOscillator(), lg = actx.createGain();
    l.frequency.value = o.vibRate || 5.5; lg.gain.value = f * o.vib;
    l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(end + 0.05);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  if (hold) g.gain.setValueAtTime(vol, t + a + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  let node = osc;
  if (o.lp) {
    const fl = actx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp;
    if (o.q) fl.Q.value = o.q;
    osc.connect(fl); node = fl;
  }
  node.connect(g); g.connect(o.bus || sfxBus);
  osc.start(t); osc.stop(end + 0.05);
}
/* a burst of filtered noise: shakers, splashes, rustles */
function noise(t, o) {
  o = o || {};
  if (!noiseBuf) {
    const len = actx.sampleRate;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = o.ftype || 'bandpass';
  const dur = o.dur || 0.08, vol = o.vol || 0.1, a = o.a || 0.003;
  fl.frequency.setValueAtTime(o.f || 2000, t);
  if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + a + dur);
  fl.Q.value = o.q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
  src.connect(fl); fl.connect(g); g.connect(o.bus || sfxBus);
  src.start(t, Math.random() * 0.5); src.stop(t + a + dur + 0.05);
}

/* instruments for the background music */
const INST = {
  pluck: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.008, dur: Math.min(d * 0.9, 0.35), vol: v || 0.16, bus: musicBus }),
  bell: (t, f, d, v) => {
    v = v || 0.11;
    tone(t, f, { type: 'sine', a: 0.004, dur: Math.min(d * 1.8, 1.2), vol: v, bus: musicBus });
    tone(t, f * 2.005, { type: 'sine', a: 0.003, dur: Math.min(d, 0.45), vol: v * 0.32, bus: musicBus });
    tone(t, f * 3.01, { type: 'sine', a: 0.002, dur: 0.12, vol: v * 0.12, bus: musicBus });
  },
  marimba: (t, f, d, v) => {
    v = v || 0.17;
    tone(t, f, { type: 'sine', a: 0.003, dur: Math.min(d * 0.85, 0.5), vol: v, bus: musicBus });
    tone(t, f * 3.98, { type: 'sine', a: 0.002, dur: 0.07, vol: v * 0.22, bus: musicBus });
  },
  flute: (t, f, d, v) => tone(t, f, { type: 'sine', a: 0.06, hold: d * 0.45, dur: d * 0.55 + 0.08, vol: v || 0.1, vib: 0.006, vibRate: 5, bus: musicBus }),
  reed: (t, f, d, v) => tone(t, f, { type: 'square', a: 0.02, hold: d * 0.35, dur: d * 0.5, vol: v || 0.045, lp: 1500, bus: musicBus }),
  harp: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.004, dur: Math.min(d * 2.5, 1.3), vol: v || 0.08, lp: 2400, bus: musicBus }),
  bass: (t, f, d, v) => tone(t, f, { type: 'sine', a: 0.02, dur: d, vol: v || 0.13, bus: musicBus }),
  wbass: (t, f, d, v) => tone(t, f, { type: 'triangle', a: 0.01, dur: Math.min(d * 0.9, 0.55), vol: v || 0.15, lp: 650, bus: musicBus }),
  hat: (t, v) => noise(t, { f: 8000, q: 0.7, dur: 0.03, vol: v || 0.025, ftype: 'highpass', bus: musicBus }),
  shaker: (t, v) => noise(t, { f: 5500, q: 1.2, dur: 0.06, vol: v || 0.03, bus: musicBus }),
  knock: (t, v) => tone(t, 190, { type: 'sine', to: 120, a: 0.002, dur: 0.08, vol: v || 0.08, bus: musicBus })
};
/* "E5:.5 - G5:1" -> [{n:'E5', d:.5}, {n:null, d:1}, ...] ("-" or "r" is a rest, default length 1 beat) */
function track(str) {
  return str.trim().split(/\s+/).map((tok) => {
    const p = tok.split(':');
    return { n: p[0] === '-' || p[0] === 'r' ? null : p[0], d: p[1] ? parseFloat(p[1]) : 1 };
  });
}
function scheduler() {
  const M = GAME.music, beat = 60 / M.tempo, until = actx.currentTime + 0.2;
  for (const tr of M.tracks) {
    let guard = 0;
    while (tr.next < until && guard++ < 64) {
      const s = tr.seq[tr.i];
      const dur = s.d * beat;
      if (s.n) {
        if (tr.perc) tr.inst(tr.next, tr.vol, s.n);
        else tr.inst(tr.next, noteFreq(s.n), dur * (tr.len || 1), tr.vol);
      }
      tr.next += dur;
      tr.i = (tr.i + 1) % tr.seq.length;
    }
  }
}
function setMusic(on, fromUser) {
  musicOn = on;
  try { localStorage.setItem(MUSIC_KEY, on ? '1' : '0'); } catch (e) {}
  const btn = $('#btnMusic');
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Turn music off' : 'Turn music on');
  $('#musicIcon').innerHTML = on ? ICON.musicOn : ICON.musicOff;
  if (on && fromUser && ensureAudio() && actx.state === 'suspended') actx.resume();
  clearInterval(schedTimer); schedTimer = null;
  if (ambientStop) { try { ambientStop(); } catch (e) {} ambientStop = null; }
  if (on && actx) {
    const t0 = actx.currentTime + 0.06;
    for (const tr of GAME.music.tracks) { tr.next = t0; tr.i = 0; }
    if (GAME.music.ambient) ambientStop = GAME.music.ambient();
    schedTimer = setInterval(scheduler, 25);
  }
}
function setSfx(on) {
  sfxOn = on;
  try { localStorage.setItem(SFX_KEY, on ? '1' : '0'); } catch (e) {}
  const btn = $('#btnSfx');
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Turn sound effects off' : 'Turn sound effects on');
  $('#sfxIcon').innerHTML = on ? ICON.sfxOn : ICON.sfxOff;
  if (on && ensureAudio() && actx.state === 'suspended') actx.resume();
}
/* play a named sound effect from GAME.sfx (or the shared ones below) if effects are on */
function sfx(name, a, b) {
  if (!sfxOn || !ensureAudio()) return;
  if (actx.state === 'suspended') actx.resume();
  const fn = (GAME.sfx && GAME.sfx[name]) || SFX[name];
  if (fn) fn(actx.currentTime + 0.012, a, b);
}
/* sound effects every game can use */
const SFX = {
  warn(t) {
    tone(t, 330, { type: 'square', a: 0.004, dur: 0.07, vol: 0.06, lp: 1800 });
    tone(t + 0.09, 247, { type: 'square', a: 0.004, dur: 0.12, vol: 0.06, lp: 1500 });
  },
  fail(t) {
    [['G4', 0.22], ['F#4', 0.22], ['F4', 0.22], ['E4', 0.6]].forEach(([n, d], i) => {
      const f = noteFreq(n);
      tone(t, f * 1.03, { type: 'sawtooth', to: f * 0.97, a: 0.02, dur: d, vol: i === 3 ? 0.17 : 0.14, lp: 1100 });
      t += d;
    });
  },
  win(t) {
    let x = t;
    ['C5', 'E5', 'G5', 'C6'].forEach((n) => { tone(x, noteFreq(n), { type: 'triangle', a: 0.01, dur: 0.16, vol: 0.22 }); x += 0.085; });
    const c = x + 0.02;
    ['C5', 'E5', 'G5', 'C6'].forEach((n) => tone(c, noteFreq(n), { type: 'sawtooth', a: 0.03, dur: 0.7, vol: 0.1, lp: 3000 }));
    tone(c, noteFreq('C7'), { type: 'sine', to: noteFreq('E7'), glide: 0.5, a: 0.05, dur: 0.55, vol: 0.07 });
  },
  tap(t) { tone(t, 880, { type: 'sine', to: 660, a: 0.002, dur: 0.05, vol: 0.06 }); },
  bonk(t) { tone(t, 180, { type: 'triangle', to: 110, a: 0.003, dur: 0.14, vol: 0.14 }); },
  chime(t, step) {
    const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
    const f = noteFreq('C5') * Math.pow(2, scale[Math.min(scale.length - 1, Math.max(0, step || 0))] / 12);
    tone(t, f, { type: 'sine', a: 0.004, dur: 0.5, vol: 0.13 });
    tone(t, f * 2.005, { type: 'sine', a: 0.003, dur: 0.2, vol: 0.04 });
  }
};
/* browsers only allow audio after a tap, so the first tap resumes music left on last visit */
function primeAudioOnce() {
  document.removeEventListener('pointerdown', primeAudioOnce, true);
  if (musicOn) setMusic(true, true);
  else if (sfxOn && ensureAudio() && actx.state === 'suspended') actx.resume();
}
document.addEventListener('pointerdown', primeAudioOnce, true);
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend();
  else if (musicOn || sfxOn) actx.resume();
});

/* ---------- little helpers ---------- */
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let toastTimer = 0, toastEl = null;
function toast(msg, ms) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
}
/* a button that asks "Confirm?" before throwing away progress */
function armConfirm(btn, labelEl, label, isBusy, go) {
  let armed = 0;
  btn.addEventListener('click', () => {
    if (isBusy() && !armed) {
      labelEl.textContent = 'Confirm?';
      armed = setTimeout(() => { labelEl.textContent = label; armed = 0; }, 2200);
      return;
    }
    clearTimeout(armed); armed = 0; labelEl.textContent = label;
    go();
  });
  return () => { clearTimeout(armed); armed = 0; labelEl.textContent = label; };
}

/* ---------- modal plumbing ---------- */
let modalLocked = false;
function openModal(html, locked) {
  modalLocked = !!locked;
  scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  scrim.classList.add('open');
}
function closeModal() { modalLocked = false; scrim.classList.remove('open'); scrim.innerHTML = ''; }
function modalOpen() { return scrim.classList.contains('open'); }
scrim.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target === scrim && !modalLocked) closeModal(); return; }
  const act = a.dataset.act;
  if (act === 'close') closeModal();
  else if (act === 'levels') showLevels();
  else if (act === 'page') showLevels(+a.dataset.page);
  else if (act === 'pick') loadLevel(+a.dataset.level);
  else if (act === 'next') loadLevel(curLevel() + 1);
  else if (act === 'retry') loadLevel(curLevel());
  else if (GAME.actions && GAME.actions[act]) GAME.actions[act](a);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOpen() && !modalLocked) closeModal(); });

/* opened from the Puzzle Parlour launcher? then offer a way back to it */
let FROM_PARLOUR = false;
try {
  if (location.hash === '#parlour') sessionStorage.setItem('parlour', '1');
  FROM_PARLOUR = location.hash === '#parlour' || sessionStorage.getItem('parlour') === '1';
} catch (e) { FROM_PARLOUR = location.hash === '#parlour'; }

/* ---------- level picker: pages of 20, with each finished level's best result ---------- */
const PAGE = 20;
function curLevel() { return (typeof G !== 'undefined' && G) ? G.idx : (save.level || 0); }
function showLevels(page) {
  const cur = curLevel();
  const total = GAME.total || Infinity;
  if (typeof page !== 'number') page = Math.floor(cur / PAGE);
  const first = page * PAGE, last = Math.min(first + PAGE, total);
  let h = '<h2>Levels</h2><div class="pager">' +
    '<button class="icon-btn" data-act="page" data-page="' + (page - 1) + '"' + (page === 0 ? ' disabled' : '') + ' aria-label="Earlier levels">' + ICON.chevL + '</button>' +
    '<span>' + (first + 1) + '–' + last + '</span>' +
    '<button class="icon-btn" data-act="page" data-page="' + (page + 1) + '"' + (last >= total ? ' disabled' : '') + ' aria-label="Later levels">' + ICON.chevR + '</button>' +
    '</div><div class="levels">';
  for (let i = first; i < last; i++) {
    const done = hasOwn(save.done, i);
    const label = GAME.levelLabel(i);
    h += '<button class="lv' + (done ? ' done' : '') + (i === cur ? ' cur' : '') + '" data-act="pick" data-level="' + i +
      '" aria-label="Level ' + (i + 1) + ', ' + label + (done ? ', completed' : '') + '">' +
      (done ? '<span class="ok">' + ICON.tick + '</span>' : '') +
      (GAME.levelTile ? GAME.levelTile(i, done) : '<b>' + (i + 1) + '</b><small>' + label + '</small>') +
      '<span class="mh">' + (done ? GAME.levelBadge(save.done[i], i) : '') + '</span>' +
      '</button>';
  }
  h += '</div><div class="stack"><button class="btn" data-act="close">Close</button>' +
    (FROM_PARLOUR ? '<a class="btn" href="../index.html#parlour">All Puzzle Parlour games</a>' : '') + '</div>';
  openModal(h);
}

/* installed on a home screen, keep working offline (only on a real web host, never inside a frame) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.self === window.top) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- header buttons ---------- */
function shellBoot() {
  $('#btnLevels').addEventListener('click', () => showLevels());
  $('#btnMusic').addEventListener('click', () => setMusic(!musicOn, true));
  $('#btnSfx').addEventListener('click', () => setSfx(!sfxOn));
  $('#btnHelp').addEventListener('click', () => { GAME.showHelp(); save.seenHelp = true; persist(); });
  setMusic(musicOn, false);
  setSfx(sfxOn);
}

/* =====================================================================

/* ---------- levels: a gentle opening run, then endless woods ---------- */
const MAX_LIVES = 3;
/* [columns, rows, truffles, hardest kind of reasoning needed: 1 one number, 2 two numbers, 3 several] */

GAME.total = Infinity;
GAME.levelLabel = (i) => { const s = levelSpec(i); return s[0] + '×' + s[1]; };
GAME.levelTile = (i, done) => done
  ? '<span class="thumb">' + mapSVG(getLevel(i)) + '</span><small>' + (i + 1) + '</small>'

/* ---------- game state ---------- */
/* square states: 0 covered, 1 flagged, 2 dug, 3 squashed truffle;

function loadLevel(idx) {

function startLevel(idx, L) {

/* ---------- layout: squares fit the screen at full view; pinch to zoom in from there ---------- */

  const padB = parseFloat(getComputedStyle($('.app')).paddingBottom) || 20;
  const availH = Math.max(200, window.innerHeight - top - $('#foot').offsetHeight - 12 - padB - 10);
  const availW = Math.min(wrap.clientWidth, 460) - 6;
  const cs0 = Math.floor(Math.max(14, Math.min(60, (availW - 2 * PAD - (G.w - 1) * GAP) / G.w, (availH - 2 * PAD - (G.h - 1) * GAP) / G.h)));

/* ---------- digging, flagging and sniffing ---------- */

/* where one square is from another, in words */
function rel(from, to) {
  const dr = Math.sign(((to / G.w) | 0) - ((from / G.w) | 0)), dc = Math.sign((to % G.w) - (from % G.w));
  if (!dr) return dc < 0 ? 'to its left' : 'to its right';
  if (!dc) return dr < 0 ? 'above it' : 'below it';
  return (dr < 0 ? 'up' : 'down') + ' and to its ' + (dc < 0 ? 'left' : 'right');
}
function findHint() {
  /* a flag on a safe square comes first: it would trip up the numbers around it */
  for (let i = 0; i < G.N; i++) {
    if (G.cells[i] === 1 && !G.tr[i]) return { cell: i, src: [], truffle: false, wrongFlag: true };
  }
  const known = new Int8Array(G.N).fill(-1);
  for (let i = 0; i < G.N; i++) {
    const s = G.cells[i];
    if (s === 2) known[i] = 0; else if (s === 3 || s === 1) known[i] = 1;
  }
  const S = solverState(G.w, G.h, G.num, known);
  const lr = (G.last / G.w) | 0, lc = G.last % G.w;
  const dist = (j) => Math.max(Math.abs(((j / G.w) | 0) - lr), Math.abs(j % G.w - lc));
  const nearest = (steps) => {
    let best = null, bd = 1e9;
    for (const st of steps) for (const j of st.cells) {
      const d = dist(j) + (st.truffle ? 0.5 : 0) + Math.random() * 0.3;
      if (d < bd) { bd = d; best = { step: st, cell: j }; }
    }
    return best;
  };
  const cons = activeConstraints(S);
  return nearest(rule1(S, true)) || nearest(rule2(S, true, cons)) || nearest(rule3(S, false, cons));
}
function hintText(h) {
  if (h.wrongFlag) return 'The pig isn\'t convinced: there\'s no truffle under this flag. Pull it up by holding it (or switch to Flag and tap).';
  const st = h.step, tail = st.truffle ? 'must be a truffle. Flag it!' : 'is safe to dig.';
  if (st.rule === 1) {
    const c = st.c, n = G.num[c.i], u = c.U.length;
    if (!st.truffle) return 'This ' + n + ' already touches ' + (c.K === 1 ? 'a flagged truffle' : WORD[c.K] + ' flagged truffles') + ', so the glowing square is safe to dig.';
    if (!c.K) return 'This ' + n + ' touches exactly ' + WORD[u] + ' covered ' + plural(u, 'square', 'squares') + ', so the glowing one ' + tail;
    return 'This ' + n + ' has ' + WORD[c.K] + ' ' + plural(c.K, 'flag', 'flags') + ' and just ' + WORD[u] + ' covered ' + plural(u, 'square', 'squares') + ' left, so the glowing one ' + tail;
  }
  if (st.rule === 2) {
    const d = st.d, A = d.a, B = d.b, na = G.num[A.i], nb = G.num[B.i], where = rel(A.i, B.i);
    const needs = (C) => (C.K ? 'still needs ' : 'needs ') + WORD[C.need] + ' ' + plural(C.need, 'truffle', 'truffles');
    const ownA = A.U.filter((j) => !B.U.includes(j)).length;
    const rest = (B.K ? 'still needs' : 'needs');
    if (!st.truffle) {
      const first = ownA === 0
        ? 'Every covered square around this ' + na + ' also touches the ' + nb + ' ' + where + ', so this ' + na + '\'s ' + (A.K ? (A.need === 1 ? 'last truffle is' : 'other ' + WORD[A.need] + ' truffles are') : (A.need === 1 ? 'truffle is' : WORD[A.need] + ' truffles are')) + ' next to that ' + nb + ' too.'
        : 'This ' + na + ' ' + needs(A) + ' but has only ' + WORD[ownA] + ' covered ' + plural(ownA, 'square', 'squares') + ' of its own, so ' + WORD[d.t] + ' must touch the ' + nb + ' ' + where + ' too.';
      return first + ' That\'s all that ' + nb + ' ' + rest + ', so the glowing square is safe to dig.';
    }
    const shared = A.U.length - ownA;
    const first = d.t === A.need
      ? 'This ' + na + ' ' + (A.K ? 'still needs only ' : 'needs only ') + WORD[A.need] + ' ' + plural(A.need, 'truffle', 'truffles') + ', so at most ' + WORD[d.t] + ' can be in the squares it shares with the ' + nb + ' ' + where + '.'
      : 'This ' + na + ' shares only ' + WORD[shared] + ' covered ' + plural(shared, 'square', 'squares') + ' with the ' + nb + ' ' + where + '.';
    return first + ' That ' + nb + ' ' + needs(B) + ', so the glowing square must be a truffle. Flag it!';
  }
  return 'Try every way the truffles could fit around these ' + WORD[st.src.length] + ' numbers: the glowing square ' + (st.truffle ? 'always holds a truffle. Flag it!' : 'always comes up clear, so it\'s safe to dig.');
}
function clearHint() {
  clearTimeout(hintTimer);
  if (!G || !G.els) return;
  for (const el of floor.querySelectorAll('.hint,.src')) el.classList.remove('hint', 'src');
}
$('#btnHint').addEventListener('click', () => {
  if (!G || G.over || G.won) return;
  clearHint();
  let h = findHint();
  if (!h) {
    /* never expected: logic always has a next step on these levels, but just in case, point at a safe square */
    for (let i = 0; i < G.N && !h; i++) if (G.cells[i] === 0 && !G.tr[i]) h = { cell: i, src: [], gift: true };
    if (!h) return;
  }
  const src = h.step ? h.step.src : h.src;
  for (const j of src) G.els[j].classList.add('src');
  G.els[h.cell].classList.add('hint');
  showCell(h.cell);
  toast(h.gift ? 'The pig\'s nose is twitching: the glowing square is safe to dig.' : hintText(h), 4600);
  hintTimer = setTimeout(clearHint, 5000);
  setPig('sniff', 1200);
  sfx('hint');
});

/* ---------- win and lose ---------- */
const WIN_TITLES = ['Snout-standing!', 'What a find!', 'Truffle-tastic!', 'Nosed it!', 'A full basket!'];
function win() {
  if (G.won) return;
  G.won = true;
  clearHint(); playCancel();
  $('#restartLabel').textContent = 'Next';
  $('#restartIcon').innerHTML = ICON.chevR;
  save.done[G.idx] = Math.max(save.done[G.idx] || 0, G.lives);
  delete save.cur;
  persist();
  cursor.show = false;
  /* every number takes its full colour back for the finished map */
  for (let i = 0; i < G.N; i++) renderCell(i);
  zoom.reset(true);
  setPig('trot', 2300);
  sfx('win');
  /* dug squares hop in a ripple from the starting clearing */
  const sr = (G.L.start / G.w) | 0, sc = G.L.start % G.w;
  for (let i = 0; i < G.N; i++) G.els[i].style.setProperty('--wd', (Math.hypot(((i / G.w) | 0) - sr, i % G.w - sc) * 0.035).toFixed(2) + 's');
  floor.classList.add('win');
  flyTimers.push(setTimeout(gather, 320));
  winTimer = setTimeout(showWin, 2400);
}
/* every truffle (except the squashed ones) tumbles into the basket */
function gather() {
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const list = [];
  for (let i = 0; i < G.N; i++) if (G.tr[i] && G.cells[i] !== 3) list.push(i);
  const b = $('#basket').getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height * 0.45;
  const gap = Math.min(110, 1300 / Math.max(1, list.length));
  list.sort((p, q) => (p % G.w) - (q % G.w) || p - q).reverse();
  list.forEach((i, k) => {
    flyTimers.push(setTimeout(() => {
      if (!G || !G.won) return;
      const r = G.els[i].getBoundingClientRect();
      G.cells[i] = 6; renderCell(i);
      const land = () => { if (!G || !G.won) return; G.landed++; renderCount(); bumpBasket(); sfx('plop', k); };
      if (calm || !r.width) { land(); return; }
      const f = document.createElement('div');
      f.className = 'flyer';
      const sz = Math.max(18, r.width);
      f.style.width = f.style.height = sz + 'px';
      document.body.appendChild(f);
      const x0 = r.left + r.width / 2 - sz / 2, y0 = r.top + r.height / 2 - sz / 2, x1 = bx - sz / 2, y1 = by - sz / 2;
      const peak = Math.min(y0, y1) - 50 - Math.random() * 30;
      const an = f.animate([
        { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1) rotate(0deg)' },
        { transform: 'translate(' + (x0 + (x1 - x0) * 0.45) + 'px,' + peak + 'px) scale(1.15) rotate(' + (k % 2 ? 160 : -160) + 'deg)', offset: 0.5 },
        { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.5) rotate(' + (k % 2 ? 320 : -320) + 'deg)' }
      ], { duration: 640, easing: 'ease-in-out', fill: 'forwards' });
      an.onfinish = () => { f.remove(); land(); };
    }, k * gap));
  });
}
function stopFlyers() {
  while (flyTimers.length) clearTimeout(flyTimers.pop());
  for (const f of document.querySelectorAll('.flyer')) f.remove();
}
function lose() {
  G.over = true;
  clearHint(); playCancel();
  $('#restartLabel').textContent = 'Retry';
  delete save.cur; persist();
  if (cursor.show) cursor.show = false;
  let k = 0;
  for (let i = 0; i < G.N; i++) {
    if (G.tr[i] && G.cells[i] === 0) { G.cells[i] = 4; renderCell(i); G.els[i].style.setProperty('--d', (k++ * 0.03) + 's'); }
    else if (G.cells[i] === 1 && !G.tr[i]) { G.cells[i] = 5; renderCell(i); }
    else renderCell(i);
  }
  zoom.reset(true);
  setPig('sad');
  sfx('fail');
  winTimer = setTimeout(showLose, 1100);
}
/* the win card: the basket, heaped with this level's truffles, and a very pleased pig */
function haulSVG(found) {
  const shown = Math.max(1, Math.min(found, 13));
  const spots = [[64, 47], [80, 45], [96, 47], [72, 39], [88, 38], [56, 42], [104, 41], [80, 31], [64, 33], [96, 32], [72, 25], [88, 24], [80, 17]];
  let pile = '';
  for (let k = shown - 1; k >= 0; k--) pile += TRUFFLE_G(spots[k][0], spots[k][1], 0.62);
  return '<svg viewBox="0 0 190 122" aria-hidden="true">' +
    '<ellipse cx="95" cy="113" rx="80" ry="7" fill="rgba(60,30,10,.16)"/>' +
    '<path d="M50 54Q80 -6 110 54" fill="none" stroke="#7f4a1d" stroke-width="6" stroke-linecap="round"/><path d="M50 54Q80 -6 110 54" fill="none" stroke="#d29550" stroke-width="2.6" stroke-linecap="round"/>' +
    pile +
    '<path d="M38 52h84l-9 52c-.6 3-3.2 5-6.2 5H53.2c-3 0-5.6-2-6.2-5z" fill="#d6964c" stroke="#7f4a1d" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M42 68h76M45 84h70M47 99h66" stroke="#a8692f" stroke-width="2.4"/><path d="M58 53l3 55M80 53v55M102 53l-3 55" stroke="#a8692f" stroke-width="2.4"/>' +
    '<rect x="34" y="47" width="92" height="10" rx="5" fill="#e6ab62" stroke="#7f4a1d" stroke-width="3"/>' +
    '<g transform="translate(124 64)"><g class="hop"><g transform="translate(64 0) scale(-1 1)">' + PIG_SVG.replace('<svg viewBox="0 0 64 44" aria-hidden="true">', '').replace('</svg>', '') + '</g></g></g>' +
    '</svg>';
}
function showWin() {
  const found = G.L.n - G.squashed;
  const msg = G.squashed
    ? found + ' ' + plural(found, 'truffle', 'truffles') + ' in the basket, and ' + WORD[G.squashed] + ' got a bit squashed.'
    : 'The pig sniffed out all ' + G.L.n + ' truffles without squashing a single one.';
  openModal(
    '<div class="haul">' + haulSVG(found) + '</div>' +
    '<h2>' + WIN_TITLES[G.idx % WIN_TITLES.length] + '</h2>' +
    '<p>' + msg + '</p>' +
    '<div class="badge-row">' + heartsHTML(G.lives, MAX_LIVES) + '</div>' +
    '<div class="stack">' +
    '<button class="btn primary" data-act="next">Next level</button>' +
    '<button class="btn" data-act="levels">Your truffle maps</button>' +
    '<button class="btn" data-act="close">Admire the forest</button>' +
    '</div>'
  );
}
function showLose() {
  openModal(
    '<div class="art"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="18" fill="#efb7a4"/>' + ART.squash + '</svg></div>' +
    '<h2>Out of hearts</h2>' +
    '<p>Three truffles got squashed. The rest are shown on the forest floor. Have another sniff?</p>' +
    '<div class="stack">' +
    '<button class="btn primary" data-act="retry">Try again</button>' +
    '<button class="btn" data-act="close">Look at the floor</button>' +
    '<button class="btn" data-act="levels">Choose level</button>' +
    '</div>'
  );
}

GAME.showHelp = () => {
  openModal(
    '<div class="logo">' + PIG_FACE + '<h2>Truffle Hunt</h2></div>' +
    '<p>Dig up the forest floor without squashing the hidden truffles.</p>' +
    '<ul class="rules">' +
    '<li><span class="mini">' + MINI.num + '</span><span>A dug square shows the pig\'s sniff: how many truffles are in the 8 squares around it.</span></li>' +
    '<li><span class="mini">' + MINI.leaves + '</span><span>Tap leaves to dig. Squares with no truffles nearby open up their neighbours.</span></li>' +
    '<li><span class="mini">' + MINI.stake + '</span><span>Mark truffles you\'ve found with a stick: switch to <b>Flag</b>, or press and hold.</span></li>' +
    '<li><span class="mini">' + MINI.chord + '</span><span>Tap a number whose flags are all placed to dig the rest around it.</span></li>' +
    '<li><span class="mini">' + MINI.squash + '</span><span>Dig a truffle and it\'s squashed. That costs one of your 3 hearts.</span></li>' +
    '<li><span class="mini">' + ICON.hint + '</span><span>Stuck? The bulb shows a square you can work out, and which numbers prove it.</span></li>' +
    '<li><span class="mini">' + ZOOM_ICON.in + '</span><span>Big wood? Pinch to zoom in, then drag to look around.</span></li>' +
    '</ul>' +
    '<p style="font-size:15px;margin-top:-4px">You never have to guess: every hunt can be worked out by logic from the pig\'s first clearing. Finished hunts become maps in your collection.</p>' +
    '<div class="stack"><button class="btn primary" data-act="close">Start sniffing</button></div>'
  );
};

/* ---------- music: a woodland stroll, bassoon and flute with plucked strings and birdsong ---------- */
const bassoon = (t, f, d, v) => {
  tone(t, f, { type: 'sawtooth', a: 0.025, hold: d * 0.2, dur: d * 0.45, vol: v || 0.05, lp: 700, q: 1.5, bus: musicBus });
  tone(t, f * 2, { type: 'triangle', a: 0.02, hold: d * 0.2, dur: d * 0.4, vol: (v || 0.05) * 0.5, bus: musicBus });
};
GAME.music = {
  tempo: 104,
  tracks: [
    { inst: INST.flute, vol: 0.085, seq: track('D5:.5 E5:.5 G5 G5 A5:.5 G5:.5 B5 A5:.5 G5:.5 E5 D5 E5:.5 G5:.5 A5 B5:.5 D6:.5 B5 A5:3 - ' +
      'D5:.5 E5:.5 G5 G5 B5:.5 A5:.5 G5 E5:.5 D5:.5 E5 G5 A5:.5 B5:.5 A5 G5:.5 E5:.5 D5 G5:3 -') },
    { inst: bassoon, vol: 0.06, seq: track('G2 D3 G2 D3 E2 B2 G2 D3 C3 G2 E3 G2 D3 A2 D3 F#3 G2 D3 G2 D3 C3 G2 E3 G2 D3 A2 F#3 A2 G2 D3 G2:2') },
    { inst: INST.pluck, vol: 0.06, seq: track('-:.5 B3:.5 -:.5 D4:.5 -:.5 G4:.5 -:.5 D4:.5 -:.5 G3:.5 -:.5 B3:.5 -:.5 E4:.5 -:.5 B3:.5 ' +
      '-:.5 G3:.5 -:.5 C4:.5 -:.5 E4:.5 -:.5 C4:.5 -:.5 F#3:.5 -:.5 A3:.5 -:.5 D4:.5 -:.5 A3:.5 ' +
      '-:.5 B3:.5 -:.5 D4:.5 -:.5 G4:.5 -:.5 D4:.5 -:.5 G3:.5 -:.5 C4:.5 -:.5 E4:.5 -:.5 C4:.5 ' +
      '-:.5 F#3:.5 -:.5 A3:.5 -:.5 D4:.5 -:.5 A3:.5 -:.5 B3:.5 -:.5 D4:.5 -:.5 G4:.5 -:.5 B3:.5') },
    { inst: INST.knock, perc: true, vol: 0.035, seq: track('x:2 x:2') }
  ],
  ambient() {
    /* now and then, a little bird somewhere in the trees */
    let alive = true, tid = 0;
    const chirp = () => {
      if (!alive || !actx) return;
      const t = actx.currentTime + 0.05, f = 2500 + Math.random() * 900, n = 2 + Math.floor(Math.random() * 3);
      for (let k = 0; k < n; k++) tone(t + k * 0.12, f * (1 + k * 0.05), { type: 'sine', to: f * 1.4, glide: 0.06, a: 0.006, dur: 0.07, vol: 0.016, bus: musicBus });
      tid = setTimeout(chirp, 4000 + Math.random() * 7000);
    };
    tid = setTimeout(chirp, 2500);
    return () => { alive = false; clearTimeout(tid); };
  }
};
function oink(t, p, v) {
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(200 * p, t);
  o.frequency.linearRampToValueAtTime(300 * p, t + 0.06);
  o.frequency.linearRampToValueAtTime(215 * p, t + 0.17);
  f.type = 'bandpass'; f.frequency.value = 1050 * p; f.Q.value = 2.2;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v || 0.2, t + 0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(f); f.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + 0.25);
}
GAME.sfx = {
  /* a soft thud of soil, and leaves rustling (more of them for a bigger clearing) */
  dig(t, n) {
    tone(t, 150, { type: 'sine', to: 70, a: 0.004, dur: 0.14, vol: 0.16 });
    noise(t, { f: 480, q: 0.8, dur: 0.08, vol: 0.07, ftype: 'lowpass' });
    const k = Math.min(7, 1 + Math.floor((n || 1) / 5));
    for (let j = 0; j < k; j++) noise(t + 0.03 + j * 0.055, { f: 3600 + Math.random() * 1800, q: 1.4, dur: 0.07, vol: 0.03 + (j % 2) * 0.012 });
  },
  flag(t, on) {
    tone(t, on ? 760 : 540, { type: 'triangle', to: on ? 600 : 430, a: 0.002, dur: 0.06, vol: 0.1 });
    tone(t + 0.004, on ? 1520 : 1080, { type: 'sine', a: 0.002, dur: 0.03, vol: 0.03 });
    noise(t, { f: 2600, q: 2, dur: 0.03, vol: 0.03 });
  },
  sniff(t) { for (let k = 0; k < 3; k++) noise(t + k * 0.085, { f: 1300, to: 2700, q: 2.4, a: 0.02, dur: 0.055, vol: 0.07 }); },
  hint(t) {
    for (let k = 0; k < 4; k++) noise(t + k * 0.08, { f: 1200, to: 2500, q: 2.4, a: 0.02, dur: 0.05, vol: 0.065 });
    tone(t + 0.38, 1175, { type: 'sine', a: 0.004, dur: 0.22, vol: 0.05 });
    tone(t + 0.47, 1568, { type: 'sine', a: 0.004, dur: 0.26, vol: 0.04 });
  },
  /* a sad little squish, then a droopy two notes */
  squish(t) {
    noise(t, { f: 900, to: 240, q: 2.5, dur: 0.16, vol: 0.09, ftype: 'lowpass' });
    tone(t, 320, { type: 'sine', to: 140, a: 0.01, dur: 0.2, vol: 0.12, vib: 0.04, vibRate: 16 });
    tone(t + 0.3, noteFreq('A4'), { type: 'triangle', a: 0.02, dur: 0.18, vol: 0.07 });
    tone(t + 0.5, noteFreq('F4'), { type: 'triangle', to: noteFreq('E4'), a: 0.02, dur: 0.4, vol: 0.07 });
  },
  plop(t, k) {
    const f = noteFreq('G5') * Math.pow(2, [0, 2, 4, 7, 9, 12, 14, 16, 19, 21][(k || 0) % 10] / 12);
    tone(t, 240, { type: 'sine', to: 120, a: 0.003, dur: 0.07, vol: 0.09 });
    tone(t + 0.01, f, { type: 'sine', a: 0.003, dur: 0.16, vol: 0.05 });
  },
  /* oink oink, then a happy fanfare */
  win(t) {
    oink(t, 1); oink(t + 0.24, 1.18);
    SFX.win(t + 0.55);
  },
  bonk: SFX.bonk
};

/* ---------- boot ---------- */
$('#icoDig').innerHTML = TH_ICON.dig;
$('#icoFlag').innerHTML = TH_ICON.flag;
$('#btnHint').innerHTML = ICON.hint;
const disarmRestart = armConfirm($('#btnRestart'), $('#restartLabel'), 'Restart',
  () => G && !G.won && !G.over && G.acts > 0,
  () => {
    if (G.won) { loadLevel(G.idx + 1); return; }
    delete save.cur; persist(); startLevel(G.idx, G.L);
  });
shellBoot();
loadLevel(save.level || 0);
if (!save.seenHelp) { GAME.showHelp(); save.seenHelp = true; persist(); }
</script>
