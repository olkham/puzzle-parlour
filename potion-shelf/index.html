<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Potion Shelf</title>
<meta name="description" content="A cosy colour-sorting puzzle: pour the herbalist's potions between bottles until each bottle holds just one.">
<meta name="theme-color" content="#f3ece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16121d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Potion Shelf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ece6;
  --card:#fffaf5;
  --card-edge:#e6d8cc;
  --ink:#2b2236;
  --muted:#776c84;
  --accent:#1c8a81;
  --accent-ink:#ffffff;
  --heart:#e5484d;
  --star:#f2b84b;
  --gridink:#2b2236;
  --mini:#d5efeb;
  --shadow:0 10px 28px rgba(60,40,30,.14);
  --scrim:rgba(30,22,40,.55);
  --wall:#efe2d3;
  --wall-dot:rgba(150,105,65,.12);
  --plank:#b98352;
  --plank-hi:#d6a271;
  --plank-edge:#7f5332;
  --glass:rgba(255,255,255,.34);
  --glass-edge:rgba(72,58,92,.5);
  --glass-hi:rgba(255,255,255,.8);
  --cloud:#cbc1d6;
  --cloud-ink:rgba(70,55,95,.55);
  --label:#f8eed6;
  --label-edge:#c6ad80;
  --cork:#bd8a55;
  --cork-dark:#8d5f35;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16121d;
    --card:#221c2c;
    --card-edge:#3a3048;
    --ink:#f3eefb;
    --muted:#aca2c1;
    --accent:#4fd1c5;
    --accent-ink:#0f2e2b;
    --heart:#ff6b86;
    --star:#f6c35b;
    --gridink:#0c0a12;
    --mini:#244a47;
    --shadow:0 10px 28px rgba(0,0,0,.45);
    --scrim:rgba(6,4,14,.7);
    --wall:#2a2235;
    --wall-dot:rgba(255,255,255,.045);
    --plank:#80573a;
    --plank-hi:#9c6d48;
    --plank-edge:#4f331f;
    --glass:rgba(255,255,255,.08);
    --glass-edge:rgba(225,214,245,.5);
    --glass-hi:rgba(255,255,255,.42);
    --cloud:#6f6683;
    --cloud-ink:rgba(235,228,250,.6);
    --label:#efe2c4;
    --label-edge:#a88f62;
    --cork:#a87444;
    --cork-dark:#744a28;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121d;--card:#221c2c;--card-edge:#3a3048;--ink:#f3eefb;--muted:#aca2c1;--accent:#4fd1c5;--accent-ink:#0f2e2b;
  --heart:#ff6b86;--star:#f6c35b;--gridink:#0c0a12;--mini:#244a47;--shadow:0 10px 28px rgba(0,0,0,.45);--scrim:rgba(6,4,14,.7);
  --wall:#2a2235;--wall-dot:rgba(255,255,255,.045);--plank:#80573a;--plank-hi:#9c6d48;--plank-edge:#4f331f;
  --glass:rgba(255,255,255,.08);--glass-edge:rgba(225,214,245,.5);--glass-hi:rgba(255,255,255,.42);--cloud:#6f6683;--cloud-ink:rgba(235,228,250,.6);
  --label:#efe2c4;--label-edge:#a88f62;--cork:#a87444;--cork-dark:#744a28;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
svg{display:block}

.app{
  max-width:480px;margin:0 auto;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;
}

/* header */
.top{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:8px}
.top-left{display:flex;gap:6px}
.top-left .icon-btn{width:44px;height:44px;border-radius:14px}
.top-left .icon-btn svg{width:21px;height:21px}
.icon-btn{
  width:48px;height:48px;border-radius:16px;flex:none;
  background:var(--card);border:2px solid var(--card-edge);
  display:grid;place-items:center;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:default}
.title{text-align:center;line-height:1.05;min-width:0}
.title h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.title p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status row */
.status{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:34px;gap:10px}
.lives{display:flex;gap:6px}
.lives svg{width:30px;height:30px;overflow:visible}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.heart.lost path{fill:none;stroke:var(--muted);opacity:.55}
.lives .heart.pop{animation:heartpop .5s ease}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:14px;color:var(--muted);font-weight:500;margin-right:6px}
.star path{fill:var(--star);stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star.off path{fill:none;stroke:var(--muted);opacity:.5}

/* control hints */
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how > div{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--card-edge);border-radius:16px;
  padding:8px 10px;font-size:14px;font-weight:500;line-height:1.15;color:var(--muted);
}
.how b{color:var(--ink);font-weight:600;display:block}
.how .mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--mini);display:grid;place-items:center;border:2px solid var(--gridink)}
.how .mini svg{width:70%;height:70%}

/* footer */
.foot{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 14px;border-radius:16px;
  background:var(--card);border:2px solid var(--card-edge);
  font-size:16px;font-weight:600;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn[hidden]{display:none}
.foot .btn{font-size:15px;gap:6px;padding:0 10px}
.foot .btn svg{width:18px;height:18px}
.btn .tag{font-size:12px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.switch{width:38px;height:22px;border-radius:99px;background:var(--card-edge);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.btn[aria-pressed="true"] .switch{background:var(--accent)}
.btn[aria-pressed="true"] .switch::after{transform:translateX(16px);background:var(--accent-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.sheet{
  width:100%;max-width:380px;max-height:86dvh;overflow:auto;
  background:var(--card);border:2px solid var(--card-edge);border-radius:26px;
  padding:22px 20px 20px;box-shadow:var(--shadow);text-align:center;
  animation:sheetin .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetin{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:32px;font-weight:700;line-height:1.05}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.3}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sheet .art{width:96px;height:96px;margin:0 auto 10px;display:grid;place-items:center}
.sheet .art svg{width:100%;height:100%;overflow:visible}
.sheet .badge-row{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.sheet .badge-row svg{width:30px;height:30px}
.sheet .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px}
.sheet .logo svg{width:44px;height:44px}
.rules{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.25}
.rules .mini{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mini);border:2.5px solid var(--gridink);display:grid;place-items:center}
.rules .mini svg{width:74%;height:74%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv{
  position:relative;padding:8px 0 7px;border-radius:14px;background:var(--bg);
  border:2px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;min-height:66px;
}
.lv b{font-size:22px;font-weight:600}
.lv small{font-size:12px;color:var(--muted);font-weight:500}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lv.done{background:var(--card)}
.lv .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--card)}
.lv .ok svg{width:11px;height:11px}
.lv .mh{display:flex;gap:2px;margin-top:3px;height:10px}
.lv .mh svg{width:10px;height:10px}
.lv .mh .heart path,.lv .mh .star path{stroke:none}
.lv .mh .lost path,.lv .mh .off path{fill:var(--card-edge);opacity:1}
.pager{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.pager span{font-size:19px;font-weight:600}
.pager .icon-btn{width:44px;height:44px;border-radius:14px}
.spin{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:5px solid var(--card-edge);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;line-height:1.25;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  width:max-content;max-width:min(88vw,420px);text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .top{gap:6px;grid-template-columns:auto 1fr 42px}
  .top-left{gap:4px}
  .top-left .icon-btn{width:40px;height:40px;border-radius:13px}
  .top > .icon-btn{width:42px;height:42px;border-radius:14px}
  .title h1{font-size:23px}
  .foot{gap:8px}
}
@media (max-width:340px){
  .title h1{font-size:19px}
  .title p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- status ---------- */
.status .stars-now{display:flex;gap:4px}
.status .stars-now svg{width:28px;height:28px}
.count{text-align:right;line-height:1.05}
.count .sub{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}

/* ---------- the shelf: a papered wall with wooden planks, bottles standing on them ---------- */
.shelf-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.shelf{
  position:relative;border-radius:24px;background-color:var(--wall);
  background-image:radial-gradient(circle at 25% 30%,var(--wall-dot) 0 2px,transparent 2.6px),radial-gradient(circle at 75% 72%,var(--wall-dot) 0 1.5px,transparent 2.1px);
  background-size:26px 26px,18px 18px;
  box-shadow:0 0 0 2px var(--card-edge),var(--shadow);touch-action:manipulation;
}
.plank{position:absolute;left:10px;right:10px;height:12px;border-radius:5px;background:linear-gradient(var(--plank-hi),var(--plank) 45%,var(--plank-edge));box-shadow:0 5px 8px rgba(60,30,10,.22);pointer-events:none}
.plank::before,.plank::after{content:"";position:absolute;top:100%;width:9px;height:12px;background:var(--plank-edge);border-radius:0 0 4px 4px}
.plank::before{left:12%}
.plank::after{right:12%}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.streams{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:6}

.bottle{position:absolute;cursor:pointer;outline:none;transition:transform .17s cubic-bezier(.3,1.4,.5,1);-webkit-tap-highlight-color:transparent}
.bottle.busy{transition:none;z-index:5}
.bottle .wob{width:100%;height:100%}
.bottle svg{display:block;width:100%;height:100%;overflow:visible}
.bottle.nope .wob{animation:nope .35s ease}
@keyframes nope{25%{transform:translateX(-6px) rotate(-3deg)}50%{transform:translateX(5px) rotate(2deg)}75%{transform:translateX(-3px)}}
.bottle:focus-visible .wob{outline:3px solid var(--accent);outline-offset:5px;border-radius:14px}
.bottle.done{cursor:default}
.bottle.hint .wob{animation:hintp 1s ease-in-out 3}
@keyframes hintp{50%{filter:drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 2px var(--accent))}}
.bottle .back{fill:var(--glass)}
.bottle .front{fill:none;stroke:var(--glass-edge)}
.bottle .lip{fill:var(--glass);stroke:var(--glass-edge)}
.bottle .shine{fill:var(--glass-hi)}
.bottle .shadow{fill:rgba(40,20,10,.16)}
.bottle .q{font-family:'Fredoka',ui-rounded,system-ui,sans-serif;font-weight:700;fill:var(--cloud-ink);text-anchor:middle;dominant-baseline:central}
.bottle .flash{fill:#fff;animation:flash .6s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.cork{transform-box:fill-box;transform-origin:50% 100%;animation:cork .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cork{from{transform:translateY(-70%) scale(1.15);opacity:0}to{transform:none;opacity:1}}
.tag-label{transform-box:fill-box;transform-origin:50% 0;animation:label .45s ease .18s both}
@keyframes label{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.calm .cork,.calm .tag-label{animation:none}

/* little celebrations */
.bubble{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);pointer-events:none;z-index:7;animation:rise var(--d,1.3s) ease-out forwards}
@keyframes rise{from{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}to{transform:translate(var(--dx,0),var(--dy,-90px)) scale(1);opacity:0}}
.sparkle{position:absolute;width:14px;height:14px;pointer-events:none;z-index:7;animation:twinkle .7s ease-out forwards}
.sparkle svg{width:100%;height:100%;overflow:visible}
@keyframes twinkle{from{transform:translate(0,0) scale(.2) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg);opacity:0}}

/* footer: four buttons share a phone's width */
.btn.sq{flex:0 0 52px;padding:0}
@media (max-width:400px){
  #restartIcon{display:none}
  .foot{gap:8px}
  .foot .btn{padding:0 8px}
}

/* level picker: finished levels show their bottles */
.lv .thumb{width:44px;height:30px;display:grid;place-items:center;margin-bottom:2px}
.lv .thumb svg{max-width:100%;max-height:100%}
.lv.done small{font-weight:600;color:var(--ink)}
.sheet .art svg{overflow:visible}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="btnLevels" aria-label="Choose level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnMusic" aria-label="Turn music on" aria-pressed="false"><span id="musicIcon"></span></button>
      <button class="icon-btn" id="btnSfx" aria-label="Turn sound effects on" aria-pressed="false"><span id="sfxIcon"></span></button>
    </div>
    <div class="title"><h1 id="lvTitle">Level 1</h1><p id="lvSub">&nbsp;</p></div>
    <button class="icon-btn" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 16.9v.1"/></svg>
    </button>
  </header>

  <section class="status" aria-label="Rating and pours">
    <div class="stars-now" id="starsNow" aria-live="polite"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="shelf-wrap" id="shelfWrap">
    <div class="shelf" id="shelf" role="application" aria-label="Potion bottles. Tap a bottle to pick it up, then tap another bottle to pour into it. Arrow keys move between bottles, Enter picks up and pours."></div>
  </div>

  <footer class="foot" id="foot">
    <button class="btn" id="btnRestart"><span id="restartIcon"></span><span id="restartLabel">Restart</span></button>
    <button class="btn" id="btnUndo"><span id="undoIcon"></span><span>Undo</span></button>
    <button class="btn sq" id="btnHint" aria-label="Show a good pour"></button>
    <button class="btn" id="btnExtra" aria-label="Add a spare flask (once per level)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h5M10 3v6.2L5.6 17.4A2.4 2.4 0 0 0 7.7 21H13"/><path d="M13 3v6.2l2 3.6"/><path d="M18 14v6M15 17h6"/></svg><span>Flask</span></button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<script>
const GAME = { id: 'potion-shelf', seed: 10391 };
/* =====================================================================
   Shared shell: saves, seeded randomness, icons, live-synthesised audio,
   modals, toasts and the level picker. The game code below plugs into it
   through the GAME object and a loadLevel(idx) function.
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const scrim = $('#scrim');
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* ---------- saved progress (private to this browser) ---------- */
const STORE_KEY = GAME.id + '-v1';
let save = Object.assign({ done: {}, seenHelp: false, level: 0 }, GAME.saveDefaults || {});
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') save = Object.assign(save, p); }
} catch (e) {}
if (!save.done || typeof save.done !== 'object') save.done = {};
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- seeded randomness, so level N is the same puzzle on every device ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function seedFor(idx, salt) {
  let h = (0x9e3779b9 ^ (GAME.seed || 0)) >>> 0;
  h = Math.imul(h ^ (idx + 1), 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h ^ ((salt || 0) + 0x27d4eb2f), 0xc2b2ae35); h ^= h >>> 16;

    '<path d="M42 54c0-6 4-8 4-12V30h12v12c0 4 4 6 4 12v24a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="' + c(1) + '" stroke="#5a4870" stroke-width="2.2"/><rect x="44" y="24" width="16" height="7" rx="3.5" fill="#fff" fill-opacity=".5" stroke="#5a4870" stroke-width="2.2"/><rect x="47" y="16" width="10" height="10" rx="3" fill="#bd8a55" stroke="#8d5f35" stroke-width="2"/>' +
    '<path d="M68 46h18v34a9 9 0 0 1-18 0z" fill="' + c(2) + '" stroke="#5a4870" stroke-width="2.2"/><rect x="66" y="40" width="22" height="7" rx="3.5" fill="#fff" fill-opacity=".5" stroke="#5a4870" stroke-width="2.2"/><rect x="70" y="32" width="14" height="10" rx="3" fill="#bd8a55" stroke="#8d5f35" stroke-width="2"/>' +
    '<rect x="45" y="58" width="14" height="12" rx="2" fill="#f8eed6" stroke="#c6ad80" stroke-width="1.4"/>' +
    '<path d="M19 50v20M73 56v16" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M30 12l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5zM80 14l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" fill="#f6c35b"/></svg>';
}
function showWin(stars) {
  const names = G.L.cols.map((c) => POTIONS[c].name);
  const some = names.length > 3 ? names.slice(0, 2).join(', ') + ' and ' + (names.length - 2) + ' more' : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  openModal(
    '<div class="art">' + winArt(G.L.cols) + '</div>' +
    '<h2>' + WIN_TITLES[G.idx % WIN_TITLES.length] + '</h2>' +
    '<p>' + some + ' bottled in ' + G.moves + ' pour' + (G.moves === 1 ? '' : 's') + (G.moves <= G.par ? ', on par!' : '. Par is ' + G.par + '.') + '</p>' +
    '<div class="badge-row">' + starsHTML(stars) + '</div>' +
    (stars < 3 && (G.hints || G.extra) ? '<p style="font-size:15px;margin-top:-6px">Finish without a hint or spare flask for three stars.</p>' : '') +
    '<div class="stack">' +
    '<button class="btn primary" data-act="next">Next brew</button>' +
    '<button class="btn" data-act="levels">Your shelf</button>' +
    '<button class="btn" data-act="retry">Brew it again</button>' +
    '</div>'
  );
}

/* ---------- help ---------- */
function miniBottle(fills, corked) {
  let g = '<path d="M7 3.5h10V18a5 5 0 0 1-10 0z" fill="rgba(255,255,255,.35)" stroke="currentColor" stroke-width="1.6"/>';
  fills.forEach((c, k) => { const y = 19.5 - k * 4.3; g += '<path d="M8 ' + (y - 3.7) + 'h8V' + (k === 0 ? (y - 1.2) + 'a4 4 0 0 1-8 0z' : y + 'H8z') + '" fill="' + POTIONS[c].col + '"/>'; });
  if (corked) g += '<rect x="8.2" y="1" width="7.6" height="4" rx="1.3" fill="#bd8a55" stroke="#8d5f35" stroke-width=".8"/>';
  return '<svg viewBox="0 0 24 24">' + g + '</svg>';
}
GAME.showHelp = () => {
  openModal(
    '<div class="logo">' + '<svg viewBox="0 0 96 96" style="width:52px;height:52px">' + winArt([8, 5, 0]).replace(/^<svg[^>]*>|<\/svg>$/g, '') + '</svg>' + '<h2>Potion Shelf</h2></div>' +
    '<p>The herbalist\'s potions have got all mixed up!</p>' +
    '<ul class="rules">' +
    '<li><span class="mini">' + miniBottle([7, 0, 8]) + '</span><span>Tap a bottle to pick it up, then tap another bottle to pour into it.</span></li>' +
    '<li><span class="mini">' + miniBottle([4, 8]) + '</span><span>You can only pour onto the same colour, or into an empty bottle.</span></li>' +
    '<li><span class="mini">' + miniBottle([5, 5, 5, 5], true) + '</span><span>Four of one colour corks the bottle. Bottle every potion to win.</span></li>' +
    '<li><span class="mini"><span class="star">' + ICON.star + '</span></span><span>Finish in par pours for three stars. A hint or the spare flask caps it at two.</span></li>' +
    '</ul>' +
    '<p style="font-size:15px;margin-top:-4px">Matching colours on top pour together, as much as fits. Each potion has its own sparkles, so you can tell them apart by more than colour. In cloudy brews, the lower measures stay hidden until they\'re uncovered.</p>' +
    '<div class="stack"><button class="btn primary" data-act="close">Start brewing</button></div>'
  );
};

/* ---------- music: a gentle apothecary waltz, with the odd bubble from the cauldron ---------- */
GAME.music = {
  tempo: 100,
  tracks: [
    { inst: INST.bell, vol: 0.1, seq: track('A4 C5 E5 D5:1.5 C5:.5 B4 G4:2 B4 C5 E5 A5 G5:2 F5 E5 D5 E5 C5:1.5 B4:.5 A4 A4:2 -') },
    { inst: INST.harp, vol: 0.065, seq: track('A2 E3 A3 D3 F3 A3 G2 D3 B3 C3 G3 C4 F2 C3 A3 E2 B2 G3 D3 A3 F3 A2 E3 A3') },
    { inst: INST.bass, vol: 0.09, seq: track('A2:3 D2:3 G2:3 C2:3 F2:3 E2:3 D2:3 A2:3') }
  ],
  ambient() {
    let alive = true, timer = 0;
    const blip = () => {
      if (!alive || !actx) return;
      const t = actx.currentTime + 0.02, f = 380 + Math.random() * 520;
      tone(t, f, { type: 'sine', to: f * 1.9, a: 0.004, dur: 0.07, vol: 0.022, bus: musicBus });
      if (Math.random() < 0.5) tone(t + 0.09, f * 1.2, { type: 'sine', to: f * 2.2, a: 0.004, dur: 0.05, vol: 0.014, bus: musicBus });
      timer = setTimeout(blip, 900 + Math.random() * 2200);
    };
    timer = setTimeout(blip, 1200);
    return () => { alive = false; clearTimeout(timer); };
  }
};
GAME.sfx = {
  pick(t) { tone(t, 1760, { type: 'sine', a: 0.002, dur: 0.12, vol: 0.06 }); tone(t, 2637, { type: 'sine', a: 0.002, dur: 0.08, vol: 0.025 }); },
  drop(t) { tone(t, 1320, { type: 'sine', to: 1050, a: 0.003, dur: 0.08, vol: 0.05 }); },
  /* glugs that climb as the bottle fills */
  pour(t, n, dur) {
    dur = dur || 0.4;
    const count = Math.max(3, Math.round(dur * 10));
    for (let k = 0; k < count; k++) {
      const tt = t + k * dur / count, f = 260 + (k / count) * 380 + Math.random() * 40;
      tone(tt, f, { type: 'sine', to: f * 1.7, a: 0.004, dur: 0.055, vol: 0.075 });
      noise(tt, { f: 700 + k * 50, q: 5, dur: 0.035, vol: 0.018 });
    }
  },
  cork(t) {
    tone(t, 540, { type: 'sine', to: 150, a: 0.002, dur: 0.1, vol: 0.16 });
    noise(t, { f: 2600, q: 1.4, dur: 0.03, vol: 0.08 });
    SFX.chime(t + 0.12, 6); SFX.chime(t + 0.2, 8);
  },
  reveal(t) { tone(t, 990, { type: 'sine', to: 1480, a: 0.01, dur: 0.25, vol: 0.04 }); },
  hint(t) { tone(t, 1320, { type: 'sine', a: 0.004, dur: 0.25, vol: 0.06 }); tone(t + 0.09, 1760, { type: 'sine', a: 0.004, dur: 0.3, vol: 0.05 }); },
  whoosh(t) { noise(t, { f: 600, to: 3000, q: 0.7, dur: 0.3, vol: 0.06 }); },
  win(t) {
    SFX.win(t);
    [0, 3, 7, 12, 15, 19, 24].forEach((s, k) => tone(t + 0.55 + k * 0.07, noteFreq('A5') * Math.pow(2, s / 12), { type: 'sine', a: 0.003, dur: 0.35, vol: 0.04 }));
  },
  bonk: SFX.bonk
};

/* ---------- boot ---------- */
$('#undoIcon').innerHTML = ICON.undo;
$('#restartIcon').innerHTML = ICON.restart;
$('#btnHint').innerHTML = ICON.hint;
const disarmRestart = armConfirm($('#btnRestart'), $('#restartLabel'), 'Restart',
  () => G && !G.won && G.moves > 0,
  () => {
    if (G.won) { loadLevel(G.idx + 1); return; }
    delete save.cur; persist();
    startLevel(G.idx, G.L);
  });
shellBoot();
loadLevel(save.level || 0);
if (!save.seenHelp) { GAME.showHelp(); save.seenHelp = true; persist(); }
</script>
